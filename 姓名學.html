<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>姓名學・三才五格|抱朴隨緣堂</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0F0C0A;color:#EDE7DA;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:15px;line-height:1.78}
button,input,select{color:inherit;font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 34px}
.hero{text-align:center;padding:20px 16px 15px;border-bottom:1px solid rgba(201,169,106,.22)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:22px;letter-spacing:.14em;color:#E0C285;font-weight:900}
.hero p{font-size:12.5px;opacity:.62;margin-top:5px}
.box{background:#1A1613;border:1px solid rgba(201,169,106,.22);border-radius:14px;padding:15px 17px;margin-top:12px}
.box h3{font-family:'Noto Serif TC',serif;font-size:16px;color:#E0C285;letter-spacing:.1em;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row label{font-weight:700;color:#C9A96A}
.wx{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;margin:0 2px}
.wx-木{background:rgba(143,196,154,.2);color:#8FC49A}.wx-火{background:rgba(229,138,121,.2);color:#F0A797}
.wx-土{background:rgba(201,169,106,.22);color:#E0C285}.wx-金{background:rgba(237,231,218,.16);color:#EDE7DA}
.wx-水{background:rgba(138,176,206,.22);color:#A8C8E0}
.pil{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pil .p{background:#221C16;border:1px solid rgba(201,169,106,.24);border-radius:11px;padding:11px 6px;text-align:center}
.pil .p b{display:block;font-size:11.5px;color:#C9A96A;letter-spacing:.1em;margin-bottom:3px}
.pil .p .gz{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:900;color:#F0D9A0;line-height:1.35}
label{font-size:13px;opacity:.8;min-width:58px}
input,select{background:#221C16;border:1px solid rgba(201,169,106,.32);border-radius:10px;
  padding:10px 12px;font-size:16px;min-height:44px}
input[type=number]{width:78px}
.ch{width:64px;text-align:center}
.hint{font-size:12px;opacity:.62;line-height:1.75;margin-top:4px}
.btn{min-height:50px;border-radius:12px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid rgba(201,169,106,.4);background:#221C16}
.btn.pri{background:linear-gradient(135deg,#E0BD78,#B8923F);color:#1A1410;border-color:transparent}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}
.gc{background:#221C16;border:1px solid rgba(201,169,106,.24);border-radius:11px;padding:10px 6px;text-align:center}
.gc b{display:block;font-size:11.5px;color:#C9A96A;letter-spacing:.08em}
.gc .n{font-family:'Noto Serif TC',serif;font-size:26px;font-weight:900;color:#F0D9A0;line-height:1.2}
.gc .w{font-size:12px;opacity:.75}
.gc .t{font-size:11px;border-radius:99px;padding:1px 7px;display:inline-block;margin-top:3px}
.t-大吉{background:rgba(143,196,154,.2);color:#8FC49A}
.t-吉{background:rgba(201,225,176,.16);color:#C9E0B0}
.t-半吉{background:rgba(201,169,106,.18);color:#E0C285}
.t-凶{background:rgba(229,138,121,.18);color:#E58A79}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:10px}
th,td{border:1px solid rgba(201,169,106,.22);padding:8px 10px;text-align:left;vertical-align:top}
th{background:rgba(201,169,106,.17);color:#E8CE95;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}
.warn{border-left:3px solid #E58A79;background:rgba(229,138,121,.07);border-radius:0 10px 10px 0;padding:10px 13px;font-size:13.5px;margin-bottom:9px}
.good{border-left:3px solid #8FC49A;background:rgba(143,196,154,.07);border-radius:0 10px 10px 0;padding:10px 13px;font-size:13.5px;margin-bottom:9px}
.act{border-left:3px solid #C9A96A;background:rgba(201,169,106,.07);border-radius:0 10px 10px 0;padding:10px 13px;font-size:13.5px}
#out{display:none}
.foot{font-size:11.5px;opacity:.45;text-align:center;padding:24px 10px 8px;line-height:1.85}
@media print{.hero,#in,.btn{display:none!important}body{background:#fff;color:#000}
  th{background:#f2ead6!important;color:#3a2f18!important}td,th{border-color:#b9a274}}
</style></head><body>
<div class="hero"><h1>姓 名 學</h1><p>三才五格剖象・八十一數理・生肖喜忌</p></div>
<div class="wrap">
  <div class="box" id="in">
    <h3>輸入姓名筆劃</h3>
    <div class="row"><label>姓　氏</label>
      <input id="s1c" class="ch" placeholder="姓" maxlength="1"><input id="s1" type="number" placeholder="劃" min="1">
      <input id="s2c" class="ch" placeholder="複姓" maxlength="1"><input id="s2" type="number" placeholder="劃" min="1"></div>
    <div class="row"><label>名　字</label>
      <input id="n1c" class="ch" placeholder="名一" maxlength="1"><input id="n1" type="number" placeholder="劃" min="1">
      <input id="n2c" class="ch" placeholder="名二" maxlength="1"><input id="n2" type="number" placeholder="劃" min="1"></div>
    <div class="row"><label>出生日</label><input id="bd" type="date" style="width:170px"><input id="bt" type="time" style="width:120px"><select id="sex"><option value="1">男</option><option value="0">女</option></select></div><div class="row"><label>出生年</label><input id="by" type="number" placeholder="西元" style="width:110px"><span class="hint" id="zod"></span></div><div class="hint">填完整出生日與時辰,系統會排四柱、判日主強弱、定喜用五行,再反推名字該補什麼。只填年份則僅論生肖。</div>
    <div class="hint"><b style="color:#E0C285">筆劃務必用康熙字典筆劃</b>,與現在的寫法不同。字打進去只是為了報告上好看,<b>算的是你填的劃數</b>——我不內建字典,寧可讓你自己查對,也不給你一個可能算錯的數字。常見特例見下方對照表。</div>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" id="go">開始論名</button><button class="btn" id="prt">列印報告</button></div>
  </div>
  <div id="out"></div>
  <div class="box"><h3>康熙筆劃常見特例</h3>
    <table id="kx"><tr><th>部首</th><th>作</th><th>例</th></tr></table>
    <div class="hint">其餘字請查康熙字典或線上康熙筆劃查詢。同一個字在不同字典可能差一劃,取用時請固定一套來源。</div></div>
  <div class="foot">本module採熊崎氏三才五格剖象法,並參生肖喜忌。<br>姓名之說為傳統命理歸納,僅供參考,不構成醫療、財務或法律建議。</div>
</div>
<script src="pack.js"></script>
<script src="lock.js?v=6"></script>
<script src="report.js"></script>
<script src="name81.js?v=1"></script>
<script src="bazi.js?v=1"></script>
<script src="case.js?v=7"></script>
<script>
var B=BPNAME;
document.getElementById('kx').innerHTML+=B.KANGXI_NOTE.map(function(x){
  return '<tr><td>'+x[0]+'</td><td class="c">'+x[1]+'</td><td>'+x[2]+'</td></tr>'}).join('');
document.getElementById('s1c').oninput=function(){
  var v=B.SURNAME[this.value.trim()]; if(v)document.getElementById('s1').value=v; };
document.getElementById('bd').onchange=function(){
  var v=this.value; if(!v)return;
  var e=document.getElementById('by'); e.value=parseInt(v.slice(0,4),10); e.oninput.call(e); };
document.getElementById('by').oninput=function(){
  var y=parseInt(this.value,10);
  document.getElementById('zod').textContent=(y>1900&&y<2200)?('生肖:'+B.zodiacOf(y)):''; };
function val(id){var v=parseInt(document.getElementById(id).value,10);return (v>0)?v:0}
function txt(id){return document.getElementById(id).value.trim()}
document.getElementById('go').onclick=function(){
  var s=[val('s1')].concat(val('s2')?[val('s2')]:[]);
  var n=[val('n1')].concat(val('n2')?[val('n2')]:[]);
  if(!s[0]||!n[0]){alert('請至少填入姓與名第一字的筆劃');return}
  var g=B.grids(s,n);
  var name=txt('s1c')+txt('s2c')+txt('n1c')+txt('n2c');
  var by=parseInt(document.getElementById('by').value,10);
  var zod=(by>1900&&by<2200)?B.zodiacOf(by):null;
  var sc=B.sancai(g.天格,g.人格,g.地格);
  function cell(k,v){
    var d=B.N81[((v-1)%81)+1]||['—','—','—'];
    return '<div class="gc"><b>'+k+'</b><div class="n">'+v+'</div><div class="w">'+B.wuxing(v)+
      '</div><span class="t t-'+d[0]+'">'+d[0]+'</span></div>'; }
  var h='<div class="box"><h3>'+(name?name+'　':'')+'五格與數理</h3>';
  h+='<div class="g5">'+['天格','人格','地格','外格','總格'].map(function(k){return cell(k,g[k])}).join('')+'</div>';
  h+='<table><tr><th>格</th><th>數</th><th>五行</th><th>吉凶</th><th>數名</th><th>所主</th></tr>';
  [['天格','祖蔭與少年運,本身不單獨論吉凶'],['人格','命之主體,主性格與一生際遇,<b>最重</b>'],
   ['地格','前運與子女、部屬,主 36 歲前'],['外格','外在環境、人際與機遇'],
   ['總格','後運,主 36 歲以後之總成']].forEach(function(p){
    var v=g[p[0]], d=B.N81[((v-1)%81)+1]||['—','—','—'];
    h+='<tr><td>'+p[0]+'</td><td class="c">'+v+'</td><td class="c">'+B.wuxing(v)+
       '</td><td class="c"><span class="t t-'+d[0]+'">'+d[0]+'</span></td><td class="c">'+d[1]+
       '</td><td>'+d[2]+'<br><span style="opacity:.6;font-size:12.5px">'+p[1]+'</span></td></tr>'; });
  h+='</table></div>';
  h+='<div class="box"><h3>三才配置　'+sc.配置+'</h3>';
  h+='<div class="'+(sc.score>=1?'good':sc.score<0?'warn':'act')+'"><b>'+sc.kind+'</b>　天'+sc.天+'・人'+sc.人+'・地'+sc.地+
     '(天人'+sc.天人+'、人地'+sc.人地+')</div>';
  h+='<div style="font-size:13.5px;line-height:1.9">'+sc.notes.map(function(x){return '・'+x}).join('<br>')+'</div>';
  h+='<div class="hint" style="margin-top:8px">三才論的是格與格之間的生剋,與單格數理吉凶要合看。數理雖吉而三才相剋者,仍主一生用力多而收成少。</div></div>';
  if(zod){ var z=B.Z_LIKE[zod];
    h+='<div class="box"><h3>生肖喜忌　'+by+' 年'+zod+'</h3><div class="good"><b>喜用部首</b>　'+z.y+
      '</div><div class="warn"><b>忌用部首</b>　'+z.n+'</div><div class="hint">生肖姓名學看的是字的<b>部首與字義</b>,與筆劃數理是兩套系統,兩者相合最佳;若有衝突,以數理與三才為主、生肖為輔。</div></div>'; }
  /* ── 八字喜用 ── */
  var bdv=document.getElementById('bd').value, btv=document.getElementById('bt').value;
  var fav=null;
  function WXS(c){return '<span class="wx wx-'+c+'">'+c+'</span>';}
  if(bdv&&window.BPBAZI){
    var Y=+bdv.slice(0,4),M2=+bdv.slice(5,7),D2=+bdv.slice(8,10);
    var hh=btv?(+btv.slice(0,2)+(+btv.slice(3,5))/60):12;
    var pil=BPBAZI.pillars(Y,M2,D2,hh); fav=BPBAZI.favor(pil);
    h+='<div class="box"><h3>八字喜用</h3>';
    h+='<div class="pil">'+[['年柱',pil.year],['月柱',pil.month],['日柱',pil.day],['時柱',pil.hour]]
      .map(function(x){return '<div class="p"><b>'+x[0]+'</b><span class="gz">'+x[1].gan+'<br>'+x[1].zhi+'</span></div>';}).join('')+'</div>';
    if(!btv)h+='<div class="hint" style="margin-bottom:8px">未填出生時間,時柱以午時暫代。時柱會影響喜用判斷,建議補填。</div>';
    h+='<div class="'+(fav.strength.warn?'warn':'act')+'"><b>日主 '+pil.day.gan+WXS(fav.strength.dayWX)+'　'+fav.strength.kind+'</b>(強弱指數 '+fav.strength.score+')<br>'+
       fav.text.replace(/[木火土金水]/g,function(c){return WXS(c);})+'</div>';
    if(fav.strength.warn)h+='<div class="warn"><b>需人工判斷</b><br>'+fav.strength.warn+'</div>';
    h+='<div class="good"><b>名字宜補 '+WXS(fav.primary)+'</b><br>常用部首與字例:'+BPBAZI.WX_RADICAL[fav.primary]+
       '<br>數理五行亦可取 '+WXS(fav.primary)+'('+BPBAZI.WX_STROKE[fav.primary]+')</div>';
    var conflict=[];
    ['人格','地格','總格'].forEach(function(k){
      var w2=B.wuxing(g[k]);
      if(fav.avoid.indexOf(w2)>=0)conflict.push(k+' 為'+w2+',屬忌神');
    });
    h+=conflict.length
      ?'<div class="warn"><b>與八字衝突</b><br>'+conflict.join('、')+'。數理雖吉,但補到忌神之五行,力道相抵,建議改字。</div>'
      :'<div class="good">五格五行未觸及忌神,與八字不相衝。</div>';
    h+='<div class="hint" style="margin-top:8px">喜用神以扶抑法推算,地支藏干只取本氣。從格、化格、專旺格須人工複核。八字為本、姓名為輔,兩者相合方為上選。</div></div>';
  }
  var bad=[];
  [['人格',g.人格],['總格',g.總格],['地格',g.地格],['外格',g.外格]].forEach(function(p){
    var d=B.N81[((p[1]-1)%81)+1]; if(d&&d[0]==='凶')bad.push(p[0]+' '+p[1]+'('+d[1]+')'); });
  h+='<div class="box"><h3>綜合斷語</h3>';
  if(!bad.length&&sc.score>=1){ h+='<div class="good">五格數理無凶,三才配置'+sc.kind+',此名可用。</div>'; }
  else{
    h+='<div class="warn">'+(bad.length?'<b>數理見凶:</b>'+bad.join('、')+'<br>':'')+
      (sc.score<0?'<b>三才配置'+sc.kind+'</b>,格局之間相剋。':'')+'</div>';
    h+='<div class="act"><b>調整方向</b><br>人格與總格最重,若此二格見凶,建議<b>更動名字用字的筆劃</b>使其落在吉數。改動時先固定姓氏筆劃,再試名字各字劃數,務求人格、總格、地格皆吉,且三才不相剋。若為新生兒命名,可再配合八字喜用五行選字,兼顧生肖部首。</div>'; }
  h+='<div class="hint" style="margin-top:8px">姓名為後天之助,能補命局之不足,但不能取代八字本命。對客戶說明時宜如實表述,不可誇大。</div></div>';
  var o=document.getElementById('out'); o.innerHTML=h; o.style.display='block';
  o.scrollIntoView({behavior:'smooth',block:'start'});
  window.__nm={name:name,g:g,sc:sc,zod:zod,by:by};
};
document.getElementById('prt').onclick=function(){
  var o=document.getElementById('out');
  if(o.style.display==='none'||!o.innerHTML){alert('請先按「開始論名」');return}
  var m=window.__nm||{};
  if(window.BPRPT)BPRPT.print({title:'姓名論斷書',
    meta:[['姓名',m.name||'—'],['出生年',(m.by||'—')+(m.zod?'('+m.zod+')':'')],
          ['三才',m.sc?m.sc.配置:'—'],['論斷日期',new Date().toLocaleDateString('zh-TW')]],
    html:o.innerHTML});
  else window.print(); };
(function sub(n){
  if(window.BPCASE&&BPCASE.on){
    BPCASE.on(function(c){ if(!c)return;
      var y=c.by||(c.birth?parseInt(String(c.birth).slice(0,4),10):0);
      var e=document.getElementById('by');
      if(y&&!e.value){e.value=y;e.oninput.call(e)}
      var nm=document.getElementById('s1c');
      if(c.name&&!nm.value){nm.value=String(c.name).charAt(0);nm.oninput.call(nm)} });
    return; }
  if(n<40)setTimeout(function(){sub(n+1)},100); })(0);
</script>

<script>
/* ── 判語與八字喜用為付費內容 ──
   五格數字、五行、吉凶標記免費(客戶看得到算得出來);
   數理判語、三才論述、八字喜用與選字建議為收費部分。 */
(function(){
  function card(title,desc){
    return '<div style="background:#221C16;border:1px solid rgba(201,169,106,.4);border-radius:12px;'+
      'padding:16px 15px;margin:8px 0;text-align:center">'+
      '<div style="font-family:\'Noto Serif TC\',serif;font-size:15px;color:#E0C285;margin-bottom:5px">'+title+'</div>'+
      '<div style="font-size:12.5px;opacity:.8;line-height:1.85;max-width:420px;margin:0 auto 10px">'+desc+'</div>'+
      '<div style="font-size:11.5px;opacity:.72;margin-bottom:9px">NT$699 一次付清,'+
      '<b style="color:#E0C285">全站深解永久開啟</b></div>'+
      '<button class="bpsy-btn" data-bpsy-open>🔑 解碼 NT$699 永久</button></div>';
  }
  function gate(){
    if(window.BPSY && BPSY.ok())return;
    var O=document.getElementById('out');
    if(!O || !O.innerHTML || O.getAttribute('data-bp-gated'))return;
    O.setAttribute('data-bp-gated','1');
    var boxes=O.querySelectorAll('.box');
    for(var i=0;i<boxes.length;i++){
      var b=boxes[i], h=b.querySelector('h3'), title=h?h.textContent:'';
      if(title.indexOf('五格與數理')>=0){
        /* 保留五格卡片,移除判語表 */
        var tb=b.querySelector('table'); if(tb)tb.parentNode.removeChild(tb);
        var d=document.createElement('div');
        d.innerHTML=card('數理判語・尚未解碼','八十一數理逐格判語、數名與所主。上方五格數字、五行與吉凶標記為免費功能。');
        b.appendChild(d);
      } else if(title.indexOf('三才配置')>=0 || title.indexOf('八字喜用')>=0 || title.indexOf('綜合斷語')>=0){
        var keep=h?h.outerHTML:'';
        b.innerHTML=keep+card(title.replace(/　.*$/,'')+'・尚未解碼',
          title.indexOf('八字')>=0
            ? '四柱排盤、日主強弱、喜用五行,以及名字該補什麼五行、用哪些部首選字。'
            : (title.indexOf('三才')>=0 ? '天人地三格生剋論述與一生際遇之判。' : '五格與八字是否相衝、該如何調整用字。'));
      }
    }
    if(window.BPSY && BPSY.bind)BPSY.bind();
  }
  var g=document.getElementById('go');
  if(g)g.addEventListener('click',function(){ setTimeout(gate,250); setTimeout(gate,800); });
  setTimeout(gate,600);
})();
</script>
</body></html>
