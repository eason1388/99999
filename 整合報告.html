<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整合勘輿報告書・抱朴隨緣堂</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0F0C0A;color:#EDE7DA;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:15px;line-height:1.78}
button{color:inherit;font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 34px}
.hero{text-align:center;padding:20px 16px 15px;border-bottom:1px solid rgba(201,169,106,.22)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:22px;letter-spacing:.14em;color:#E0C285;font-weight:900}
.hero p{font-size:12.5px;opacity:.62;margin-top:5px}

.tools{display:flex;gap:9px;margin:14px 0}
.tools button{flex:1;min-height:52px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid rgba(201,169,106,.4);background:#221C16}
.tools button.pri{background:linear-gradient(135deg,#E0BD78,#B8923F);color:#1A1410;border-color:transparent}

/* 報告本體 */
#rpt{background:#15120F;border:1px solid rgba(201,169,106,.22);border-radius:14px;padding:20px 22px}
.rh{text-align:center;padding-bottom:14px;border-bottom:2px solid rgba(201,169,106,.4)}
.rh .seal{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;border:2px solid #C9A96A;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;
  font-weight:900;color:#C9A96A;font-size:22px}
.rh h2{font-family:'Noto Serif TC',serif;font-size:21px;letter-spacing:.16em;color:#E0C285;font-weight:900}
.rh .s{font-size:12px;opacity:.6;margin-top:4px;letter-spacing:.1em}

h3{font-family:'Noto Serif TC',serif;font-size:16.5px;color:#E0C285;letter-spacing:.12em;
  margin:24px 0 10px;padding-bottom:7px;border-bottom:1px solid rgba(201,169,106,.3)}
h3 .no{font-size:12px;opacity:.5;margin-right:8px;letter-spacing:0}
h4{font-family:'Noto Serif TC',serif;font-size:14.5px;color:#E8CE95;margin:14px 0 6px}
p{margin:0 0 9px}
.muted{opacity:.6;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:11px}
th,td{border:1px solid rgba(201,169,106,.22);padding:7px 10px;text-align:left;vertical-align:top}
th{background:rgba(201,169,106,.17);color:#E8CE95;font-weight:700;white-space:nowrap}
td.c{text-align:center;white-space:nowrap}

/* 九宮 */
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:0 auto 12px}
.cell{background:#1D1813;border:1px solid rgba(201,169,106,.26);border-radius:9px;padding:9px 6px;text-align:center;position:relative}
.cell .pal{font-family:'Noto Serif TC',serif;font-size:12px;color:#C9A96A;opacity:.85}
.cell .st{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:900;letter-spacing:.14em;margin-top:2px}
.cell .st .m{color:#8FC49A}.cell .st .b{color:#EDE7DA;opacity:.55;font-size:15px}.cell .st .f{color:#8AB0CE}
.cell.sit{border-color:#C9A96A;box-shadow:inset 0 0 0 1px rgba(201,169,106,.4)}
.leg{font-size:11.5px;opacity:.6;text-align:center;margin-bottom:14px}

.box{background:#1A1613;border:1px solid rgba(201,169,106,.2);border-radius:12px;padding:12px 15px;margin-bottom:10px}
.box b{color:#F0D9A0}
.warn{border-left:3px solid #E58A79;background:rgba(229,138,121,.07)}
.good{border-left:3px solid #8FC49A;background:rgba(143,196,154,.07)}
.act{border-left:3px solid #C9A96A;background:rgba(201,169,106,.07)}

ol.pri{margin:0;padding-left:22px;font-size:13.5px}
ol.pri li{margin-bottom:9px}
ol.pri b{color:#F0A797}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:8px}
.shot{border:1px solid rgba(201,169,106,.25);border-radius:10px;overflow:hidden;background:#1D1813}
.shot img{width:100%;height:118px;object-fit:cover;display:block}
.shot .cap{font-size:11.5px;padding:5px 8px;opacity:.8}

.sig{margin-top:26px;padding-top:14px;border-top:1px solid rgba(201,169,106,.3);
  display:flex;gap:24px;font-size:12px;opacity:.72;line-height:1.9}
.sig div{flex:1}
.disc{margin-top:14px;font-size:11.5px;opacity:.5;line-height:1.85}
.empty{text-align:center;padding:36px 20px;opacity:.6;font-size:14px;line-height:2}

@media print{
  body{background:#fff;color:#000}
  .tools,.hero{display:none!important}
  #rpt{background:#fff;border:0;padding:0}
  h3{color:#6b5220;border-color:#c9a96a}
  h4{color:#6b5220}
  .rh h2,.rh .seal{color:#6b5220;border-color:#6b5220}
  th{background:#f2ead6!important;color:#3a2f18!important}
  td,th{border-color:#b9a274}
  .box{background:#faf7f0;border-color:#d8c9a5}
  .cell{background:#faf7f0;border-color:#c9a96a}
  .cell .st .b{color:#555}
  h3{break-after:avoid;page-break-after:avoid}
  .box,.shot,tr{break-inside:avoid;page-break-inside:avoid}
}
</style></head><body>

<div class="hero">
  <h1>整 合 勘 輿 報 告 書</h1>
  <p>飛星・八宅・金鎖玉關・現場勘查・命卦配位 一次交付</p>
</div>

<div class="wrap">
  <div class="tools">
    <button class="pri" id="btnMake">重新彙整</button>
    <button id="btnPrint">列印／存成 PDF</button>
  </div>
  <div id="rpt"></div>
</div>

<script src="lock.js?v=6"></script>
<script src="report.js"></script>
<script src="engine.js?v=1"></script>
<script src="case.js?v=6"></script>
<script>
/* 整合報告:不自行輸入任何資料,全部取自「目前案件」。
   來源:飛星/八宅(坐山+運)、金鎖玉關(jinsuo)、現場勘查(survey+IndexedDB 照片)、
        屋主命卦(by+sex)、擇日(y1/y2 暫不納入,擇日結果未存回案件)。*/
var CKEY='fsc_cases', AKEY='fsc_active';
function cases(){try{return JSON.parse(localStorage.getItem(CKEY)||'[]')}catch(e){return[]}}
function curCase(){var id=localStorage.getItem(AKEY)||'';
  if(!id)return null;
  var a=cases();
  for(var i=0;i<a.length;i++)if(String(a[i].id)===String(id))return a[i];
  return null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}

/* 照片(與現場勘查同一個庫) */
var DB=null;
function db(){return new Promise(function(res,rej){
  if(DB)return res(DB);
  var r=indexedDB.open('bpsy_survey',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('ph')};
  r.onsuccess=function(){DB=r.result;res(DB)};
  r.onerror=function(){rej(r.error)};})}
function phGet(k){return db().then(function(d){return new Promise(function(res,rej){
  var t=d.transaction('ph','readonly'),q=t.objectStore('ph').get(k);
  q.onsuccess=function(){res(q.result||null)};q.onerror=function(){rej(q.error)}})})}

var SURVEY_ITEMS=[
 ['door','大門'],['stove','爐灶／廚房'],['bed','主臥床位'],['god','神位／祖先'],
 ['wc','廁所'],['stair','樓梯'],['water','來水／去水'],['desk','書桌／辦公桌'],
 ['money','財位'],['out','明堂／外局']];

var GRID=[['巽','離','坤'],['震','中','兌'],['艮','坎','乾']];

function build(){
  var c=curCase(), R=document.getElementById('rpt');
  if(!c){
    R.innerHTML='<div class="empty">尚未選定案件。<br>請先在上方案件列選擇一個案件,'+
      '本報告會自動把該案的飛星、八宅、金鎖玉關、現場勘查與屋主命卦彙整成一份交付書。</div>';
    return;
  }
  var cc=BPE.crossCheck(c), ch=cc.chart;
  var js=BPE.jsScore(c.jinsuo||{});
  var sv=c.survey||{};
  var today=new Date().toLocaleDateString('zh-TW');

  var h='<div class="rh"><div class="seal">抱</div><h2>整合勘輿報告書</h2>'+
        '<div class="s">抱朴隨緣堂 敬呈</div></div>';

  /* 一、案件 */
  h+='<h3><span class="no">壹</span>案件資料</h3><table>'+
     '<tr><th>委託人</th><td>'+esc(c.name||'—')+'</td><th>勘察標的</th><td>'+esc(c.type||'陽宅')+'</td></tr>'+
     '<tr><th>地址</th><td colspan="3">'+esc(c.addr||'—')+'</td></tr>'+
     '<tr><th>坐向</th><td>'+(ch?ch.sitting+'山 '+ch.facing+'向':'—')+'</td>'+
     '<th>元運</th><td>'+(ch?ch.period+'運':'—')+'</td></tr>'+
     '<tr><th>勘察日期</th><td>'+esc(c.date||today)+'</td><th>報告日期</th><td>'+today+'</td></tr></table>';

  if(!ch){
    h+='<div class="box warn">本案尚未填入<b>坐山</b>與<b>元運</b>,飛星、八宅與兩派互參無法推算。'+
       '請先到客戶案件簿或羅盤module補齊坐向資料。</div>';
  }

  /* 二、本宅理氣 */
  if(ch){
    h+='<h3><span class="no">貳</span>本宅理氣・玄空飛星</h3>';
    h+='<p>本宅 <b style="color:#F0D9A0">'+ch.sitting+'山'+ch.facing+'向</b>,立於 '+ch.period+
       '運,盤局為 <b style="color:#F0D9A0">'+ch.pattern+'</b>。</p>';
    h+='<div class="grid9">';
    GRID.forEach(function(row){row.forEach(function(p){
      var isSit=(p===ch.sitPal), isFace=(p===ch.facePal);
      h+='<div class="cell'+(isSit||isFace?' sit':'')+'">'+
         '<div class="pal">'+p+(isSit?'・坐':isFace?'・向':'')+'</div>'+
         '<div class="st"><span class="m">'+(p==='中'?ch.mountain['中']:ch.mountain[p])+'</span> '+
         '<span class="b">'+ch.base[p]+'</span> '+
         '<span class="f">'+ch.facing_stars[p]+'</span></div></div>';
    })});
    h+='</div><div class="leg">左為<span style="color:#8FC49A">山星</span>・中為運盤・右為<span style="color:#8AB0CE">向星</span></div>';

    /* 八宅 */
    h+='<h4>八宅遊星(本宅為 '+ch.sitPal+'宅・'+BPE.zhaiGroup(ch.sitPal)+')</h4><table>'+
       '<tr><th>方位</th><th>遊星</th><th>吉凶</th><th>宜作</th></tr>';
    var USE={'生氣':'主臥、辦公、大門,旺事業與活力','延年':'主臥、神位,旺感情與壽元',
             '天醫':'臥床、廚房,主健康與貴人','伏位':'書房、神位,主安穩守成',
             '絕命':'廁所、儲藏、樓梯','五鬼':'廁所、雜物間、樓梯',
             '禍害':'儲藏、次要通道','六煞':'廁所、儲藏'};
    BPE.JS_GONGS.forEach(function(g){
      var yx=BPE.youxing(ch.sitPal,g.g), ji=BPE.JI_X.has(yx);
      h+='<tr><td>'+g.g+'／'+g.dir+'</td><td>'+yx+'</td>'+
         '<td class="c" style="color:'+(ji?'#8FC49A':'#E58A79')+'">'+(ji?'吉':'凶')+'</td>'+
         '<td>'+USE[yx]+'</td></tr>';
    });
    h+='</table>';
  }

  /* 三、屋主命卦配位 */
  var gua=BPE.mingGua(c.by, c.sex);
  h+='<h3><span class="no">參</span>屋主命卦與房間配位</h3>';
  if(!gua){
    h+='<div class="box">案件未填屋主出生年與性別,無法排定命卦。補齊後此節會列出屋主本命四吉方與最適房間。</div>';
  }else{
    var grp=BPE.guaGroup(gua);
    h+='<p>屋主生於民國／西元 <b>'+esc(String(c.by))+'</b> 年,'+(c.sex?'男':'女')+
       '命,本命卦為 <b style="color:#F0D9A0">'+gua+'命('+grp+')</b>。'+
       (ch?'本宅為 '+ch.sitPal+'宅('+BPE.zhaiGroup(ch.sitPal)+'),與屋主命卦'+
            (BPE.zhaiGroup(ch.sitPal)===grp?'<b style="color:#8FC49A">相配</b>。':
             '<b style="color:#E58A79">不同組</b>,宜以房門、床位、座向取四吉方補之。')
           :'')+'</p>';
    h+='<table><tr><th>方位</th><th>對屋主</th><th>建議用途</th></tr>';
    BPE.JS_GONGS.forEach(function(g){
      var yx=BPE.youxing(gua,g.g), ji=BPE.JI_X.has(yx);
      h+='<tr><td>'+g.g+'／'+g.dir+'</td>'+
         '<td style="color:'+(ji?'#8FC49A':'#E58A79')+'">'+yx+'</td>'+
         '<td>'+USE_FOR(yx)+'</td></tr>';
    });
    h+='</table><p class="muted">睡床床頭、書桌座向、大門開向宜取上表四吉方;廁所、儲藏、樓梯宜置於四凶方以壓之。</p>';
  }

  /* 四、金鎖玉關 */
  h+='<h3><span class="no">肆</span>形巒砂水・金鎖玉關</h3>';
  if(js.s===null){
    h+='<div class="box">本案尚未進行金鎖玉關砂水判定。到「金鎖玉關」module逐山點選砂／水後,此節會自動帶入。</div>';
  }else{
    h+='<p>已判定 <b>'+js.fill+'／24</b> 山,合訣 <b style="color:#8FC49A">'+js.ok+'</b> 處、'+
       '違訣 <b style="color:#E58A79">'+js.bad+'</b> 處,砂水總評 <b style="color:#F0D9A0">'+js.s+' 分</b>。</p>';
    if(js.worst.length){
      h+='<table><tr><th>山</th><th>宮位</th><th>現況</th><th>本宜</th><th>所應</th><th>斷語</th></tr>';
      js.worst.forEach(function(x){
        h+='<tr><td class="c">'+x.m+'</td><td>'+x.g.g+'／'+x.g.dir+'</td><td class="c">'+x.val+'</td>'+
           '<td class="c">'+x.g.want+'</td><td>'+x.g.who+'</td><td>'+BPE.JS_M[x.m].bad+'</td></tr>';
      });
      h+='</table>';
    }else{
      h+='<div class="box good">全盤已判定之方位皆合經旨,無違訣之處。</div>';
    }
  }

  /* 五、兩派互參 */
  h+='<h3><span class="no">伍</span>形巒與理氣互參</h3>';
  var useRows=cc.rows.filter(function(r){return r.level!==0});
  if(!ch||!useRows.length){
    h+='<div class="box">需同時具備坐向元運與金鎖玉關砂水判定,才能進行兩派互參。</div>';
  }else{
    h+='<p class="muted">兩派各自獨立成說。同時報凶者最為確鑿,應優先處理;結論相反者,通常代表現場砂水還沒看準,建議複核。</p>';
    h+='<table><tr><th>宮位</th><th>金鎖玉關</th><th>飛星八宅</th><th>合斷</th><th>處置</th></tr>';
    useRows.slice().sort(function(a,b){return b.level-a.level}).forEach(function(r){
      var col=r.level>=3?'#E58A79':r.level===2?'#E0A88A':r.level===1?'#8AB0CE':'#8FC49A';
      h+='<tr><td>'+r.pal+'／'+r.dir+'</td>'+
         '<td class="c">'+(r.js==='bad'?'違訣':r.js==='ok'?'合訣':'—')+'</td>'+
         '<td class="c">'+(r.xk.k==='bad'?'凶':r.xk.k==='ok'?'吉':'平')+'</td>'+
         '<td class="c" style="color:'+col+'">'+r.tag+'</td><td>'+r.action+'</td></tr>';
    });
    h+='</table>';
  }

  /* 六、現場勘查 */
  h+='<h3><span class="no">陸</span>現場逐項勘查</h3>';
  var filled=SURVEY_ITEMS.filter(function(x){var d=sv[x[0]];return d&&(d.dir||d.status||d.note)});
  if(!filled.length){
    h+='<div class="box">本案尚未進行現場勘查紀錄。到「現場勘查」module逐項填寫後,此節連同照片會自動帶入。</div>';
  }else{
    h+='<table><tr><th>項目</th><th>方位</th><th>判定</th><th>現場記述</th></tr>';
    filled.forEach(function(x){
      var d=sv[x[0]], pal=d.dir?BPE.palaceOf(d.dir):null;
      h+='<tr><td>'+x[1]+'</td><td class="c">'+(d.dir?d.dir+'山／'+pal+'宮':'—')+'</td>'+
         '<td class="c">'+(d.status||'—')+'</td><td>'+esc(d.note||'')+'</td></tr>';
    });
    h+='</table><div class="shots" id="shots"></div>';
  }

  /* 七、化解優先順序 */
  h+='<h3><span class="no">柒</span>化解優先順序</h3>';
  var acts=[];
  cc.rows.filter(function(r){return r.level>=3}).forEach(function(r){
    acts.push({w:0,t:'<b>'+r.pal+'宮 '+r.dir+'(雙重凶)</b>——形巒與理氣同斷為凶,應'+r.who+
      ',主'+r.body+'。'+BPE.JS_FIX[r.want]});
  });
  js.worst.forEach(function(x){
    if(acts.some(function(a){return a.t.indexOf(x.g.g+'宮')>=0}))return;
    acts.push({w:1,t:'<b>'+x.m+'山('+x.g.g+'宮'+x.g.dir+')</b>——本宜'+x.g.want+'而見'+x.val+
      ',應'+x.g.who+'。'+BPE.JS_FIX[x.g.want]});
  });
  SURVEY_ITEMS.forEach(function(x){
    var d=sv[x[0]]; if(!d||d.status!=='凶')return;
    acts.push({w:2,t:'<b>'+x[1]+(d.dir?'('+d.dir+'山)':'')+'</b>——現場判定為凶'+
      (d.note?':'+esc(d.note):'')+'。'});
  });
  if(!acts.length){
    h+='<div class="box good">依現有資料,本宅無須優先處理之項目。</div>';
  }else{
    acts.sort(function(a,b){return a.w-b.w});
    h+='<ol class="pri">'+acts.map(function(a){return '<li>'+a.t+'</li>'}).join('')+'</ol>';
    h+='<div class="box act">上列順序以<b>應驗確鑿程度</b>排序:兩派同斷者最先,單派報凶次之,現場實見之形煞再次。'+
       '施作時建議依序處理,每處理一項觀察一至三個月再進行下一項,以便驗證。</div>';
  }

  /* 落款 */
  h+='<div class="sig">'+
     '<div><b style="color:#E0C285">堪輿</b><br>抱朴隨緣堂</div>'+
     '<div><b style="color:#E0C285">報告日期</b><br>'+today+'</div>'+
     '<div><b style="color:#E0C285">聯絡</b><br>jackkok1388@gmail.com<br>LINE:fengshui1388</div>'+
     '</div>'+
     '<div class="disc">本報告依玄空飛星、八宅明鏡、金鎖玉關(過路陰陽)三家法度,'+
     '並參酌現場實地勘查所得彙整而成,各家理路獨立成說,互參以求穩妥。<br>'+
     '所載內容為傳統堪輿學說之推演,僅供參考,不構成醫療、財務或法律建議,亦不保證特定結果。</div>';

  R.innerHTML=h;
  if(filled.length)loadShots(c,filled);
}
function USE_FOR(yx){
  return{'生氣':'主臥、大門、辦公座向','延年':'主臥、神位,利感情','天醫':'床位、廚房,利健康',
         '伏位':'書房、神位,主安定','絕命':'廁所、儲藏、樓梯','五鬼':'廁所、雜物、樓梯',
         '禍害':'儲藏、次要通道','六煞':'廁所、儲藏'}[yx]||'—';
}
function loadShots(c,filled){
  var host=document.getElementById('shots'); if(!host)return;
  filled.forEach(function(x){
    var d=c.survey[x[0]]; if(!d.photo)return;
    phGet(String(c.id)+'|'+x[0]).then(function(url){
      if(!url)return;
      var w=document.createElement('div'); w.className='shot';
      w.innerHTML='<img src="'+url+'"><div class="cap">'+x[1]+(d.dir?'・'+d.dir+'山':'')+'</div>';
      host.appendChild(w);
    }).catch(function(){});
  });
}

document.getElementById('btnMake').onclick=build;
document.getElementById('btnPrint').onclick=function(){
  var c=curCase();
  if(!c){alert('請先選定案件');return}
  if(window.BPRPT)BPRPT.print({
    title:'整合勘輿報告書',
    meta:[['委託人',c.name||'—'],['地址',c.addr||'—'],
          ['坐向',(c.sit?c.sit+'山':'—')+(c.per?'・'+c.per+'運':'')],
          ['報告日期',new Date().toLocaleDateString('zh-TW')]],
    html:document.getElementById('rpt').innerHTML});
  else window.print();
};

(function sub(n){ if(window.BPCASE&&BPCASE.on){BPCASE.on(build);return}
  if(n<40)setTimeout(function(){sub(n+1)},100); })(0);
window.addEventListener('storage',function(e){if(e.key===AKEY||e.key===CKEY)build()});
