<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>金鎖玉關・過路陰陽砂水斷</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0F0C0A;color:#EDE7DA;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:15px;line-height:1.75}
button{color:inherit;font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 30px}
.hero{text-align:center;padding:20px 16px 15px;border-bottom:1px solid rgba(201,169,106,.22)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:22px;letter-spacing:.14em;color:#E0C285;font-weight:900}
.hero p{font-size:12.5px;opacity:.62;margin-top:5px}

.note{background:rgba(201,169,106,.08);border-left:3px solid #C9A96A;border-radius:0 11px 11px 0;
  padding:12px 15px;font-size:13px;margin:13px 0;line-height:1.85}
.note b{color:#E0C285}

/* 總評 */
.score{background:#1A1613;border:1px solid rgba(201,169,106,.24);border-radius:14px;padding:15px 17px;margin-top:12px}
.score .row{display:flex;align-items:baseline;gap:10px}
.score .n{font-family:'Noto Serif TC',serif;font-size:40px;font-weight:900;color:#E0C285;line-height:1}
.score .n small{font-size:15px;opacity:.6}
.score .g{margin-left:auto;font-size:15px;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(201,169,106,.15);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B8923F,#E0C285);width:0;transition:width .35s}
.score .d{font-size:13px;opacity:.8;margin-top:9px;line-height:1.8}

/* 宮 */
.gong{background:#1A1613;border:1px solid rgba(201,169,106,.2);border-radius:14px;margin-top:11px;padding:13px 14px}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.gh .bi{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;background:rgba(201,169,106,.14);color:#E0C285}
.gh b{font-family:'Noto Serif TC',serif;font-size:17px;color:#F0D9A0}
.gh small{display:block;font-size:11.5px;opacity:.6}
.gh .want{margin-left:auto;font-size:12px;border-radius:99px;padding:4px 11px;font-weight:700;white-space:nowrap}
.w-sha{background:rgba(201,169,106,.2);color:#E8CE95}
.w-shui{background:rgba(138,176,206,.2);color:#A8C8E0}

.m{margin-top:10px;border-top:1px solid rgba(201,169,106,.13);padding-top:10px}
.m:first-of-type{border-top:0}
.mrow{display:flex;align-items:center;gap:8px}
.mrow .nm{font-family:'Noto Serif TC',serif;font-size:17px;color:#F0D9A0;width:34px;flex:none;text-align:center}
.seg{display:flex;gap:6px;flex:1}
.seg button{flex:1;min-height:46px;border:1px solid rgba(201,169,106,.28);background:#221C16;border-radius:10px;
  font-size:14.5px;cursor:pointer}
.seg button.on[data-v="砂"]{background:rgba(201,169,106,.3);border-color:#C9A96A;color:#F0D9A0;font-weight:700}
.seg button.on[data-v="水"]{background:rgba(138,176,206,.28);border-color:#8AB0CE;color:#BBD6EA;font-weight:700}
.seg button.on[data-v="平"]{background:rgba(237,231,218,.13);border-color:rgba(237,231,218,.4);font-weight:700}
.tagv{flex:none;font-size:11.5px;border-radius:99px;padding:3px 9px;font-weight:700;white-space:nowrap;min-width:52px;text-align:center}
.t-ok{background:rgba(143,196,154,.17);color:#8FC49A}
.t-bad{background:rgba(229,138,121,.17);color:#E58A79}
.t-non{background:rgba(237,231,218,.07);color:#9C948A}
.txt{font-size:13px;line-height:1.8;margin-top:7px;padding-left:42px;opacity:.9}
.txt.bad{color:#F0B4A6}
.txt.ok{color:#B6D9BF}
.txt .fix{display:block;margin-top:4px;font-size:12.5px;color:#E0C285;opacity:.95}

.tools{display:flex;gap:9px;margin-top:18px}
.tools button{flex:1;min-height:52px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid rgba(201,169,106,.4);background:#221C16}
.tools button.pri{background:linear-gradient(135deg,#E0BD78,#B8923F);color:#1A1410;border-color:transparent}
.sum{margin-top:16px;background:#1A1613;border:1px solid rgba(201,169,106,.22);border-radius:14px;padding:15px 17px;display:none}
.sum h3{font-family:'Noto Serif TC',serif;font-size:16px;color:#E0C285;letter-spacing:.1em;margin-bottom:9px}
.sum table{width:100%;border-collapse:collapse;font-size:13px}
.sum th,.sum td{border:1px solid rgba(201,169,106,.22);padding:7px 9px;text-align:left;vertical-align:top}
.sum th{background:rgba(201,169,106,.17);color:#E8CE95;white-space:nowrap}
.foot{font-size:11.5px;opacity:.45;text-align:center;padding:24px 10px 10px;line-height:1.85}
@media print{.tools,.seg{display:none!important}body{background:#fff;color:#000}}
</style></head><body>

<div class="hero">
  <h1>金 鎖 玉 關</h1>
  <p>過路陰陽・二十四山砂水斷</p>
</div>

<div class="wrap">
  <div class="note">
    <b>用法:</b>站在宅中心(太極點)向外看,逐一判定二十四山各方是<b>砂</b>(高、實、擋——山、樓房、圍牆、大樹、電桿、高櫃)、<b>水</b>(低、虛、通——水塘、道路、空地、門窗、低地)、還是<b>平</b>(無明顯高低)。
    <br><b>總訣:</b>一二三四宮(坎北、坤西南、震東、巽東南)<b>宜砂</b>;六七八九宮(乾西北、兌西、艮東北、離南)<b>宜水</b>。反之為違訣。
  </div>

  <div class="score" id="score"></div>
  <div id="list"></div>

  <div class="tools">
    <button class="pri" id="btnSum">產生砂水總斷</button>
    <button id="btnClr">全部清除</button>
  </div>
  <div class="sum" id="sum"></div>

  <div class="foot">
    金鎖玉關以形巒砂水直斷,不論坐向與元運,可與玄空飛星互為印證。<br>
    分析結果僅供參考,不構成醫療、財務或法律建議。
  </div>
</div>

<script src="lock.js?v=6"></script>
<script src="report.js"></script>
<script src="case.js?v=6"></script>
<script>
/* ═══════ 金鎖玉關(過路陰陽)砂水斷 ═══════
   總訣:洛書一二三四宮宜砂,六七八九宮宜水。
   本檔以《二十四山砂水訣》經文所載吉凶為據,斷語為抱朴隨緣堂依卦象、
   六親、房份與臟腑對應之自家表述,非引錄他人註本文字。            */

const GONGS=[
 {g:'坎',num:1,want:'砂',dir:'正北',  who:'中男・二房', body:'腎、膀胱、泌尿、耳、血液',
  ms:['壬','子','癸']},
 {g:'艮',num:8,want:'水',dir:'東北',  who:'少男・三房', body:'脾胃、手、背、鼻、關節',
  ms:['丑','艮','寅']},
 {g:'震',num:3,want:'砂',dir:'正東',  who:'長男・長房', body:'肝膽、足、筋、神經',
  ms:['甲','卯','乙']},
 {g:'巽',num:4,want:'砂',dir:'東南',  who:'長女・長媳', body:'氣管、股、風疾、毛髮',
  ms:['辰','巽','巳']},
 {g:'離',num:9,want:'水',dir:'正南',  who:'中女',       body:'心、眼目、血液循環、小腸',
  ms:['丙','午','丁']},
 {g:'坤',num:2,want:'砂',dir:'西南',  who:'老母・主婦', body:'腹、脾胃、皮膚',
  ms:['未','坤','申']},
 {g:'兌',num:7,want:'水',dir:'正西',  who:'少女・幼口', body:'肺、咽喉、口齒',
  ms:['庚','酉','辛']},
 {g:'乾',num:6,want:'水',dir:'西北',  who:'老父・家長', body:'頭、肺、骨、大腸',
  ms:['戌','乾','亥']}
];

/* 每山:ok=合訣之象  bad=違訣之象  fix=化解 */
const M={
/* 坎 1 宜砂 */
 壬:{ok:'主武貴剛毅,中男體健有擔當,名聲外揚。若南方丙位得水相照,子孫更利文才。',
     bad:'中男損傷、二房人丁不旺,主腎與泌尿之疾。水形如箭直射而來者應驗最速,如葫蘆狀者主腰腿之傷。'},
 子:{ok:'家中男丁康健、子孫聰穎,主守成有道、根基穩固。',
     bad:'中男漂泊不定,易犯桃花酒色,耳疾腎虧。水聚而不流者尤主淫佚暗昧。'},
 癸:{ok:'出秀氣清貴之人,女眷賢淑,主聰明多才。',
     bad:'主婦人隱疾與暗昧之事,男子腎虧體虛,家中易生曖昧口舌。'},
/* 艮 8 宜水 */
 丑:{ok:'三房進財,主田產倉廩豐盈,積蓄漸厚。',
     bad:'少男傷病、手足關節之疾,破財損丁,家中小口難養。'},
 艮:{ok:'三房大發,人丁財帛兩旺,主置產興家。',
     bad:'少男愚鈍或有傷殘,脾胃不和,家宅不寧、進退兩難。'},
 寅:{ok:'出文秀之人,進田產、得貴助。',
     bad:'小兒多驚,跌撲傷手,主虛驚官非。'},
/* 震 3 宜砂 */
 甲:{ok:'長男顯貴,出武職有威權,長房興旺。',
     bad:'長男敗財,主肝膽之疾與足傷,長房不利、家長受累。'},
 卯:{ok:'長房人丁興旺,出剛強幹練、能立門戶之人。',
     bad:'長男好動不安、離鄉背井,主官非爭訟、筋骨酸痛。'},
 乙:{ok:'出文人秀士,長女亦賢,主科名文書之喜。',
     bad:'肝木受損、筋骨酸痛,長房口舌是非不斷。'},
/* 巽 4 宜砂 */
 辰:{ok:'田產進益,家道殷實,主積穀藏金。',
     bad:'長女長媳不利,主風濕氣喘,或有難言之惡疾。'},
 巽:{ok:'出文貴、利科名考試,長女賢淑貌美,家出才女。',
     bad:'長女長媳受損,主難產或風化之事,氣管毛髮之疾。'},
 巳:{ok:'利文書功名,家出秀才,主聲名漸起。',
     bad:'蛇蟲驚擾,婦人血症,長房媳婦不安於室。'},
/* 離 9 宜水 */
 丙:{ok:'財源廣進、名聲顯達,主科甲功名,文章傳世。',
     bad:'中女不利,主眼目之疾、心火上炎,防火厄與血光。'},
 午:{ok:'大發財祿,人口興旺,主聲名遠播、貴人扶持。',
     bad:'血光、心疾、目病,中女多災,尤防火燭之患。'},
 丁:{ok:'出文人,女眷秀慧,家道昌盛、書香不斷。',
     bad:'中女血症、心神不寧,主口舌是非與虛火之症。'},
/* 坤 2 宜砂 */
 未:{ok:'田產豐厚,主婦持家有道,家宅厚實安穩。',
     bad:'老母有疾、脾胃不和,主婦人病與皮膚之患。'},
 坤:{ok:'人丁旺、婦人壽考,家宅安穩,主厚德綿長。',
     bad:'主婦受損、腹疾纏身,家中陰盛陽衰,是非叢生。'},
 申:{ok:'出武職或有力氣之人,主行動力強、能任事。',
     bad:'婦人多病,防傷胎小產,家中不寧、奔波勞碌。'},
/* 兌 7 宜水 */
 庚:{ok:'進財迅速,利口才、談判與買賣交易。',
     bad:'少女不利,主肺與咽喉之疾,防刀傷血光。'},
 酉:{ok:'財帛豐盈,家出貌美女子,主人緣與偏財。',
     bad:'少女多災,主口舌官非,齒疾、肺疾纏身。'},
 辛:{ok:'利文書契約與金玉之財,主精巧之藝。',
     bad:'女眷病痛,口舌爭訟,主無端破財。'},
/* 乾 6 宜水 */
 戌:{ok:'進財有道,老人康健,家中長輩得安。',
     bad:'老父不利,主頭疾與筋骨之痛,家長多病。'},
 乾:{ok:'主大貴,家長顯達,全家蒙其蔭庇。',
     bad:'老父受剋,主頭風骨痛,家長早衰,重則主孤。'},
 亥:{ok:'財源綿長,子孫得蔭,主根基深厚。',
     bad:'肺與大腸之疾,老人氣喘,家運滯塞不通。'}
};
const FIX={
 砂:'補砂:此方宜設實牆、高櫃、山石盆景或高大植栽填實,色用黃褐厚重,忌開大窗、忌留空。',
 水:'見水:此方宜開窗採光、留出通道,或設水景、明鏡、淺色透亮之物,忌高櫃遮擋、忌堆置重物。'
};

/* ═══════ 儲存 ═══════ */
var CKEY='fsc_cases', AKEY='fsc_active';
function cases(){try{return JSON.parse(localStorage.getItem(CKEY)||'[]')}catch(e){return[]}}
function curCase(){var id=localStorage.getItem(AKEY)||'';return id?cases().find(c=>String(c.id)===String(id)):null}
function load(){var c=curCase();
  if(c&&c.jinsuo)return c.jinsuo;
  if(!c){try{return JSON.parse(localStorage.getItem('fsc_jinsuo_tmp')||'{}')}catch(e){return{}}}
  return{};}
function save(d){var c=curCase();
  if(!c){try{localStorage.setItem('fsc_jinsuo_tmp',JSON.stringify(d))}catch(e){}return}
  var a=cases(),i=a.findIndex(x=>String(x.id)===String(c.id)); if(i<0)return;
  a[i].jinsuo=d; a[i].jinsuoAt=new Date().toISOString().slice(0,10);
  try{localStorage.setItem(CKEY,JSON.stringify(a))}catch(e){}}

var D=load();

/* ═══════ 判斷 ═══════ */
function judge(m,gong){
  var v=D[m]; if(!v||v==='平')return{k:'non',t:'—'};
  return v===gong.want?{k:'ok',t:'合訣'}:{k:'bad',t:'違訣'};
}
function tally(){
  var ok=0,bad=0,fill=0,worst=[];
  GONGS.forEach(function(g){g.ms.forEach(function(m){
    var v=D[m]; if(!v)return; fill++;
    if(v==='平')return;
    if(v===g.want)ok++; else{bad++;worst.push({m:m,g:g})}
  })});
  return{ok:ok,bad:bad,fill:fill,worst:worst};
}
/* 評分:以已判定的砂水位為分母,合訣比例為主,違訣加重扣分 */
function score(){
  var t=tally(), n=t.ok+t.bad;
  if(!n)return{s:null,t:t};
  var s=Math.round(100*t.ok/n - t.bad*1.5);
  return{s:Math.max(0,Math.min(100,s)),t:t};
}

/* ═══════ 畫面 ═══════ */
function paint(){
  D=load();
  var r=score(),t=r.t;
  var sc=document.getElementById('score');
  var c=curCase();
  if(r.s===null){
    sc.innerHTML='<div class="row"><span class="n">—</span><span class="g" style="color:#9C948A">尚未判定</span></div>'+
      '<div class="d">'+(c?'案件:'+esc(c.name||'未命名')+'。':'目前未選案件,紀錄暫存本機。')+
      '逐山點選砂／水／平,系統即依總訣判合訣違訣並出斷語。</div>';
  }else{
    var g = r.s>=80?['大吉之局','#8FC49A'] : r.s>=60?['吉多於凶','#C9E0B0']
          : r.s>=40?['吉凶參半','#E0C285'] : r.s>=20?['凶多於吉','#E0A88A'] : ['凶險之局','#E58A79'];
    sc.innerHTML=
      '<div class="row"><span class="n">'+r.s+'<small> 分</small></span>'+
      '<span class="g" style="color:'+g[1]+'">'+g[0]+'</span></div>'+
      '<div class="bar"><i style="width:'+r.s+'%"></i></div>'+
      '<div class="d">已判定 '+t.fill+' / 24 山｜合訣 '+t.ok+' 處、違訣 '+t.bad+' 處'+
      (c?'<br>案件:'+esc(c.name||'未命名'):'')+'</div>';
  }

  var L=document.getElementById('list'); L.innerHTML='';
  GONGS.forEach(function(gg){
    var box=document.createElement('div'); box.className='gong';
    var h='<div class="gh"><span class="bi">'+gg.g+'</span>'+
      '<span><b>'+gg.g+'宮・'+gg.dir+'</b><small>洛書'+gg.num+'｜'+gg.who+'｜'+gg.body+'</small></span>'+
      '<span class="want '+(gg.want==='砂'?'w-sha':'w-shui')+'">宜'+gg.want+'</span></div>';
    gg.ms.forEach(function(m){
      var j=judge(m,gg), v=D[m]||'';
      h+='<div class="m"><div class="mrow"><span class="nm">'+m+'</span>'+
         '<span class="seg">'+['砂','水','平'].map(function(x){
            return '<button data-m="'+m+'" data-v="'+x+'"'+(v===x?' class="on"':'')+'>'+x+'</button>'}).join('')+
         '</span><span class="tagv t-'+j.k+'">'+j.t+'</span></div>';
      if(j.k!=='non'){
        var txt=j.k==='ok'?M[m].ok:M[m].bad;
        h+='<div class="txt '+j.k+'">'+txt+
           (j.k==='bad'?'<span class="fix">'+FIX[gg.want]+'</span>':'')+'</div>';
      }
      h+='</div>';
    });
    box.innerHTML=h; L.appendChild(box);
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('.seg button'); if(!b)return;
  D=load();
  D[b.dataset.m] = (D[b.dataset.m]===b.dataset.v) ? '' : b.dataset.v;
  if(!D[b.dataset.m])delete D[b.dataset.m];
  save(D); paint();
});

document.getElementById('btnSum').onclick=function(){
  D=load(); var r=score(),t=r.t,c=curCase();
  if(r.s===null){alert('請先點選各方位的砂水情形');return}
  /* 違訣依宮位輕重排序:傷及家長與人丁者優先 */
  var W={乾:1,坤:2,坎:3,離:4,艮:5,震:6,巽:7,兌:8};
  var bad=t.worst.slice().sort(function(a,b){return W[a.g.g]-W[b.g.g]});
  var rows='';
  GONGS.forEach(function(g){g.ms.forEach(function(m){
    var v=D[m]; if(!v)return;
    var j=judge(m,g);
    rows+='<tr><td>'+m+'</td><td>'+g.g+'／'+g.dir+'</td><td>'+v+'</td><td>宜'+g.want+'</td>'+
          '<td>'+j.t+'</td><td>'+(j.k==='non'?'—':(j.k==='ok'?M[m].ok:M[m].bad))+'</td></tr>';
  })});
  var s=document.getElementById('sum');
  s.innerHTML='<h3>金鎖玉關砂水總斷</h3>'+
    '<div style="font-size:13px;opacity:.85;margin-bottom:10px">'+
      (c?'案件:'+esc(c.name||'未命名')+(c.addr?'・'+esc(c.addr):''):'未指定案件')+
      '<br>總評:'+r.s+' 分｜合訣 '+t.ok+' 處、違訣 '+t.bad+' 處(已判定 '+t.fill+'／24 山)'+
      '<br>勘斷日期:'+new Date().toLocaleDateString('zh-TW')+'</div>'+
    '<table><tr><th>山</th><th>宮位</th><th>現況</th><th>本宜</th><th>判定</th><th>斷語</th></tr>'+rows+'</table>'+
    (bad.length?'<div style="margin-top:12px;font-size:13.5px"><b style="color:#E58A79">化解優先順序</b><br>'+
       bad.map(function(x,i){return (i+1)+'. '+x.m+'山('+x.g.g+'宮'+x.g.dir+')——'+
         '本宜'+x.g.want+'而見'+D[x.m]+',應'+x.g.who+'。'+FIX[x.g.want]}).join('<br>')+'</div>'
     :'<div style="margin-top:12px;font-size:13.5px;color:#8FC49A">全盤無違訣之處,砂水配置合乎經旨。</div>')+
    '<div id="rptBtn" style="margin-top:12px"></div>';
  s.style.display='block'; s.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.BPRPT)BPRPT.button('#rptBtn',{
    title:'金鎖玉關砂水勘斷',
    meta:[['案件',(c&&c.name)||'—'],['地址',(c&&c.addr)||'—'],
          ['總評',r.s+' 分'],['勘斷日期',new Date().toLocaleDateString('zh-TW')]],
    source:function(){return s}});
};
document.getElementById('btnClr').onclick=function(){
  if(!confirm('確定清除本案全部砂水判定?'))return;
  var c=curCase();
  if(c){var a=cases(),i=a.findIndex(x=>String(x.id)===String(c.id));
    if(i>=0){delete a[i].jinsuo;delete a[i].jinsuoAt;localStorage.setItem(CKEY,JSON.stringify(a))}}
  else localStorage.removeItem('fsc_jinsuo_tmp');
  D={};document.getElementById('sum').style.display='none';paint();
};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}

paint();
(function sub(n){ if(window.BPCASE&&BPCASE.on){BPCASE.on(paint);return}
  if(n<40)setTimeout(function(){sub(n+1)},100); })(0);
window.addEventListener('storage',function(e){if(e.key===AKEY||e.key===CKEY)paint()});
</script>
