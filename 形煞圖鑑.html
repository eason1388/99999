<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>形煞圖鑑・抱朴隨緣堂</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#0F0C0A;color:#EDE7DA;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:15px;line-height:1.78}
button,input{color:inherit;font-family:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 34px}
.hero{text-align:center;padding:20px 16px 15px;border-bottom:1px solid rgba(201,169,106,.22)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:22px;letter-spacing:.14em;color:#E0C285;font-weight:900}
.hero p{font-size:12.5px;opacity:.62;margin-top:5px}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.bar input{flex:1;min-width:160px;background:#221C16;border:1px solid rgba(201,169,106,.35);
  border-radius:11px;padding:11px 13px;font-size:16px}
.chip{min-height:42px;border-radius:99px;padding:0 15px;font-size:13.5px;cursor:pointer;
  border:1px solid rgba(201,169,106,.35);background:#221C16}
.chip.on{background:linear-gradient(135deg,#E0BD78,#B8923F);color:#1A1410;border-color:transparent;font-weight:700}
.cnt{font-size:12.5px;opacity:.6;margin:6px 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.card{background:#1A1613;border:1px solid rgba(201,169,106,.2);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column}
.card.open{border-color:rgba(201,169,106,.55)}
.hd{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;text-align:left;
  background:transparent;border:0;width:100%;min-height:64px}
.hd svg{width:56px;height:44px;flex:none;background:#120F0C;border-radius:8px;
  border:1px solid rgba(201,169,106,.2)}
.hd .tx{flex:1;min-width:0}
.hd b{font-family:'Noto Serif TC',serif;font-size:16px;color:#F0D9A0;display:block}
.hd small{display:block;font-size:11.5px;opacity:.62;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;border-radius:99px;padding:2px 8px;flex:none;font-weight:700}
.t-out{background:rgba(138,176,206,.18);color:#A8C8E0}
.t-in{background:rgba(201,169,106,.18);color:#E0C285}
.bd{display:none;padding:0 13px 13px;border-top:1px solid rgba(201,169,106,.14)}
.card.open .bd{display:block}
.sec{margin-top:11px}
.sec b{display:block;font-size:12.5px;color:#C9A96A;letter-spacing:.08em;margin-bottom:3px}
.sec div{font-size:13.5px;line-height:1.85}
.fix{border-left:3px solid #8FC49A;background:rgba(143,196,154,.07);border-radius:0 9px 9px 0;padding:8px 11px}
.add{width:100%;min-height:42px;margin-top:11px;border-radius:10px;font-size:13px;cursor:pointer;
  border:1px solid rgba(201,169,106,.4);background:rgba(201,169,106,.14);color:#F0D9A0}
.note{background:rgba(201,169,106,.08);border-left:3px solid #C9A96A;border-radius:0 11px 11px 0;
  padding:12px 15px;font-size:13px;margin:12px 0;line-height:1.85}
.foot{font-size:11.5px;opacity:.45;text-align:center;padding:24px 10px 8px;line-height:1.85}
@media print{.bar,.add,.hero{display:none!important}.bd{display:block!important}body{background:#fff;color:#000}}
</style></head><body>

<div class="hero">
  <h1>形 煞 圖 鑑</h1>
  <p>判準・主應・化解　現場即翻即用</p>
</div>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="搜尋:路沖、壁刀、樑壓、穿堂…">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="外">外煞</button>
    <button class="chip" data-f="內">內煞</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <div class="note">
    形煞論的是<b>形</b>,與坐向元運無關,任何宅皆適用。判斷三原則:<b>愈近愈重、愈正對愈重、體量愈大愈重</b>。
    現場請連同距離、寬度、是否正對一併記錄並拍照,寫進報告才有說服力。
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    形煞之說為傳統堪輿經驗歸納,所載主應為傾向而非必然。<br>
    分析結果僅供參考,不構成醫療、財務或法律建議。
  </div>
</div>

<script src="lock.js?v=6"></script>
<script src="case.js?v=7"></script>

 f:'最易解:移位、轉向,或加簾布覆蓋。這是每一場勘察都值得順手提醒的一項。'},
{n:'缺角',k:'內',s:'格局缺失某一宮',
 svg:S('<path d="M16 20 L104 20 L104 74 L70 74 L70 50 L16 50 Z" '+H+' fill-opacity=".3"/><path d="M70 50 L104 50 L104 74 L70 74 Z" stroke="#E58A79" stroke-width="2" stroke-dasharray="4 3" fill="none"/>'),
 j:'將平面補成完整矩形後,凹入超過該邊三分之一者為缺角。九宮中缺哪一宮,即應該宮所主之人。',
 y:'缺乾傷家長、缺坤傷主婦、缺坎傷中男、缺離傷中女、缺震傷長男、缺巽傷長女、缺艮傷少男、缺兌傷少女。',
 f:'於缺角處以鏡面、燈光或該宮五行屬性之物補之;或於室內對應宮位加強佈置。實務上以「補氣」為主,難以真正補回。'}
];

var filt='all', q='';
function paint(){
  var kw=q.trim();
  var list=DATA.filter(function(d){
    if(filt!=='all'&&d.k!==filt)return false;
    if(!kw)return true;
    return (d.n+d.s+d.j+d.y+d.f).indexOf(kw)>=0;
  });
  document.getElementById('cnt').textContent='共 '+list.length+' 項'+(kw?'(搜尋:'+kw+')':'');
  document.getElementById('grid').innerHTML=list.map(function(d,i){
    return '<div class="card" data-n="'+d.n+'">'+
      '<button class="hd">'+d.svg+'<span class="tx"><b>'+d.n+'</b><small>'+d.s+'</small></span>'+
      '<span class="tag '+(d.k==='外'?'t-out':'t-in')+'">'+d.k+'煞</span></button>'+
      '<div class="bd">'+
        '<div class="sec"><b>判　準</b><div>'+d.j+'</div></div>'+
        '<div class="sec"><b>主　應</b><div>'+d.y+'</div></div>'+
        '<div class="sec"><b>化　解</b><div class="fix">'+d.f+'</div></div>'+
        '<button class="add">＋ 記入目前案件的勘查備註</button>'+
      '</div></div>';
  }).join('');
  document.querySelectorAll('.card').forEach(function(c){
    c.querySelector('.hd').onclick=function(){c.classList.toggle('open')};
    c.querySelector('.add').onclick=function(){addNote(c.dataset.n)};
  });
}
document.getElementById('q').oninput=function(){q=this.value;paint()};
document.querySelectorAll('.chip').forEach(function(b){
  b.onclick=function(){filt=b.dataset.f;
    document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b)});
    paint();};
});

/* 記入案件:寫進現場勘查的「明堂／外局」備註,外煞歸外局、內煞歸大門 */
function addNote(name){
  var CK='fsc_cases', AK='fsc_active';
  var id=localStorage.getItem(AK);
  if(!id){alert('請先在上方案件列選定案件');return}
  var a; try{a=JSON.parse(localStorage.getItem(CK)||'[]')}catch(e){a=[]}
  var i=-1; for(var k=0;k<a.length;k++)if(String(a[k].id)===String(id))i=k;
  if(i<0){alert('找不到目前案件');return}
  var d=DATA.filter(function(x){return x.n===name})[0];
  var slot=d.k==='外'?'out':'door';
  a[i].survey=a[i].survey||{};
  a[i].survey[slot]=a[i].survey[slot]||{};
  var prev=a[i].survey[slot].note||'';
  if(prev.indexOf(name)>=0){alert('「'+name+'」已在備註中');return}
  a[i].survey[slot].note=(prev?prev+'；':'')+name;
  a[i].survey[slot].ts=Date.now();
  try{localStorage.setItem(CK,JSON.stringify(a))}catch(e){alert('儲存失敗');return}
  if(window.BPCASE&&BPCASE.refresh)BPCASE.refresh();
  alert('已記入「'+(d.k==='外'?'明堂／外局':'大門')+'」備註:'+name+'\n可到現場勘查module補充距離與照片。');
}

paint();
</script>

<script>
/* ── 化解方法為付費內容 ──
   判準(怎麼認)與主應(主什麼)免費,讓師傅現場查得出來;
   化解方法是收費部分。 */
(function(){
  function gate(){
    if(window.BPSY && BPSY.ok())return;
    var fixes=document.querySelectorAll('.card .fix');
    for(var i=0;i<fixes.length;i++){
      var f=fixes[i];
      if(f.getAttribute('data-bp-gated'))continue;
      f.setAttribute('data-bp-gated','1');
      f.style.cssText='border-left:3px solid #C9A96A;background:rgba(201,169,106,.07);'+
        'border-radius:0 9px 9px 0;padding:9px 11px;text-align:center';
      f.innerHTML='<div style="font-size:12.5px;opacity:.82;margin-bottom:7px">'+
        '化解方法需解碼後開啟<br><span style="opacity:.72;font-size:11.5px">'+
        'NT$699 一次付清,<b style="color:#E0C285">全站深解永久開啟</b></span></div>'+
        '<button class="bpsy-btn" data-bpsy-open style="font-size:13px;padding:8px 16px">🔑 解碼</button>';
    }
    if(window.BPSY && BPSY.bind)BPSY.bind();
  }
  var g=document.getElementById('grid');
  try{ if(g)new MutationObserver(gate).observe(g,{childList:true}); }catch(e){}
  setTimeout(gate,400); setTimeout(gate,1400);
  document.addEventListener('click',function(){ setTimeout(gate,120) });
})();
</script>
