<script>
const ST='甲乙丙丁戊己庚辛壬癸',BR='子丑寅卯辰巳午未申酉戌亥';
const jdn=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045};
const deltaT=y=>y>=2005?62.92+.32217*(y-2000)+.005589*(y-2000)**2:y>=1986?63.86+.3345*(y-2000)-.060374*(y-2000)**2:70;
function sunLon(jd,y){const t=(jd+deltaT(y)/86400-2451545)/36525;
  const L=280.46646+36000.76983*t,M=(357.52911+35999.05029*t)*Math.PI/180;
  const C=(1.914602-.004817*t)*Math.sin(M)+(.019993-.000101*t)*Math.sin(2*M)+.000289*Math.sin(3*M);
  const O=(125.04-1934.136*t)*Math.PI/180;
  return (((L+C-.00569-.00478*Math.sin(O))%360)+360)%360}
// 求指定黃經之時刻(JD,UT);hint 為起始估計
function termJD(y,target){let jd=jdn(y,3,21)+((target%360)+360)%360/360*365.2422;
  for(let i=0;i<8;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  if(jd>=jdn(y+1,1,1)-0.5)jd-=365.2422;
  if(jd<jdn(y,1,1)-0.5)jd+=365.2422;
  for(let i=0;i<3;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  return jd}
// ── 朔(新月)Meeus 49 ──
function newMoonJD(k){
  const T=k/1236.85,rad=Math.PI/180;
  let jde=2451550.09766+29.530588861*k+0.00015437*T*T-0.000000150*T*T*T+0.00000000073*Math.pow(T,4);
  const E=1-0.002516*T-0.0000074*T*T;
  const M=(2.5534+29.10535670*k-0.0000014*T*T-0.00000011*T*T*T)*rad;
  const Mp=(201.5643+385.81693528*k+0.0107582*T*T+0.00001238*T*T*T-0.000000058*Math.pow(T,4))*rad;
  const F=(160.7108+390.67050284*k-0.0016118*T*T-0.00000227*T*T*T+0.000000011*Math.pow(T,4))*rad;
  const O=(124.7746-1.56375588*k+0.0020672*T*T+0.00000215*T*T*T)*rad;
  jde+=-0.40720*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)+0.01039*Math.sin(2*F)
   +0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)+0.00208*E*E*Math.sin(2*M)
   -0.00111*Math.sin(Mp-2*F)-0.00057*Math.sin(Mp+2*F)+0.00056*E*Math.sin(2*Mp+M)
   -0.00042*Math.sin(3*Mp)+0.00042*E*Math.sin(M+2*F)+0.00038*E*Math.sin(M-2*F)
   -0.00024*E*Math.sin(2*Mp-M)-0.00017*Math.sin(O)-0.00007*Math.sin(Mp+2*M)
   +0.00004*Math.sin(2*Mp-2*F)+0.00004*Math.sin(3*M)+0.00003*Math.sin(Mp+M-2*F)
   +0.00003*Math.sin(2*Mp+2*F)-0.00003*Math.sin(Mp+M+2*F)+0.00003*Math.sin(Mp-M+2*F)
   -0.00002*Math.sin(Mp-M-2*F)-0.00002*Math.sin(3*Mp+M)+0.00002*Math.sin(4*Mp);
  const yy=2000+k/12.3685;
  return jde-deltaT(yy)/86400; // → UT
}
const localDay=jd=>Math.floor(jd+8/24+0.5); // UT JD → 東八區曆日 JDN
// ── 農曆換算(冬至定月十一,無中氣置閏)──
function toLunar(Y,M,D){
  const jd=jdn(Y,M,D);
  // 上一個冬至(黃經270°)
  let wsY=Y,ws=localDay(termJD(Y,270));
  if(ws>jd){wsY=Y-1;ws=localDay(termJD(Y-1,270));}
  // 冬至所在朔日(=十一月朔)
  const kApprox=(ws-2451550.09766)/29.530588861;
  let k=Math.floor(kApprox)+2;
  while(localDay(newMoonJD(k))>ws)k--;
  const m11k=k;
  // 下一個冬至的十一月朔
  const ws2=localDay(termJD(wsY+1,270));
  let k2=Math.floor((ws2-2451550.09766)/29.530588861)+2;
  while(localDay(newMoonJD(k2))>ws2)k2--;
  const nMonths=k2-m11k;         // 12 或 13
  // 建立月份表
  const months=[];
  for(let i=0;i<=nMonths;i++){
    const s=localDay(newMoonJD(m11k+i)),e=localDay(newMoonJD(m11k+i+1));
    months.push({s,e,idx:i,leap:false});
  }
  if(nMonths===13){ // 閏年:第一個無中氣之月為閏
    for(let i=1;i<nMonths;i++){
      const m=months[i];let has=false;
      for(let t=0;t<12;t++){const lon=(270+t*30)%360;
        for(const yy of [wsY,wsY+1]){const tj=localDay(termJD(yy,lon));
          if(tj>=m.s&&tj<m.e){has=true;break}}
        if(has)break}
      if(!has){m.leap=true;break}
    }
  }
  // 命名:十一月起算,閏月沿用前一月號
  let n=11;
  for(const m of months){
    if(m.leap){m.name=n===1?12:n-1;m.isLeap=true;}
    else{m.name=n;m.isLeap=false;n=n%12+1;}
  }
  const cur=months.find(m=>jd>=m.s&&jd<m.e)||months[0];
  return{month:cur.name,day:jd-cur.s+1,isLeap:cur.isLeap,
    yearGZ:null};
}

function yearGZ(Y,M,D,h){
  const J=jdn(Y,M,D)+(h-12)/24-8/24;
  const lc=termJD(Y,315);
  const sui=(J>=lc)?Y:Y-1;
  return{i:((sui-1984)%60+60)%60,sui};
}

function sfDeep(stars){
  const s=new Set(stars);
  const has=(...a)=>a.every(x=>s.has(x));
  const any=(...a)=>a.some(x=>s.has(x));
  if(has('七殺','破軍','貪狼'))return '此宮走「殺破狼」動盪之路,一生變化起伏大;宜順勢而動、以變應變,靜守反招困';
  if(has('天機','太陰','天同','天梁'))return '「機月同梁」之組合,主穩健規劃、宜受薪專業與幕僚之路,不宜冒進投機';
  if(has('紫微','天府'))return '帝星庫星並照,格局厚實有守成之力;主此宮之事有貴氣、有底蘊';
  if(has('天府','天相'))return '「府相朝垣」之會,主此宮衣祿豐足、行事有分寸,能守成得安穩';
  if(has('太陽','太陰'))return '日月並照,陰陽調和;主此宮之事光明中有細膩,唯忌日月落陷則勞而少得';
  if(has('太陽','巨門'))return '巨日相會,主以言語專業取勝;此宮之事宜攤在陽光下處理,忌暗中運作生是非';
  if(has('武曲','貪狼'))return '武貪相會,主先難後易、三十後漸入佳境;此宮之事宜厚積薄發';
  if(has('廉貞','七殺'))return '廉殺相會,主此宮多變數與競爭,需魄力承擔;見煞則防意外官非';
  if(any('七殺','破軍','貪狼'))return '此宮見殺破狼之一,主動盪與開創並存;宜主動求變,不宜消極等待';
  if(any('天機','天同','天梁','太陰'))return '此宮星性偏柔和穩健,主循序漸進、以柔克剛,不宜強求急進';
  return '此宮吉凶須合會照諸星參看——本宮為體、三方為用,單論一宮易失偏頗';
}

const ZIWU=BPPACK.proxy('ziwei.ZIWU',true);
const NI_SHA='擎羊陀羅火星鈴星地空地劫';
function niLun(z){
  // 一、疾厄致命傷:掃十二宮煞忌
  const score=[];
  for(let i=0;i<12;i++){
    let n=0;const items=[];
    z.P[i].sha.forEach(s=>{if(NI_SHA.includes(s)){n+=1;items.push(s)}});
    Object.entries(z.P[i].hua).forEach(([nm,t])=>{if(t==='忌'){n+=1.5;items.push(nm+'化忌')}});
    score.push({i,n,items});
  }
  const mx=Math.max(...score.map(s=>s.n));
  const worst=score.filter(s=>s.n===mx&&mx>0);
  // 二、先天財 / 後天財
  const CAIXING='武曲天府太陰祿存';
  const inG=(i,arr)=>z.P[i].zhu.concat(z.P[i].aux).filter(s=>arr.includes(s));
  const gIdx=n=>+Object.keys(z.gname).find(k=>z.gname[k]===n);
  const mi=z.ming, cai=gIdx('財帛'), guan=gIdx('官祿'), qian=gIdx('遷移');
  const hasLu=i=>Object.values(z.P[i].hua).includes('祿');
  const xian=inG(mi,CAIXING).concat(inG(cai,CAIXING)).length+(hasLu(mi)||hasLu(cai)?1:0);
  const hou=inG(qian,CAIXING).concat(inG(guan,CAIXING)).length+(hasLu(qian)||hasLu(guan)?1:0);
  // 三、財帛 vs 官祿 何者旺
  const wgt=i=>z.P[i].zhu.length*2+inG(i,'文昌文曲左輔右弼天魁天鉞祿存').length+(hasLu(i)?2:0)
             +(Object.values(z.P[i].hua).includes('權')?2:0)-z.P[i].sha.filter(s=>NI_SHA.includes(s)).length;
  return{worst,xian,hou,caiW:wgt(cai),guanW:wgt(guan),qianW:wgt(qian),cai,guan,qian,
    fu:gIdx('福德'),qi:gIdx('夫妻'),xiong:gIdx('兄弟'),ji:gIdx('疾厄')};
}

const BOSHI=['博士','力士','青龍','小耗','將軍','奏書','飛廉','喜神','病符','大耗','伏兵','官府'];
const SUIQIAN=['歲建','晦氣','喪門','貫索','官符','小耗','歲破','龍德','白虎','天德','弔客','病符'];
const JIANGQIAN=['將星','攀鞍','歲驛','息神','華蓋','劫煞','災煞','天煞','指背','咸池','月煞','亡神'];
const JIANG_START={'申子辰':0,'寅午戌':6,'巳酉丑':9,'亥卯未':3};
const XIAOXIAN_START={'寅午戌':4,'申子辰':10,'巳酉丑':7,'亥卯未':1};
// 雜曜依年干
const TIANGUAN={'甲':7,'乙':4,'丙':5,'丁':2,'戊':3,'己':9,'庚':11,'辛':9,'壬':10,'癸':6};
const TIANFU_S={'甲':9,'乙':8,'丙':0,'丁':11,'戊':3,'己':2,'庚':6,'辛':5,'壬':6,'癸':5};
const JIEKONG={'甲':[8,9],'己':[8,9],'乙':[6,7],'庚':[6,7],'丙':[4,5],'辛':[4,5],'丁':[2,3],'壬':[2,3],'戊':[0,1],'癸':[0,1]};
const TIANWU=[5,8,2,11,5,8,2,11,5,8,2,11];   // 正月起(巳申寅亥循環)
const TIANYUE=[10,5,4,2,7,3,11,7,2,6,10,2];  // 正月起
const YINSHA=[2,0,10,8,6,4,2,0,10,8,6,4];    // 正月起
const YUEJIE=[8,8,10,10,0,0,2,2,4,4,6,6];    // 月解神:正二申・三四戌…
const GUAGUA={'亥子丑':[2,10],'寅卯辰':[5,1],'巳午未':[8,4],'申酉戌':[11,7]};
const FEILIAN={'子丑寅':[8,9,10],'卯辰巳':[5,6,7],'午未申':[2,3,4],'酉戌亥':[11,0,1]};
function ziwei(Y,M,D,h,male){
  const lu=toLunar(Y,M,D);
  const hB=Math.floor((h+1)/2)%12;
  const yg=yearGZ(Y,M,D,h);
  const yGan=ST[yg.i%10],yZhi=BR[yg.i%12];
  // 命宮/身宮
  const ming=((2+(lu.month-1)-hB)%12+12)%12;
  const shen=((2+(lu.month-1)+hB)%12)%12;
  // 宮干(五虎遁:年干→寅宮干)
  const yinGan={'甲':2,'己':2,'乙':4,'庚':4,'丙':6,'辛':6,'丁':8,'壬':8,'戊':0,'癸':0}[yGan];
  const gongGan=i=>ST[(yinGan+((i-2)%12+12)%12)%10];
  // 五行局(命宮干支納音)
  const mGan=gongGan(ming),mZhi=BR[ming];
  const mGZ=(()=>{for(let i=0;i<60;i++)if(ST[i%10]===mGan&&BR[i%12]===mZhi)return i;return 0})();
  const ju=NAYIN_JU[mGZ];
  // 紫微
  const d=lu.day;
  const r=(ju-d%ju)%ju, n=(d+r)/ju;
  let zw=(2+(n-1))%12;
  zw=r%2===0?(zw+r)%12:((zw-r)%12+12)%12;
  const P=[...Array(12)].map(()=>({zhu:[],aux:[],sha:[],hua:{}}));
  const put=(i,arr,name)=>P[((i%12)+12)%12][arr].push(name);
  // 紫微星系(逆)
  put(zw,'zhu','紫微');put(zw-1,'zhu','天機');put(zw-3,'zhu','太陽');
  put(zw-4,'zhu','武曲');put(zw-5,'zhu','天同');put(zw-8,'zhu','廉貞');
  // 天府星系(順)
  const tf=((4-zw)%12+12)%12;
  put(tf,'zhu','天府');put(tf+1,'zhu','太陰');put(tf+2,'zhu','貪狼');
  put(tf+3,'zhu','巨門');put(tf+4,'zhu','天相');put(tf+5,'zhu','天梁');
  put(tf+6,'zhu','七殺');put(tf+10,'zhu','破軍');
  // 六吉
  put(4+(lu.month-1),'aux','左輔');put(10-(lu.month-1),'aux','右弼');
  put(10-hB,'aux','文昌');put(4+hB,'aux','文曲');
  const[kui,yue]=KUIYUE[yGan];put(kui,'aux','天魁');put(yue,'aux','天鉞');
  // 祿存・羊陀
  const lc2=LUCUN[yGan];put(lc2,'aux','祿存');
  put(lc2+1,'sha','擎羊');put(lc2-1,'sha','陀羅');
  // 火鈴(年支三合起,順數生時)
  for(const[k,v]of Object.entries(HUOLING))if(k.includes(yZhi)){
    put(v[0]+hB,'sha','火星');put(v[1]+hB,'sha','鈴星');break}
  // 空劫
  put(11-hB,'sha','地空');put(11+hB,'sha','地劫');
  // 四化
  const[lu4,quan,ke,ji]=SIHUA[yGan];
  const mark=(nm,t)=>{for(let i=0;i<12;i++){
    if(P[i].zhu.includes(nm)||P[i].aux.includes(nm)||P[i].sha.includes(nm))P[i].hua[nm]=t}};
  mark(lu4,'祿');mark(quan,'權');mark(ke,'科');mark(ji,'忌');
  // ── 雜曜 ──
  const yb=BR.indexOf(yZhi),lm=lu.month,ld=lu.day;
  const zaAdd=(i,nm)=>P[((i%12)+12)%12].aux.push(nm);
  for(const[k,v]of Object.entries(JIANG_START))if(k.includes(yZhi)){
    zaAdd([8,2,11,5][Object.keys(JIANG_START).indexOf(k)],'天馬');break}
  zaAdd(3-yb,'紅鸞');zaAdd(3-yb+6,'天喜');
  zaAdd(9+(lm-1),'天刑');zaAdd(1+(lm-1),'天姚');
  const lfPos=((4+(lm-1))%12+12)%12, rbPos=((10-(lm-1))%12+12)%12;
  const wcPos=((10-hB)%12+12)%12, wqPos=(4+hB)%12;
  zaAdd(lfPos+(ld-1),'三臺');zaAdd(rbPos-(ld-1),'八座');
  zaAdd(wcPos+(ld-1)-1,'恩光');zaAdd(wqPos+(ld-1)-1,'天貴');
  zaAdd(4+yb,'龍池');zaAdd(10-yb,'鳳閣');
  zaAdd(6-yb,'天哭');zaAdd(6+yb,'天虛');
  zaAdd(TIANGUAN[yGan],'天官');zaAdd(TIANFU_S[yGan],'天福');
  zaAdd(TIANWU[lm-1],'天巫');zaAdd(TIANYUE[lm-1],'天月');
  zaAdd(YINSHA[lm-1],'陰煞');zaAdd(YUEJIE[lm-1],'解神');
  zaAdd(yb+1,'天空');zaAdd(10-yb,'年解');
  zaAdd(ming+yb,'天才');zaAdd(shen+yb,'天壽');
  for(const[k,v]of Object.entries(GUAGUA))if(k.includes(yZhi)){zaAdd(v[0],'孤辰');zaAdd(v[1],'寡宿');break}
  for(const[k,v]of Object.entries(FEILIAN))if(k.includes(yZhi)){zaAdd(v[k.indexOf(yZhi)],'蜚廉');break}
  zaAdd({0:5,6:5,3:5,9:5,2:9,8:9,5:9,11:9,4:1,10:1,1:1,7:1}[yb],'破碎');
  const[jk1,jk2]=JIEKONG[yGan];zaAdd(jk1,'副截');zaAdd(jk2,'截空');
  const dayGZ=(()=>{let civ=jdn(Y,M,D);if(h>=23)civ+=1;return((civ-11)%60+60)%60})();
  const xun=Math.floor(dayGZ/10)*10;
  zaAdd((xun+11)%12,'旬空');zaAdd((xun+10)%12,'副旬');
  zaAdd(6+hB,'臺輔');zaAdd(2+hB,'封誥');
  zaAdd({'甲':5,'乙':6,'丙':0,'丁':5,'戊':6,'己':8,'庚':2,'辛':6,'壬':9,'癸':11}[yGan],'天廚');
  zaAdd(((ming-7)%12+12)%12,'天傷');zaAdd(((ming-5)%12+12)%12,'天使');
  zaAdd(yb+5,'月德');
  // 十二宮(逆佈)
  const gname={};for(let g=0;g<12;g++)gname[((ming-g)%12+12)%12]=GONG12[g];
  // 大限(陽男陰女順,陰男陽女逆)
  const yangY=(yg.i%10)%2===0;
  const fw=(yangY===male);
  const dx={};for(let s=0;s<12;s++){
    const i=((ming+(fw?s:-s))%12+12)%12;
    dx[i]=[ju+s*10,ju+s*10+9]}
  // 四大十二神
  const cs={},bs={},sq={},jq={};
  const csS=CS_START[ju];
  for(let s=0;s<12;s++){
    cs[((csS+(fw?s:-s))%12+12)%12]=CHANGSHENG[s];
    bs[((lc2+(fw?s:-s))%12+12)%12]=BOSHI[s];
    sq[(yb+s)%12]=SUIQIAN[s];
  }
  for(const[k,v]of Object.entries(JIANG_START))if(k.includes(yZhi)){
    for(let s=0;s<12;s++)jq[(v+s)%12]=JIANGQIAN[s];break}
  // 小限(年支三合起,男順女逆)+ 流年虛歲
  const xx={},ln={};
  let xs=0;for(const[k,v]of Object.entries(XIAOXIAN_START))if(k.includes(yZhi)){xs=v;break}
  for(let a=1;a<=72;a++){
    const i=((xs+(male?a-1:-(a-1)))%12+12)%12;(xx[i]=xx[i]||[]).push(a);
    const j=((yb+a-1)%12+12)%12;(ln[j]=ln[j]||[]).push(a);
  }
  return{lu,hB,yGan,yZhi,yGZ:yGan+yZhi,ming,shen,ju,zw,P,gname,gongGan,dx,fw,
    sihua:[lu4,quan,ke,ji],cs,bs,sq,jq,xx,ln,
    mingZhu:MINGZHU[ming],shenZhu:SHENZHU[yb],ziDou:BR[((10-hB)%12+12)%12]};
}
// ── 渲染 ──
// 傳統盤面:巳午未申(上排左→右)、酉戌亥(右排下行)、子丑寅(下排右→左)、卯辰(左排上行)
const POS=[[3,2],[3,1],[3,0],[2,0],[1,0],[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[3,3]]; // 地支(子=0)→[列,行]
document.getElementById('go').onclick=render;
function render(){
  const[Y,M,D]=document.getElementById('bd').value.split('-').map(Number);
  const[h,mn]=document.getElementById('bt').value.split(':').map(Number);
  const male=document.getElementById('sex').value==='1';
  let z;try{z=ziwei(Y,M,D,h+mn/60,male)}catch(e){alert('排盤錯誤:'+e.message);return}
  document.getElementById('lunarInfo').textContent=
    '農曆 '+(z.lu.isLeap?'閏':'')+z.lu.month+'月'+z.lu.day+'日 ・'+z.yGZ+'年 ・'+BR[z.hB]+'時 ・'+JU_NAME[z.ju];
  const cur=new Date().getFullYear(),age=cur-Y+1;
  const el=document.getElementById('chart');el.innerHTML='';
  const cells={};
  for(let i=0;i<12;i++){
    const[r,c]=POS[i];
    const p=z.P[i];const dx=z.dx[i];
    const inDx=age>=dx[0]&&age<=dx[1];
    const d=document.createElement('div');
    d.className='pal'+(i===z.ming?' ming':'')+(i===z.shen?' shen':'')+(inDx?' daxian':'');
    d.style.gridRow=r+1;d.style.gridColumn=c+1;
    const JI6='文昌文曲左輔右弼天魁天鉞祿存天馬';
    const cls=s=>p.zhu.includes(s)?'zhu':JI6.includes(s)?'ji':p.sha.includes(s)?'sha':'za';
    const star=s=>{const b=brOf(s,i),hv=p.hua[s];
      return '<span class="star '+cls(s)+'"><span class="nm">'+[...s].join('<br>')+'</span>'
        +(b?'<span class="br">'+b+'</span>':'')
        +(hv?'<span class="hb" style="background:'+({'祿':'#1d6b3f','權':'#c9944a','科':'#3E5C76','忌':'#c0392b'})[hv]+'">'+hv+'</span>':'')+'</span>'};
    const all=p.zhu.concat(p.aux.filter(s=>JI6.includes(s)),p.sha,p.aux.filter(s=>!JI6.includes(s)));
    d.innerHTML='<div class="stars">'+(all.map(star).join('')||'<span style="opacity:.3;font-size:9px">空宮</span>')+'</div>'
      +'<div class="nums">流年:'+(z.ln[i]||[]).slice(0,5).join(',')+'<br>小限:'+(z.xx[i]||[]).slice(0,5).join(',')+'</div>'
      +'<div class="shen12">'+(z.bs[i]||'')+'　'+(z.jq[i]||'')+'　'+(z.sq[i]||'')+'</div>'
      +'<div class="palft"><span class="dx">'+dx[0]+'~'+dx[1]+'</span>'
      +'<span style="text-align:right"><span class="cs">'+(z.cs[i]||'')+'</span> <span class="gz">'+z.gongGan(i)+BR[i]+'</span><br><span class="gname">'+z.gname[i]+'</span></span></div>';
    el.appendChild(d);cells[i]=d;
  }
  const ctr=document.createElement('div');ctr.className='center';
  const mp=z.P[z.ming];
  ctr.innerHTML='<b style="font-family:\'Noto Serif TC\',serif;font-size:15px;color:var(--gold)">命盤</b>'
    +'<div>'+Y+'/'+M+'/'+D+' '+String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0')+' '+(male?'乾造(男)':'坤造(女)')+'</div>'
    +'<div>農曆 '+(z.lu.isLeap?'閏':'')+z.lu.month+'月'+z.lu.day+'日 '+BR[z.hB]+'時</div>'
    +'<div>'+z.yGZ+'年生・<b>'+JU_NAME[z.ju]+'</b></div>'
    +'<div>命宮 <b style="color:var(--gold)">'+BR[z.ming]+'</b>・身宮 <b style="color:var(--blue)">'+BR[z.shen]+'</b></div>'
    +'<div>命主:<b>'+z.mingZhu+'</b>　身主:<b>'+z.shenZhu+'</b>　子斗:'+z.ziDou+'</div>'
    +'<div>命主星:<b>'+(mp.zhu.join('、')||'空宮(借對宮)')+'</b></div>'
    +'<div style="font-size:11px;opacity:.7">四化:'+z.yGan+'干 '+z.sihua[0]+'祿 '+z.sihua[1]+'權 '+z.sihua[2]+'科 '+z.sihua[3]+'忌</div>'
    +'<div style="font-size:11px;opacity:.7">大限'+(z.fw?'順行':'逆行')+'・現年 '+age+' 歲(虛歲)</div>';
  el.appendChild(ctr);
  // ═══ 詳解 ═══
  const dtl=document.getElementById('detail');
  const dxNow=Object.entries(z.dx).find(([i,v])=>age>=v[0]&&age<=v[1]);
  const JI6='文昌文曲左輔右弼天魁天鉞祿存天馬';
  const huaOf=i=>Object.entries(z.P[i].hua).map(([n,t])=>n+'化'+t);
  const sfOf=i=>[(i+6)%12,(i+4)%12,(i+8)%12]; // 對宮+三合
  const starsIn=i=>z.P[i].zhu.length?z.P[i].zhu:[];
  let h2='';
  // 一、格局
  const pats=patterns(z);
  h2+='<h2>一、格局判定(大師論法之綱)</h2>';
  h2+=pats.length?pats.map(([n,d,lv])=>
    '<div style="padding:6px 0;border-bottom:1px dashed rgba(160,140,90,.3)">'
    +'<b style="font-size:15px;color:'+(lv==='吉'?'var(--green)':lv==='凶'?'var(--red)':'var(--gold)')+'">【'+n+'】</b>'
    +'<div style="font-size:13.5px;line-height:1.8">'+d+'</div></div>').join('')
    :'<div style="font-size:13px;opacity:.7">未成特殊格局,以本命主星與三方四正論之。</div>';
  // 二、四化
  h2+='<h2>二、四化飛星落宮(論吉凶之樞)</h2>';
  const huaPos=t=>{for(let i=0;i<12;i++)for(const nm of Object.keys(z.P[i].hua))if(z.P[i].hua[nm]===t)return[nm,z.gname[i],BR[i],i];return null};
  const HUA_DEEP={'祿':'財源與機緣所在,此宮之事最能順遂得利','權':'掌控與能力所在,此宮之事能主導、宜積極','科':'名聲與貴人所在,此宮之事得美名、逢凶能解','忌':'執著與糾結所在,此宮之事最耗心力,亦是此生功課'};
  h2+=['祿','權','科','忌'].map(t=>{const r=huaPos(t);if(!r)return '';
    const gi=GONG12.indexOf(r[1]);
    return '<div style="padding:7px 0;border-bottom:1px dashed rgba(160,140,90,.25)">'
    +'<b style="color:'+({'祿':'#1d6b3f','權':'#c9944a','科':'#3E5C76','忌':'#c0392b'})[t]+';font-size:15px">'+r[0]+'化'+t+' → 入'+r[1]+'宮('+r[2]+')</b>'
    +'<div style="font-size:13.5px;line-height:1.85;margin-top:2px">'+(HG[t]||[])[gi]+'</div>'
    +'<div style="font-size:12.5px;opacity:.72;margin-top:2px">【樞機】'+HUA_DEEP[t]+'。'
    +(t==='忌'?'忌之對宮亦受牽動('+z.gname[(r[3]+6)%12]+'宮),此謂「忌沖」——凡忌所沖之宮,其事亦難順遂,論命不可只看忌落何宮而忽略其所沖。':'')+'</div></div>'}).join('');
  // 四化互涉
  const jiP=huaPos('忌'),luP=huaPos('祿');
  if(jiP&&luP){
    if(jiP[3]===luP[3])h2+='<div style="font-size:13px;background:rgba(201,169,106,.15);padding:6px 9px;border-radius:8px;margin-top:4px"><b>【祿忌同宮】</b>此宮福禍相倚、得失並存——正是一生用力最深也最糾結之處;能看破則祿存忌消,執著則兩失。</div>';
    else if((jiP[3]+6)%12===luP[3])h2+='<div style="font-size:13px;background:rgba(166,58,46,.1);padding:6px 9px;border-radius:8px;margin-top:4px"><b>【祿忌相沖】</b>財機與阻礙成對立之勢,主大起大落、成敗相隨;宜取捨分明,不可兩頭皆抓。</div>';
  }
  // ═══ 抱朴心法・醫命合參 ═══
  const NL=niLun(z);
  h2+='<h2 style="border-color:#8e6bb5;color:#8e6bb5">三、抱朴心法・醫命合參論法</h2>';
  const _p3=h2.length;   // ── 以下為付費解碼區 ──
  h2+='<div style="background:rgba(142,107,181,.07);border-left:3px solid #8e6bb5;border-radius:0 10px 10px 0;padding:9px 12px;font-size:13.5px;line-height:1.85">';
  // 1 疾厄致命傷
  h2+='<b style="color:#8e6bb5;font-size:14.5px">① 致命傷:子午流注定臟腑</b><br>'
   +'<span style="opacity:.85">本門論疾厄<b>不看疾厄宮之星</b>,而以中醫<b>子午流注</b>定臟腑——「肺寅大卯胃辰宮,脾巳心午小未中;膀申腎酉心包戌,亥三子膽丑肝通」。看<b>煞星與化忌聚於哪一個地支宮</b>,該地支所主之臟腑即是此生<b>致命傷</b>。坊間「七殺在疾厄主痔瘡」之類的說法無濟於事——論命要論的是致命傷,不是小毛病。</span><br>';
  if(NL.worst.length){
    h2+=NL.worst.map(w=>'<div style="margin:4px 0;padding:6px 9px;background:rgba(255,255,255,.06);border-radius:8px">'
      +'<b style="color:var(--red);font-size:14.5px">'+BR[w.i]+'宮 → '+ZIWU[w.i][0]+'</b>'
      +' <span style="font-size:12px;opacity:.7">(見'+w.items.join('、')+')</span>'
      +'<div style="font-size:13px">'+ZIWU[w.i][1]+'</div></div>').join('');

      +'<b style="color:'+({'祿':'#1d6b3f','權':'#c9944a','科':'#3E5C76','忌':'#c0392b'})[t]+';font-size:14px">'+nm+'化'+t+' → 入本命'+bg+'宮('+BR[pi]+')　流年'+lyName[pi]+'宮</b>'
      +'<div style="font-size:13px;line-height:1.8">'+(HG[t]||[])[gi]+'</div>'
      +(t==='忌'?'<div style="font-size:12.5px;color:var(--red)">⚠ 本年忌星所落之宮為最需留意處,且沖'+z.gname[(pi+6)%12]+'宮;此二宮之事今年宜守不宜攻。</div>':'')
      +'</div>'}).join('');
  // 流年與本命四化交會
  const benJi=huaPos('忌');

    h2+='<div style="font-size:13px;background:rgba(166,58,46,.12);padding:7px 10px;border-radius:8px;margin-top:5px"><b>【流年忌沖本命忌】</b>本年流忌與本命忌疊於同宮,謂之「雙忌臨門」——此宮之事今年壓力最重、最易出狀況;宜提前防範、以退為進,切忌強行推進。</div>';
  if(benJi&&findStar(l4a)===benJi[3])
    h2+='<div style="font-size:13px;background:rgba(74,107,79,.12);padding:7px 10px;border-radius:8px;margin-top:5px"><b>【流祿解本命忌】</b>本年流年化祿入本命忌宮,主長年之結今年得解;宜把握此機會處理積壓已久之事。</div>';
  h2+='<div style="font-size:12.5px;opacity:.78;line-height:1.8;margin-top:6px">'
    +'<b>【流年論法次第】</b>先看流年命宮落本命何宮,定本年主軸;次看流年四化入本命十二宮,定吉凶著力點;再合大限之勢——大限為十年之體、流年為一年之用,限吉年凶則波折有限,限凶年凶則須格外謹慎。小限與流年可互參,以流年為主、小限為輔。</div>';
  h2+='<div class="note">論法要旨:一看格局成敗、二看四化流向、三看三方四正會照、四看大限流年引動。單宮獨論易失偏頗,必須「宮宮相參、星星互看」;吉中須察其凶、凶中須尋其解,方為完整論法。<br>安星依通行《紫微斗數全書》口訣;農曆以天文朔望與中氣置閏推算(非查表)。星曜廟旺陷與四化各派微異,重大論斷請以師承為準。</div>';
  dtl.innerHTML=h2;
  window.BPSY&&BPSY.bind(dtl);
  // 報告書輸出
  if(window.BPRPT){
    const _old=document.getElementById('rptBox'); if(_old)_old.remove();
    const _box=document.createElement('div'); _box.id='rptBox';
    dtl.appendChild(_box);
    BPRPT.button(_box,function(){
      return {
        title:'紫微斗數命書',
        meta:[['出生',document.getElementById('bd').value+' '+document.getElementById('bt').value],
              ['性別',document.getElementById('sex').selectedOptions[0].textContent],
              ['年干支',z.yGZ],['五行局',JU_NAME[z.ju]],
              ['命宮',BR[z.ming]+'宮'],['身宮',BR[z.shen]+'宮']],
        html:'<div id="chartPrint">'+document.getElementById('chart').innerHTML+'</div>'+h2
      };
    });
  }
  window.fscP&&window.fscP('ziwei','chart',z.yGZ+'/'+JU_NAME[z.ju]);
}

<script>
/* ---- BPZWDAILY 紫微・當月與當日運勢（飛星四化論法）----
   宮位：斗君法。斗君 = 流年支宮起正月「逆數」到生月，再起子時「順數」到生時；
         斗君即流月正月命宮，順行得各月；流月命宮起初一順行得流日。
   論斷：以四化交涉為主軸 —— 三方四正、忌沖、疊祿疊忌、祿隨忌走、四層疊宮。
   ⚠ 只看命宮不看三方四正，等於只看一半；忌之所沖才是出事的地方。 */
(function(){
  var ID="bp-zwdaily", ZHI="子丑寅卯辰巳午未申酉戌亥", GAN="甲乙丙丁戊己庚辛壬癸";
  var HUA=["祿","權","科","忌"];
  var SHA=["擎羊","陀羅","火星","鈴星","地空","地劫"];
  function el(x){ return document.getElementById(x); }

  function build(){
    if(!(window.__ZW && window.BPLUCK && window.BPBAZI)) return;
    var li=el("lunarInfo"); if(!li||!li.textContent) return;
    var bm=(li.textContent.match(/農曆\s*(\d+)月/)||[])[1];
    var bh=(li.textContent.match(/([子丑寅卯辰巳午未申酉戌亥])時/)||[])[1];
    if(!bm||!bh) return;
    var pals=[].slice.call(document.querySelectorAll(".pal"));
    if(pals.length!==12) return;

    function pal(i){
      var e=pals[((i%12)+12)%12], s=e.textContent.replace(/\s+/g," ");
      return { i:((i%12)+12)%12, zhi:ZHI[((i%12)+12)%12],
        name:(s.match(/命宮|兄弟|夫妻|子女|財帛|疾厄|遷移|僕役|官祿|田宅|福德|父母/)||[""])[0],
        stars:(s.match(/紫微|天機|太陽|武曲|天同|廉貞|天府|太陰|貪狼|巨門|天相|天梁|七殺|破軍/g)||[]),
        sha:SHA.filter(function(x){ return s.indexOf(x)>=0; }),
        gz:(s.match(/[甲乙丙丁戊己庚辛壬癸][子丑寅卯辰巳午未申酉戌亥]/)||[""])[0] };
    }
    function starPal(nm){ for(var k=0;k<12;k++){ if(pals[k].textContent.indexOf(nm)>=0) return pal(k); } return null; }
    function hua(gan){ return (__ZW.SIHUA && __ZW.SIHUA[gan]) ? __ZW.SIHUA[gan] : null; }
    function huaPals(gan){ var h=hua(gan); if(!h) return null;
      return h.map(function(st,q){ return { star:st, hua:HUA[q], p:starPal(st) }; }); }

    var n=new Date(), Y=n.getFullYear(), M=n.getMonth()+1, D=n.getDate();
    var lun=__ZW.toLunar(Y,M,D), lm=parseInt(lun.month,10)||0, ld=lun.day|0;
    if(!lm||!ld) return;
    var yg=__ZW.yearGZ?__ZW.yearGZ(Y,M,D):null;
    var yzhi=(yg&&yg.zhi)?yg.zhi:ZHI[((Y-4)%12+12)%12];
    var ygan=(yg&&yg.gan)?yg.gan:GAN[((Y-4)%10+10)%10];
    var dj=((ZHI.indexOf(yzhi)-(parseInt(bm,10)-1)+ZHI.indexOf(bh))%12+12)%12;
    var mp=(dj+(lm-1))%12, dp=(mp+(ld-1))%12;

    var idx=BPLUCK.dayIdx(Y,M,D), dgz=BPLUCK.gz(idx), dgan=dgz.charAt(0);
    var P0=pal(dp), OPP=pal(dp+6), S1=pal(dp+4), S2=pal(dp+8);
    var MP=pal(mp);
    var mingIdx=-1, dxIdx=-1;
    pals.forEach(function(e,i){ if(/\bming\b/.test(e.className)) mingIdx=i; if(/daxian/.test(e.className)) dxIdx=i; });
    var lyIdx=ZHI.indexOf(yzhi);

    var dH=huaPals(dgan), yH=huaPals(ygan);
    var natal=(function(){ var m=document.body.textContent.match(/四化:([甲乙丙丁戊己庚辛壬癸])干/); return m?huaPals(m[1]):null; })();

    function fmt(p){ return p? p.zhi+"宮（本命"+p.name+"）" : "不在盤中"; }

    /* ── 免費：干支與落宮 ── */
    var S='style="margin-top:10px;padding:9px 11px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.8"';
    var head='<div style="margin:14px 0;padding:14px;border:1px solid rgba(201,169,106,.5);border-radius:12px">'+
      '<h2 style="margin:0 0 8px;font-size:17px">🌙 今日運勢　'+Y+"/"+M+"/"+D+'</h2>'+
      '<div style="margin-bottom:6px">農曆 '+lm+'月'+ld+'日　流日 <b>'+dgz+'</b></div>'+
      '<div style="font-size:15px">流日命宮 <b>'+P0.zhi+'宮</b>（本命<b>'+P0.name+'</b>）　'+(P0.stars.join("、")||"空宮")+'</div>'+
      '<div style="opacity:.72;font-size:12.5px;margin-top:4px">斗君 '+ZHI[dj]+'宮　流月命宮 '+MP.zhi+'宮</div>';

    /* ── 付費：高階論斷 ── */
    var d="";
    d+='<div '+S+'><b>一、流日三方四正</b><br>'+
      '命宮：'+fmt(P0)+'　'+(P0.stars.join("、")||"空宮")+'<br>'+
      '對宮：'+fmt(OPP)+'　'+(OPP.stars.join("、")||"空宮")+'<br>'+
      '三合：'+fmt(S1)+'、'+fmt(S2)+'<br>'+
      '<span style="opacity:.8">空宮者借對宮之星論之；論事必看三方四正，只看命宮會失準。</span>';
    var allSha=[].concat(P0.sha,OPP.sha,S1.sha,S2.sha);
    if(allSha.length) d+='<br><span style="color:#E8A08A">三方四正見煞：'+[].concat(P0.sha.map(function(x){return x+"(命)"}),OPP.sha.map(function(x){return x+"(對)"}),S1.sha.map(function(x){return x+"(合)"}),S2.sha.map(function(x){return x+"(合)"})).join("、")+'　煞聚則事有阻，宜緩不宜急。</span>';
    else d+='<br><span style="color:#9BD8A6">三方四正不見六煞，今日行事阻力小。</span>';
    d+="</div>";

    if(dH){
      var rows=dH.map(function(x){
        var line="・"+x.star+"化"+x.hua+"　→ "+fmt(x.p);
        if(x.hua==="忌" && x.p) line+='<br>　　<span style="color:#E8A08A">忌沖 '+fmt(pal(x.p.i+6))+'　—— 今日真正的破口在此宮</span>';
        return line;
      });
      d+='<div '+S+'><b>二、流日四化（'+dgan+'干）</b><br>'+rows.join("<br>")+"</div>";

      /* 三、四化交涉 */
      var cross=[];
      var dJi=dH[3]&&dH[3].p, dLu=dH[0]&&dH[0].p;
      if(natal){
        var nJi=natal[3]&&natal[3].p, nLu=natal[0]&&natal[0].p;
        if(dJi&&nJi&&dJi.i===nJi.i) cross.push('<b style="color:#E88A8A">疊忌</b>：流日忌與本命忌同落 '+fmt(dJi)+'　—— 此宮之事今日必見波折，且是老問題翻出來。');
        if(dLu&&nLu&&dLu.i===nLu.i) cross.push('<b style="color:#9BD8A6">疊祿</b>：流日祿與本命祿同落 '+fmt(dLu)+'　—— 今日此宮之事最順，該推的就在今天推。');
        if(dLu&&nJi&&dLu.i===nJi.i) cross.push('<b style="color:#E8B06A">祿隨忌走</b>：流日祿入本命忌位 '+fmt(dLu)+'　—— 看似有利，實則先成後敗，得利莫貪。');
      }
      if(dJi&&dJi.i===dp) cross.push('<b style="color:#E88A8A">忌入本命（流日）</b>：化忌落自身命宮　—— 今日自作自受之象，少主動出擊。');
      if(dJi&&((dJi.i+6)%12)===dp) cross.push('<b style="color:#E88A8A">忌沖流日命宮</b>：今日自身受制，宜守。');
      if(dJi&&dJi.i===lyIdx) cross.push('流日忌入流年命宮　—— 今日之事撞上全年課題，格外留意。');
      if(dJi&&dxIdx>=0&&dJi.i===dxIdx) cross.push('流日忌入大限命宮　—— 觸動十年主軸，影響不只今天。');
      if(yH&&dJi&&yH[3]&&yH[3].p&&dJi.i===yH[3].p.i) cross.push('<b style="color:#E88A8A">流日忌與流年忌同宮</b>　—— 雙忌交攻，今日最該避的就是此宮之事。');
      d+='<div '+S+'><b>三、四化交涉</b><br>'+(cross.length? cross.map(function(x){return "・"+x}).join("<br>") : "・今日四化與本命、流年無直接交涉，屬平常之日。")+"</div>";
    }

    var lay=[];
    if(mingIdx===dp) lay.push("流日命宮＝本命命宮　—— 今日之事關乎自身根本。");
    if(dxIdx>=0&&dxIdx===dp) lay.push("流日命宮＝大限命宮　—— 力量加倍，今日之事帶十年格局。");
    if(lyIdx===dp) lay.push("流日命宮＝流年命宮　—— 今日是全年主軸的縮影。");
    if(mp===dp) lay.push("流日命宮＝流月命宮　—— 本月重點壓在今天。");
    d+='<div '+S+'><b>四、四層疊宮</b><br>'+(lay.length? lay.map(function(x){return "・"+x}).join("<br>") : "・本命、大限、流年、流月與流日命宮各自分立，今日力量單純。")+"</div>";

    d+='<div '+S+'><b>五、今日用力處</b><br>'+
      '今日心力落在<b>'+P0.name+'</b>之事；'+
      (dLu? '順處在 '+fmt(dLu)+'，該辦的事往這個方向去。' : '')+
      (dJi? '<br>忌在 '+fmt(dJi)+'，沖 '+fmt(pal(dJi.i+6))+'　—— 這兩宮之事今日不宜決斷。' : '')+
      '</div>';

    var teaser="三方四正、流日四化落宮與忌之所沖、疊祿疊忌與祿隨忌走、四層疊宮，以及今日該把力氣放在哪一宮。";
    var html=head+(window.BPSY? BPSY.gate(d,"今日與本月・紫微飛星論斷",teaser) : d)+"</div>";

    var w=el(ID);
    if(!w){ w=document.createElement("div"); w.id=ID;
      var host=el("chart");
      if(host&&host.parentNode) host.parentNode.insertBefore(w,host.nextSibling);
      else document.body.appendChild(w); }
    w.innerHTML=html;
    if(window.BPSY&&BPSY.bind) BPSY.bind(w);
  }
  function boot(){
    if(!(window.__ZW&&window.BPLUCK&&window.BPSY)) return setTimeout(boot,300);
    var g=el("go"); if(g) g.addEventListener("click",function(){ setTimeout(build,900) });
    setTimeout(build,1200); setTimeout(build,2600);
  }
  boot();
})();
</script>
