<h1>☰ 易經推命(四柱命卦)</h1>

<div class="note">《天紀・天機道》易經推命法:排四柱→取干支數→天數地數→依洛書起卦→八卦相盪成先天卦→取元堂→變後天卦。此法市面罕見,倪師稱其與斗數、鐵版神數並列最精準之三術。</div>

<script>
const ST='甲乙丙丁戊己庚辛壬癸',BR='子丑寅卯辰巳午未申酉戌亥';
// ── 曆法(節氣分月・五虎遁・五鼠遁)──
const jdn=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045};
const deltaT=y=>y>=2005?62.92+.32217*(y-2000)+.005589*(y-2000)**2:y>=1986?63.86+.3345*(y-2000)-.060374*(y-2000)**2:70;
function sunLon(jd,y){const t=(jd+deltaT(y)/86400-2451545)/36525;
  const L=280.46646+36000.76983*t,M=(357.52911+35999.05029*t)*Math.PI/180;
  const C=(1.914602-.004817*t)*Math.sin(M)+(.019993-.000101*t)*Math.sin(2*M)+.000289*Math.sin(3*M);
  const O=(125.04-1934.136*t)*Math.PI/180;
  return (((L+C-.00569-.00478*Math.sin(O))%360)+360)%360}
function termJdn(y,target){let jd=jdn(y,3,21)+((target%360)+360)%360/360*365.2422;
  for(let i=0;i<6;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  if(jd>=jdn(y+1,1,1)-0.5)jd-=365.2422; if(jd<jdn(y,1,1)-0.5)jd+=365.2422;
  for(let i=0;i<3;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  return jd}
const gzi=(s,b)=>((6*s-5*b)%60+60)%60, gz=i=>ST[i%10]+BR[i%12];
function fourPillars(Y,M,D,h){
  const J=jdn(Y,M,D)+(h-12)/24-8/24;
  let civ=jdn(Y,M,D); if(h>=23)civ+=1;
  const day=((civ-11)%60+60)%60;
  const lc=termJdn(Y,315);
  const sui=(J>=lc)?Y:Y-1;
  const year=((sui-1984)%60+60)%60;
  const lon=sunLon(J,Y);
  const mi=Math.floor(((lon-315)%360+360)%360/30);
  const mB=(mi+2)%12, mS=((year%10)%5*2+2+mi)%10;
  const hB=Math.floor((h+1)/2)%12, hS=((day%10)%5*2+hB)%10;
  return{year,month:gzi(mS,mB),day,hour:gzi(hS,hB),sui,hB,mi};
}
// ── 天機道:干支取數 ──
// 天干佈洛書之數(後天納甲:乾納甲壬、坤納乙癸、艮丙、兌丁、坎戊、離己、震庚、巽辛)
const TG_NUM={'甲':6,'乙':2,'丙':8,'丁':7,'戊':1,'己':9,'庚':3,'辛':4,'壬':6,'癸':2};
// 地支佈河圖之數(各取本五行生成之數一對)
const DZ_NUM={'亥':[1,6],'子':[1,6],'巳':[2,7],'午':[2,7],'寅':[3,8],'卯':[3,8],
'申':[4,9],'酉':[4,9],'辰':[5,10],'戌':[5,10],'丑':[5,10],'未':[5,10]};
const LUOSHU={1:'坎',2:'坤',3:'震',4:'巽',6:'乾',7:'兌',8:'艮',9:'離'};
const TRIG={'乾':[1,1,1],'兌':[1,1,0],'離':[1,0,1],'震':[1,0,0],
'巽':[0,1,1],'坎':[0,1,0],'艮':[0,0,1],'坤':[0,0,0]}; // 由上而下(上中下爻)
// 註:此處以「由下而上」存放較便運算
const TRI_LH={'乾':[1,1,1],'兌':[1,1,0],'離':[1,0,1],'震':[1,0,0],
'巽':[0,1,1],'坎':[0,1,0],'艮':[0,0,1],'坤':[0,0,0]};
// 由下而上 [初,二,三]
const TRI_UP={'乾':[1,1,1],'兌':[1,1,0],'離':[1,0,1],'震':[1,0,0],
'巽':[0,1,1],'坎':[0,1,0],'艮':[0,0,1],'坤':[0,0,0]};
function triBits(name){ // 回傳由下而上三爻
  const m={'乾':[1,1,1],'兌':[0,1,1],'離':[1,0,1],'震':[1,0,0],
  '巽':[0,1,1].slice(),'坎':[0,1,0],'艮':[0,0,1],'坤':[0,0,0]};
  const t={'乾':[1,1,1],'兌':[1,1,0],'離':[1,0,1],'震':[1,0,0],
  '巽':[0,1,1],'坎':[0,1,0],'艮':[0,0,1],'坤':[0,0,0]};
  // 標準(由下而上):乾111 兌110 離101 震100 巽011 坎010 艮001 坤000
  return t[name];
}
const BIT2TRI={'111':'乾','110':'兌','101':'離','100':'震','011':'巽','010':'坎','001':'艮','000':'坤'};
const PAIR2N={'乾乾':'乾','乾兌':'履','乾離':'同人','乾震':'无妄','乾巽':'姤','乾坎':'訟','乾艮':'遯','乾坤':'否',
'兌乾':'夬','兌兌':'兌','兌離':'革','兌震':'隨','兌巽':'大過','兌坎':'困','兌艮':'咸','兌坤':'萃',
'離乾':'大有','離兌':'睽','離離':'離','離震':'噬嗑','離巽':'鼎','離坎':'未濟','離艮':'旅','離坤':'晉',
'震乾':'大壯','震兌':'歸妹','震離':'豐','震震':'震','震巽':'恆','震坎':'解','震艮':'小過','震坤':'豫',
'巽乾':'小畜','巽兌':'中孚','巽離':'家人','巽震':'益','巽巽':'巽','巽坎':'渙','巽艮':'漸','巽坤':'觀',
'坎乾':'需','坎兌':'節','坎離':'既濟','坎震':'屯','坎巽':'井','坎坎':'坎','坎艮':'蹇','坎坤':'比',
'艮乾':'大畜','艮兌':'損','艮離':'賁','艮震':'頤','艮巽':'蠱','艮坎':'蒙','艮艮':'艮','艮坤':'剝',
'坤乾':'泰','坤兌':'臨','坤離':'明夷','坤震':'復','坤巽':'升','坤坎':'師','坤艮':'謙','坤坤':'坤'};
const FULLN={'乾':'乾為天','坤':'坤為地','屯':'水雷屯','蒙':'山水蒙','需':'水天需','訟':'天水訟','師':'地水師','比':'水地比','小畜':'風天小畜','履':'天澤履','泰':'地天泰','否':'天地否','同人':'天火同人','大有':'火天大有','謙':'地山謙','豫':'雷地豫','隨':'澤雷隨','蠱':'山風蠱','臨':'地澤臨','觀':'風地觀','噬嗑':'火雷噬嗑','賁':'山火賁','剝':'山地剝','復':'地雷復','无妄':'天雷无妄','大畜':'山天大畜','頤':'山雷頤','大過':'澤風大過','坎':'坎為水','離':'離為火','咸':'澤山咸','恆':'雷風恆','遯':'天山遯','大壯':'雷天大壯','晉':'火地晉','明夷':'地火明夷','家人':'風火家人','睽':'火澤睽','蹇':'水山蹇','解':'雷水解','損':'山澤損','益':'風雷益','夬':'澤天夬','姤':'天風姤','萃':'澤地萃','升':'地風升','困':'澤水困','井':'水風井','革':'澤火革','鼎':'火風鼎','震':'震為雷','艮':'艮為山','漸':'風山漸','歸妹':'雷澤歸妹','豐':'雷火豐','旅':'火山旅','巽':'巽為風','兌':'兌為澤','渙':'風水渙','節':'水澤節','中孚':'風澤中孚','小過':'雷山小過','既濟':'水火既濟','未濟':'火水未濟'};
const YAO_NM=['初','二','三','四','五','上'];
const yaoName=(i,yang)=>{const g=yang?'九':'六';return i===0?'初'+g:i===5?'上'+g:g+YAO_NM[i]};
// 卦辭(共用金錢卦資料)
let ZY={},HEX_N={},HEX_N2={};
// 由 "const NAME={" 起,以大括號配對抽出完整物件字面值
function grabObj(src,name){
  const key='const '+name+'={';
  const s=src.indexOf(key); if(s<0)return null;
  let i=s+key.length-1,depth=0,inStr=false,q='';
  for(;i<src.length;i++){const c=src[i];
    if(inStr){if(c===q&&src[i-1]!=='\\')inStr=false;continue}
    if(c==='\''||c==='"'){inStr=true;q=c;continue}
    if(c==='{')depth++;
    else if(c==='}'){depth--;if(depth===0){return src.slice(s+key.length-1,i+1)}}
  }
  return null;
}
fetch('%E9%87%91%E9%8C%A2%E5%8D%A6.html').then(r=>r.text()).then(t=>{
  try{const a=grabObj(t,'ZY');if(a)ZY=eval('('+a+')');}catch(e){}
  try{const b=grabObj(t,'ZD');if(b)window.ZD=eval('('+b+')');}catch(e){}
}).catch(()=>{}).finally(()=>render());
fetch('%E7%BE%85%E7%9B%A4%E4%BA%92%E5%8B%95%E5%8E%9F%E5%9E%8B.html').then(r=>r.text()).then(t=>{
  try{const a=grabObj(t,'HEX_N');if(a)HEX_N=eval('('+a+')');}catch(e){}
  try{const b=grabObj(t,'HEX_N2');if(b)HEX_N2=eval('('+b+')');}catch(e){}

// ── 推命核心 ──
function tuiMing(Y,M,D,h,male){
  const p=fourPillars(Y,M,D,h);
  const pil=[gz(p.year),gz(p.month),gz(p.day),gz(p.hour)];
  // 取數
  let nums=[],detail=[];
  for(const s of pil){
    const a=TG_NUM[s[0]], b=DZ_NUM[s[1]];
    nums.push(a);nums=nums.concat(b);
    detail.push({gz:s,g:a,z:b});
  }
  const tian=nums.filter(n=>n%2===1).reduce((a,b)=>a+b,0);
  const di=nums.filter(n=>n%2===0).reduce((a,b)=>a+b,0);
  // 餘數(天基25、地基30)
  // 「遇十不用,只用零位數」;零位為 0 者取十位(書例:地數三十→只用三數)
  const cut=(n,base)=>{let x=n;while(x>base)x-=base;
    if(x>=10)x=(x%10!==0)?x%10:Math.floor(x/10);return x};
  const redT=n=>cut(n,25), redD=n=>cut(n,30);
  let rt=redT(tian), rd=redD(di);
  // 五數寄宮(元運)
  const yb=p.year%12, yangCmd=[0,2,4,6,8,10].includes(yb); // 子寅辰午申戌=陽命
  const roc=p.sui-1911;
  const yuan=roc<=12?'上元':roc<=72?'中元':'下元';
  const ji=(r)=>{
    if(r!==5)return null;
    if(yuan==='上元')return male?'艮':'坤';
    if(yuan==='下元')return male?'離':'兌';
    // 中元:陽男陰女寄艮、陰男陽女寄坤
    const yangP=(male&&yangCmd)||(!male&&!yangCmd);
    return yangP?'艮':'坤';
  };
  const tGua=ji(rt)||LUOSHU[rt]||'坤', dGua=ji(rd)||LUOSHU[rd]||'坤';
  // 八卦相盪:陽男陰女→天上地下;陰男陽女→天下地上
  const tianShang=(male&&yangCmd)||(!male&&!yangCmd);
  const up=tianShang?tGua:dGua, lo=tianShang?dGua:tGua;
  const xianName=PAIR2N[up+lo];
  const bits=triBits(lo).concat(triBits(up)); // 由下而上六爻
  // 元堂:陽時取陽爻(自子時數起)、陰時取陰爻(自午時數起)
  const hB=p.hB, yangShi=hB<=5;
  const targets=[];
  for(let i=0;i<6;i++)if(bits[i]===(yangShi?1:0))targets.push(i);
  let yuanTang=null,seq=yangShi?hB:hB-6;
  if(targets.length)yuanTang=targets[seq%targets.length];
  // 後天卦:元堂爻變 + 內外卦互換
  let bits2=bits.slice();
  let zunNote='';
  const ZUN=['坎','屯','蹇'];
  let doChange=true;
  if(ZUN.includes(xianName)&&(yuanTang===4||yuanTang===5)){
    // 至尊卦:九五為陽君、上六為陰主;陽令則易、陰令則不易
    const mi=p.mi; // 0=寅月…;冬至在子月(mi=10),夏至在午月(mi=4)
    const lunarM=(mi+2)%12; // 月支index
    const yangLing=(lunarM>=10||lunarM<=3); // 十一月~四月(子丑寅卯辰巳前半)→ 冬至後夏至前
    doChange=yangLing;
    zunNote='本卦為【至尊卦】('+FULLN[xianName]+'),元堂居'+(yuanTang===4?'九五(陽君)':'上六(陰主)')
      +';倪師云至尊至極不可輕變——'+(yangLing?'生於<b>陽令</b>(冬至後至夏至前),則變。':'生於<b>陰令</b>(夏至後至冬至前),<b>則不變</b>。');
  }
  if(yuanTang!==null&&doChange)bits2[yuanTang]=1-bits2[yuanTang];
  const lo2=BIT2TRI[bits2.slice(0,3).join('')], up2=BIT2TRI[bits2.slice(3,6).join('')];
  // 移外卦入內、內卦出外
  const houUp=lo2, houLo=up2;
  const houBits=triBits(houLo).concat(triBits(houUp));
  const houName=PAIR2N[houUp+houLo];
  return{p,pil,detail,nums,tian,di,rt,rd,tGua,dGua,yuan,yangCmd,male,tianShang,
    xianName,bits,yuanTang,yangShi,houName,houBits,zunNote,up,lo,houUp,houLo};
}
// ═══ 六十四卦・本命性格解讀(白話)═══
const MING={
'乾':'天生領袖性格,自尊心強、企圖心旺,不甘居人下;一生自強不息,靠自己打拚出局面。宜主導、忌屈居人下;過剛易折,學會柔軟是一生功課。',
'坤':'天生厚道包容,能忍能容、默默耕耘;適合輔佐、承載、守成。不擅出頭但福澤深厚,愈是配合他人愈得利;忌硬要逞強出頭。',

'蒙':'早年懵懂、需要人引導,一生貴在遇明師。學習力強,開竅之後成就可觀;忌自作聰明、不懂裝懂。',

'小畜':'力量尚小,常有「就差那麼一點」之憾;宜積小成大、耐心蓄積。忌好高騖遠,守住本分反有成。',

'同人':'心胸開闊、擅與人合作,能結交志同道合之友;宜團隊、合夥事業。忌私心偏袒。',

const bitsName=b=>PAIR2N[BIT2TRI[b.slice(3).join('')]+BIT2TRI[b.slice(0,3).join('')]];
const flipYao=(b,i)=>{const c=b.slice();c[i]=1-c[i];return c};
const yingYao=i=>(i+3)%6;                       // 應爻:初應四、二應五、三應上
// 大運:自元堂起,陽爻管九年、陰爻管六年
function daYun(bits,yuanTang,startAge){
  const runs=[];let age=startAge;
  for(let k=0;k<6;k++){
    const i=(yuanTang+k)%6, yrs=bits[i]===1?9:6;
    runs.push({yao:i,from:age,to:age+yrs-1,yang:bits[i]===1,yrs});
    age+=yrs;
  }
  return{runs,total:age-startAge,end:age-1};
}
// 流年小限:每一步大運之內逐年遊變(第1年本卦該爻、第2年應爻、第3年起自該爻遞進)
function xiaoXian(bits,yaoIdx,yrs,isFirstStep){
  const out=[];let cur=isFirstStep?bits.slice():flipYao(bits,yaoIdx);
  out.push({n:1,gua:bitsName(cur),bits:cur.slice(),note:isFirstStep?'元堂起運':'本卦'+YAO_NM[yaoIdx]+'爻變'});
  if(yrs>=2){cur=flipYao(cur,yingYao(yaoIdx));out.push({n:2,gua:bitsName(cur),bits:cur.slice(),note:'應爻('+YAO_NM[yingYao(yaoIdx)]+')變'})}
  for(let n=3;n<=yrs;n++){const i=(yaoIdx+(n-3))%6;cur=flipYao(cur,i);
    out.push({n,gua:bitsName(cur),bits:cur.slice(),note:YAO_NM[i]+'爻變'})}
  return out;
}
// 流月:陽月自年卦元堂再進一爻起,累變六卦;陰月取各陽月所變之應爻
function liuYue(yearBits,yuanTang){
  const yangM=[],idxs=[];let c=yearBits.slice();
  for(let k=0;k<6;k++){const i=(yuanTang+1+k)%6;c=flipYao(c,i);
    yangM.push({gua:bitsName(c),bits:c.slice()});idxs.push(i)}
  const yinM=yangM.map((_,k)=>{let b=yearBits.slice();
    for(let j=0;j<=k;j++)b=flipYao(b,idxs[j]);
    const y=flipYao(b,yingYao(idxs[k]));return{gua:bitsName(y),bits:y}});
  const res=[];
  for(let k=0;k<6;k++){res.push({m:k*2+1,...yangM[k]});res.push({m:k*2+2,...yinM[k]})}
  return res.sort((a,b)=>a.m-b.m);
}
// 互卦:二三四為內互、三四五為外互,上外下內合互
function huGua(bits){

  return{nei,wai,he:PAIR2N[wai+nei]};
}

  const dy2=daYun(r.houBits,houYuan,dy1.end+1);
  o+='<h2>六、起大運(先天'+dy1.total+'年・後天'+dy2.total+'年)</h2>'
   +'<div class="note" style="margin-top:0">從元堂那一爻起算一歲,一爻管一段:<b>陽爻(實線)管九年、陰爻(斷線)管六年</b>,依序往上走完六爻;先天卦走完接後天卦。<b>金色那一列就是你現在所走的大運。</b></div>'
   +'<table><tr><th>卦</th><th>爻</th><th>陰陽</th><th>歲運</th></tr>'
   +dy1.runs.map(x=>'<tr'+(nowAge>=x.from&&nowAge<=x.to?' style="background:rgba(201,169,106,.25);font-weight:700"':'')+'>'
     +'<td>先天'+FULLN[r.xianName]+'</td><td>'+yaoName(x.yao,r.bits[x.yao]===1)+'</td><td>'+(x.yang?'陽・九年':'陰・六年')+'</td><td>'+x.from+'—'+x.to+'歲</td></tr>').join('')
   +dy2.runs.map(x=>'<tr'+(nowAge>=x.from&&nowAge<=x.to?' style="background:rgba(201,169,106,.25);font-weight:700"':'')+'>'
     +'<td>後天'+FULLN[r.houName]+'</td><td>'+yaoName(x.yao,r.houBits[x.yao]===1)+'</td><td>'+(x.yang?'陽・九年':'陰・六年')+'</td><td>'+x.from+'—'+x.to+'歲</td></tr>').join('')
   +'</table>';
  // ═══ 流年小限 ═══
  const allRuns=dy1.runs.map((x,i)=>({...x,bits:r.bits,first:i===0})).concat(dy2.runs.map(x=>({...x,bits:r.houBits,first:false})));
  const curRun=allRuns.find(x=>nowAge>=x.from&&nowAge<=x.to);
  if(curRun){
    const xx=xiaoXian(curRun.bits,curRun.yao,curRun.yrs,curRun.first);
    o+='<h2>七、流年小限(現行大限 '+curRun.from+'—'+curRun.to+'歲)</h2>'
     +'<div class="note" style="margin-top:0">在同一段大運裡,每一年都會再變出一個「年卦」——這就是那一年的運勢。金色列是今年。<br><span style="opacity:.75">推法:首年取本卦該爻、次年取應爻、第三年起自該爻逐年遞進;陽爻遇陽年不變、遇陰年則變,陰爻則陰陽年皆變。</span></div>'
     +'<table><tr><th>虛歲</th><th>西元</th><th>年卦</th><th>該年運勢</th></tr>'
     +xx.map(x=>{const ag=curRun.from+x.n-1,yr=Y+ag-1;const z4=ZD[x.gua];
       const lv=z4?(z4.slice(0,4).filter(v=>v==='吉').length-z4.slice(0,4).filter(v=>v==='慎').length):0;
       return '<tr'+(ag===nowAge?' style="background:rgba(201,169,106,.25);font-weight:700"':'')+'>'
       +'<td>'+ag+'</td><td>'+yr+'</td><td><b>'+FULLN[x.gua]+'</b></td>'
       +'<td style="text-align:left;font-size:12px">'+(z4?'<b style="color:'+(lv>0?'var(--green)':lv<0?'var(--red)':'var(--gold)')+'">'+(lv>0?'順':lv<0?'慎':'平')+'</b>・'+z4[4]:x.note)+'</td></tr>'}).join('')
     +'</table>';
    // 本年白話解
    const nowY=xx.find(x=>curRun.from+x.n-1===nowAge);
    if(nowY&&ZD[nowY.gua]){
      o+='<div class="hl" style="font-size:14px;line-height:1.9"><b>今年('+(Y+nowAge-1)+'・虛歲'+nowAge+')走「'+FULLN[nowY.gua]+'」:</b>'
       +(MING[nowY.gua]||'').replace(/^天生|^一生|^早年/,'今年')+'<br>'
       +'<b>四項提示:</b>'+['財運','感情','事業','健康'].map((t,i)=>t+sym[ZD[nowY.gua][i]]+ZD[nowY.gua][i]).join('　')+'</div>';
    }
    // ═══ 流月 ═══
    const thisYear=xx.find(x=>curRun.from+x.n-1===nowAge)||xx[0];
    const lm=liuYue(thisYear.bits,curRun.yao);
    const MN=['正','二','三','四','五','六','七','八','九','十','十一','十二'];
    o+='<h2>八、'+(Y+nowAge-1)+'年流月卦(年卦 '+FULLN[thisYear.gua]+')</h2>'
     +'<div class="note" style="margin-top:0">今年十二個月各有一卦,可看該月宜靜宜動。<b>月份以節氣分界</b>(如三月從清明起算),不是從初一。<br><span style="opacity:.7">訣曰「陽世還從子月起,陰世即於五月生;欲知月卦真端的,從初數至世方分」——先排單月自年卦元堂再進一爻累變,再取各單月之應爻變為雙月。</span></div>'
     +'<table><tr><th>月</th><th>卦</th><th>月</th><th>卦</th></tr>'
     +[0,1,2,3,4,5].map(i=>'<tr><td>'+MN[i*2]+'月</td><td><b>'+FULLN[lm[i*2].gua]+'</b></td>'
       +'<td>'+MN[i*2+1]+'月</td><td><b>'+FULLN[lm[i*2+1].gua]+'</b></td></tr>').join('')
     +'</table>'
     +'<div class="note">流日卦:自月卦元堂再進一爻起,<b>每爻管一日、每卦管六日</b>,逐爻遞進;起算日以該月之「節」為始(如三月自清明起)。</div>';
  }
  // ═══ 互卦 ═══
  const hg1=huGua(r.bits),hg2=huGua(r.houBits);
  o+='<h2>九、互卦(鐵版神數推六親之要)</h2>'
   +'<div class="note" style="margin-top:0">互卦是<b>藏在卦裡面的卦</b>——代表事情的內情、隱藏的變化與六親(父母兄弟子女)的狀況,是表面看不到的那一層。倪師云:互卦在鐵版數中很重要,尤其推算六親關係時其數不可忽略。<br><span style="opacity:.7">取法:去掉最下與最上兩爻,二三四爻為內互、三四五爻為外互,上外下內相疊即合互。</span></div>'
   +'<div class="row2"><span>先天卦 '+FULLN[r.xianName]+'</span><b>內互'+hg1.nei+'・外互'+hg1.wai+' → 合互 <span style="color:var(--gold)">'+FULLN[hg1.he]+'</span></b></div>'
   +'<div class="row2"><span>後天卦 '+FULLN[r.houName]+'</span><b>內互'+hg2.nei+'・外互'+hg2.wai+' → 合互 <span style="color:var(--gold)">'+FULLN[hg2.he]+'</span></b></div>'
   +(ZY[hg1.he]?'<div class="yw" style="font-size:13.5px">合互'+hg1.he+':'+ZY[hg1.he].g+'</div>':'');
  o+='<div class="note" style="margin-top:8px">依《天紀・天機道》「易經推命」法推算(天干佈洛書、地支佈河圖、單雙數分取天地、洛書起卦、八卦相盪、元堂變後天)。書中例題:己酉/戊辰/戊寅/甲寅 → 天數三十一得乾、地數三十六得乾,本程式驗算完全相符。<br>大運、流年小限、流月、流日、互卦之推法均依書中例題(風水渙大運 1-9/10-15/16-21/22-30/31-39/40-45 共四十五年、小限渙蒙剝艮旅遯咸革夬、流月屯比坎井大過恆、合互山雷頤)逐項驗算相符。論命仍宜合參斗數、八字與陽宅。</div>';
  document.getElementById('out').innerHTML=o;
  window.fscP&&window.fscP('yijing','tuiming',r.xianName+'之'+r.houName);
}
</script></body></html>
