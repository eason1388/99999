  /* ══════ 以下為各模組實務課程。body 為課文,paid:true 者需解碼。

  {
   "level": "金鎖玉關・過路陰陽",
   "items": [
    {"title":"這一派在談什麼","summary":"不論坐向、不論元運,只看四周的高低虛實直斷吉凶。","paid":false,
     "body":"<p>金鎖玉關又稱<b>過路陰陽</b>,意思是「走過路過,一看就能斷」。它與玄空飛星最大的不同在於:<b>飛星論理氣</b>,要先知道坐向與元運才排得出盤;<b>金鎖玉關論形巒</b>,不必問坐向、不必問建屋年份,只要站在屋中心環顧四周,看哪個方位高、哪個方位低,就能直接下判語。</p><p>正因為不涉時間變數,它的斷語相對穩定——房子蓋好後周遭地形不變,判斷就不變。這也是它適合當<b>第二把尺</b>的原因:飛星說吉、金鎖玉關也說吉,你下判斷才踏實。</p><p>本門把兩套並列使用,不是折衷,而是<b>互相印證</b>。兩派同斷為凶的方位,是最不必猶豫該先動的地方。</p>"},
    {"title":"總訣:一二三四宜砂、六七八九宜水","summary":"洛書數決定該方要高還是要低,這是全套法的根。","paid":false,
     "body":"<p>後天八卦配洛書數,二十四山分屬八宮:</p><ul><li><b>宜砂(要高、要實)</b>:坎<b>1</b>正北、坤<b>2</b>西南、震<b>3</b>正東、巽<b>4</b>東南</li><li><b>宜水(要低、要通)</b>:乾<b>6</b>西北、兌<b>7</b>正西、艮<b>8</b>東北、離<b>9</b>正南</li></ul><p>合乎者稱<b>合訣</b>,主吉;相反者稱<b>違訣</b>,主凶。中五不入用。</p><p>這條總訣不是背來的,可用經文本身互相驗證:經云「壬水沒兒郎」——壬在坎宮,見水為凶;又云「壬砂發武貴」——同一個壬山,見砂為吉。一凶一吉對照,坎宮宜砂便自然成立。其餘各宮同理。</p>"},
    {"title":"什麼算砂、什麼算水","summary":"都市裡沒有山也沒有河,判準要換算成現代地物。","paid":false,
     "body":"<p>砂水講的是<b>相對高低與虛實</b>,不是字面的山與河。</p><p><b>屬砂(高、實、擋)</b>:山丘、樓房、圍牆、大樹、電線桿、水塔、高櫃、實心隔間。</p><p><b>屬水(低、虛、通)</b>:水塘、河道、道路、空地、停車場、廣場、門、窗、低地、通道。</p><p><b>屬平</b>:與立極點大致齊平、無明顯遮擋亦無明顯開闊者。判不出來就記「平」,不要硬套——<b>寧可留白,不要誤判</b>,因為一個誤判會連帶把後面的化解順序全排錯。</p><p>室內外要分層看:先看屋外大環境定基調,再看室內格局。兩者衝突時以屋外為主,室內為輔。</p>"},
    {"title":"立極:太極點怎麼定","summary":"起點錯,二十四山全錯。定中心的三種情況與取捨。","paid":true,
     "body":"<p>金鎖玉關的一切判斷都是<b>從立極點向外看</b>,立極點定錯,整盤作廢。</p><p><b>方正格局</b>:取幾何中心,即兩對角線交點。</p><p><b>缺角格局</b>:先把缺角補成完整矩形,取補全後的中心;若缺角超過該邊三分之一,則視為兩個獨立區塊分別立極,不可強行取一個中心。</p><p><b>樓中樓或複式</b>:各層分別立極,不可混用。樓下的砂水管樓下,樓上的管樓上。</p><p><b>店面與住家共構</b>:營業區與居住區分開立極。營業區斷財,居住區斷人丁,兩者判語不可互相套用。</p><p>實務上最常見的錯誤,是把「客廳中心」當成「全宅中心」。客廳只是一個房間,全宅立極必須含所有室內樓地板面積,陽台是否計入依其是否封閉而定——封閉計入,開放不計。</p>"},
    {"title":"二十四山應人應病","summary":"每一山對應哪一房、哪個人、哪個臟腑,這是斷得準的關鍵。","paid":true,
     "body":"<p>合訣違訣只告訴你吉凶,<b>應在誰身上</b>要看宮位六親:</p><ul><li><b>坎</b>(壬子癸)中男・二房——腎、膀胱、泌尿、耳、血液</li><li><b>艮</b>(丑艮寅)少男・三房——脾胃、手、背、鼻、關節</li><li><b>震</b>(甲卯乙)長男・長房——肝膽、足、筋、神經</li><li><b>巽</b>(辰巽巳)長女・長媳——氣管、股、風疾、毛髮</li><li><b>離</b>(丙午丁)中女——心、眼目、血液循環、小腸</li><li><b>坤</b>(未坤申)老母・主婦——腹、脾胃、皮膚</li><li><b>兌</b>(庚酉辛)少女・幼口——肺、咽喉、口齒</li><li><b>乾</b>(戌乾亥)老父・家長——頭、肺、骨、大腸</li></ul><p>斷語要落到人身上才有說服力。客戶說「西北有面高牆」,你回「乾宮違訣」他沒有感覺;你回「家中長輩是不是頭痛、筋骨痠痛,或者這幾年身體走下坡」,他才會坐直身子。</p><p>同一宮三山之中,<b>天干山</b>(壬癸甲乙丙丁庚辛)應驗較顯較快;<b>地支山</b>應人事;<b>四維</b>(乾坤艮巽)力量最大,主全局。</p>"},
    {"title":"違訣的化解次第","summary":"補砂與見水的具體做法,以及先動哪一處。","paid":true,
     "body":"<p><b>宜砂而見水(該高卻低)——補砂</b>:於該方設實牆、高櫃、書櫃、山石盆景或高大植栽填實;色用黃褐土色、材質厚重;忌開大窗、忌留空、忌設魚缸水景。</p><p><b>宜水而見砂(該低卻高)——見水</b>:於該方開窗採光、留出通道動線;可設水景、明鏡、淺色透亮之物;忌高櫃遮擋、忌堆置重物雜物。</p><p><b>次第</b>:不是照方位順序做,而是照<b>傷得多重</b>做。順序為——傷家長(乾)、傷主婦(坤)、傷人丁(坎)、其餘依實際應驗急迫度。系統排出來的優先順序就是照這個邏輯。</p><p><b>一次只動一處。</b>做完觀察一到三個月再動下一處。同時動三四處,事後應驗了你不知道是哪一處起的作用,下次就無從累積經驗。這是本門對徒弟最基本的要求。</p>"},
    {"title":"與玄空飛星互參","summary":"兩派結論的四種組合,各自代表什麼、該怎麼處理。","paid":true,
     "body":"<p>同一個方位,金鎖玉關(形巒)與飛星八宅(理氣)各自表態,共四種組合:</p><p><b>一、兩派同凶——最優先。</b>形巒理氣一致,應驗機率最高,不必再猶豫,列為第一順位處理。</p><p><b>二、兩派同吉——雙重吉。</b>主臥、神位、財位、辦公座向優先取此宮。這是全宅最該善用的地方,很多師傅只忙著化煞,忘了把好方位用起來。</p><p><b>三、一派報凶。</b>中度留意。先化解、再觀察,不必大動干戈。</p><p><b>四、兩派結論相反——需現場複核。</b>這是最有價值的訊號。經驗上,絕大多數情況不是兩派衝突,而是<b>砂水判得不夠準</b>——可能把半高的矮牆算成砂、把封閉陽台算成水。回現場重看該方的高低虛實,通常一看就明白。</p><p>把第四種當成「工具出錯」而略過,是初學者最容易犯的錯。它其實在提醒你回去補功課。</p>"},
    {"title":"常見誤判與現場陷阱","summary":"新手最容易踩的六個坑。","paid":true,
     "body":"<p><b>一、拿指北針當羅盤。</b>手機指北針受鋼筋與電器干擾極大,室內誤差常達十幾度,足以跨山。務必多點量測取一致值。</p><p><b>二、以客廳中心當全宅中心。</b>立極必須含全部室內面積。</p><p><b>三、把「遠處的高樓」算成砂。</b>距離愈遠影響愈小。判準是仰角——需明顯抬頭才看得到頂,才算得上砂。</p><p><b>四、忽略地勢落差。</b>房子蓋在坡上,低的那一側本身就是水,不必等到有水池。</p><p><b>五、砂水判完就下重話。</b>金鎖玉關斷語直接,但那是「傾向」不是「必然」。對客戶說話要留餘地,尤其涉及疾病與人丁,不可恫嚇。</p><p><b>六、忘了記錄。</b>當下不記,回去就忘了哪一方是砂哪一方是水。用現場勘查module逐項存檔,連照片一起,日後複盤才有依據。</p>"}
   ]

  {
   "level": "現場勘查實務",
   "items": [
    {"title":"為什麼要逐項紀錄","summary":"憑記憶做風水,做到第三戶就開始混淆。","paid":false,
     "body":"<p>一場勘察下來,你要同時處理坐向、元運、飛星盤、八宅、砂水、屋主八字、客戶的問題與情緒。人的工作記憶撐不住這麼多線。</p><p>逐項紀錄解決三件事:<b>當下不漏</b>——十項清單走一遍,不會忘了看神位;<b>事後可查</b>——三個月後客戶打來問「你那時說廁所怎樣」,你調得出來;<b>能夠復盤</b>——一年後應驗了,你回頭看當初的判斷對在哪、錯在哪,功力才會累積。</p><p>沒有紀錄的經驗不叫經驗,叫印象。</p>"},
    {"title":"十項的順序與意義","summary":"為什麼是這十項,以及為什麼大門排第一。","paid":false,
     "body":"<p>本門定的十項依序為:<b>大門、爐灶、主臥床位、神位、廁所、樓梯、來去水、書桌、財位、明堂外局</b>。</p><p>順序不是隨意排的,而是依<b>影響全家的程度</b>:大門是全宅唯一的總納氣口,一動全動;爐灶主一家飲食健康與財庫;床位主人丁與睡眠品質;神位主家運與長輩心安。這四項先看完,全宅八成的問題就浮出來了。</p><p>後六項是修正與細節。時間不夠時,寧可前四項看仔細,不要十項都看得潦草。</p>"},
    {"title":"大門與明堂","summary":"納氣口的判讀:向星、形煞、門前三尺。","paid":true,
     "body":"<p>大門以<b>向星</b>為主論財氣。向星當旺或進氣,主財路通暢;向星為二黑五黃,則氣口帶病,首要處理。</p><p><b>門外三尺定生死。</b>開門見到什麼,比門的方位更立即:正對電梯口(氣沖)、正對樓梯下行(洩)、正對他家門(門刀)、門前堆雜物(氣滯)、門檻破損(根基不穩)。這些不必排盤就該記下來並拍照。</p><p><b>形煞要量化。</b>「有路沖」不夠,要記路寬幾米、距離幾米、是否正對。距離愈近、正對愈準、路愈寬,煞氣愈重。寫進報告時附照片,客戶才不會覺得你在講玄的。</p><p><b>明堂</b>指門前的開闊空間。宜平整開闊、宜聚不宜散;忌逼仄、忌傾瀉、忌雜亂。明堂好的房子,即使盤局普通也不至於太差。</p>"},
    {"title":"爐灶:坐煞向吉","summary":"灶位與火門方向要分開看,這是最多人搞混的一項。","paid":true,
     "body":"<p>爐灶要分兩件事看,很多人混為一談:</p><p><b>灶位(爐子所在的方位)——宜坐凶方。</b>以火制煞,壓住衰死或凶星之方。所以爐灶落在旺方反而不好,主旺氣被壓、損財氣。這是判讀反轉的項目之一。</p><p><b>火門(瓦斯爐開關面向,即操作者站立時面對的方向)——宜朝吉方。</b>納吉氣入灶。</p><p><b>另須記錄的忌:</b>灶背後為廁所牆(污穢入食)、灶背後為臥床(火氣沖床)、灶上方有橫樑(樑壓灶)、灶正對水槽或冰箱(水火相沖,三十公分內尤忌)、灶位在陽台外推處(無根基)。</p><p>現場拍照時,務必連同灶的背後那面牆一起拍——那面牆後面是什麼,常常才是問題所在。</p>"},
    {"title":"床位與神位","summary":"兩者都以山星論,但講究各不相同。","paid":true,
     "body":"<p><b>床位</b>以<b>山星</b>論人丁與健康,床頭方位為主。山星當旺主體健安穩;山星二黑五黃主疾病纏身,能移則移,不能移則以金洩土。</p><p>床的形巒要點:床頭必須<b>靠實牆</b>(有靠山),忌靠窗、忌靠廁所牆、忌床頭上方有橫樑或吊櫃;忌正對房門(門沖)、忌正對廁所門、忌鏡子照床。</p><p><b>神位</b>同樣看山星,但講究更嚴:背後必須是<b>實牆且牆後不可為廁所、樓梯、廚房、臥床、水路</b>;忌樑壓、忌污穢、忌與臥室同牆、忌在動線上被人穿越。</p><p>神位若與床位、廁所形成上下樓對應關係(樓上是廁所、樓下是神位),也屬大忌,現場要主動問樓上樓下的格局。</p>"},
    {"title":"廁所與樓梯:判讀反轉","summary":"這兩項落在凶方才是好的,搞反了會給錯建議。","paid":true,
     "body":"<p>廁所、樓梯與灶位這三項,<b>吉凶判讀與其他項目相反</b>:</p><p><b>廁所宜居衰死方</b>——以污穢壓制凶氣,是化煞。若廁所壓在當旺向星或財位上,主<b>漏財</b>,而且是持續性的耗損,不是一次性破財。</p><p><b>樓梯動氣強</b>,居凶方可洩煞;居旺方則旺氣被踩踏帶走,聚財不易。另須記錄:樓梯是否正對大門(財氣直洩)、是否穿心(位於全宅中心,傷全家)。</p><p>這一點在系統裡已經處理好——同一個方位,你標「大門」會判吉,標「廁所」會判凶,不是程式錯亂,是本來就該相反。理解這層,你在現場才不會被自己的直覺誤導。</p>"},
    {"title":"拍照存證:拍什麼、怎麼拍","summary":"照片是報告的說服力來源,也是你日後的保險。","paid":true,
     "body":"<p><b>每一項至少一張。</b>拍的時候站在該處<b>往外拍</b>,而不是拍那個物件本身——重點是那個位置看出去的環境。</p><p><b>形煞務必拍。</b>路沖、壁刀、天斬、電桿、高壓塔、廟宇、墳場、反弓路。客戶自己每天住在裡面反而看不見,照片一擺出來就懂了。</p><p><b>拍背後。</b>灶背、神位背、床頭背——這三面牆後面是什麼,常是問題根源,但事後回想都想不起來。</p><p><b>連方位一起記。</b>照片本身不會告訴你這是哪一方,一定要在系統裡同時選好方位再拍。</p><p><b>照片只存在這台裝置</b>,不會上傳。清除瀏覽器資料就會消失,所以每次勘察完務必到案件簿匯出完整備份(含照片)並存到雲端。這一步不要省。</p>"},
    {"title":"從勘查到交付","summary":"一案到底的完整動線,以及交付書怎麼組。","paid":true,
     "body":"<p>本門的標準動線是<b>一案到底</b>——資料只輸入一次,全站共用:</p><ol><li><b>客戶案件簿</b>建案:姓名、地址、坐山、元運、屋主生辰。</li><li><b>設為目前案件</b>。之後任何module都會自動帶入,不必重複輸入。</li><li><b>羅盤</b>現場測向,確認坐山無誤。</li><li><b>現場勘查</b>十項逐點走完,拍照、下判定、寫備註。</li><li><b>金鎖玉關</b>二十四山點砂水,同時看兩派互參。</li><li><b>擇日</b>排出施作吉日。</li><li><b>整合報告</b>一鍵彙整,列印即 A4 交付書。</li></ol><p>整合報告會自動把三個來源的問題合併排序並去重:兩派同凶排最前,單派報凶次之,現場實見的形煞再次。同一個宮位若在兩處都出現,只列一次,不會重複。</p><p>交付前務必自己讀一遍。系統排的是<b>依據</b>,不是<b>判斷</b>——最後下筆的人是你。</p>"}
   ]
  }
 ]
};
const pop=document.getElementById('pop');
const byTerm=Object.fromEntries(DATA.glossary.map(g=>[g.term,g]));
// bigram TF-IDF(與 fsc_ai LocalRetriever 同式)
const docs=DATA.glossary.map(g=>g.term+g.definition).concat(
  DATA.lessons.flatMap(l=>l.items.map(i=>i.title+i.summary)));
const meta=DATA.glossary.map(g=>({kind:'詞條',title:g.term,text:g.definition,src:g.source_ref,g}))
 .concat(DATA.lessons.flatMap(l=>l.items.map(i=>({kind:l.level+'課程',title:i.title,text:i.summary,src:'教學中心'}))));
const grams=s=>{const t=s.replace(/\s/g,''),o={};for(let i=0;i+1<t.length;i++){const g=t.slice(i,i+2);o[g]=(o[g]||0)+1}return o};
const idx=docs.map(grams),df={};
idx.forEach(d=>Object.keys(d).forEach(g=>df[g]=(df[g]||0)+1));
function search(q,k=6){const qg=grams(q),n=docs.length,out=[];
  idx.forEach((d,i)=>{let s=0;for(const g in qg){if(d[g])s+=qg[g]*d[g]*Math.log(n/(df[g]||1)+1)}
    if(s>0&&q.includes(meta[i].title))s+=100; // 標題精確命中加權
    if(s>0)out.push([s,i])});
  out.sort((a,b)=>b[0]-a[0]);return out.slice(0,k).map(([s,i])=>meta[i])}
function showTerm(t){const g=byTerm[t];if(!g)return;
  document.getElementById('pTitle').textContent=g.term;
  document.getElementById('pDef').textContent=g.definition;
  document.getElementById('pSrc').textContent='出處:'+g.source_ref;
  document.getElementById('pRel').innerHTML='相關:'+g.related.map(r=>'<span onclick="showTerm(\''+r+'\')">'+r+'</span>').join('');
  pop.classList.add('show')}
document.getElementById('search').oninput=e=>{
  const q=e.target.value.trim(),R=document.getElementById('results');
  if(q.length<2){R.innerHTML='';return}
  R.innerHTML=search(q).map(m=>'<div class="hit" onclick="'+(m.g?'showTerm(\''+m.title+'\')':'')+'"><b>'+m.title+'</b> <span style="font-size:11px;opacity:.5">'+m.kind+'</span><br><span style="font-size:13px">'+m.text.slice(0,60)+'…</span><div class="src">'+m.src+'</div></div>').join('')||'<div class="hit">查無結果——問 AI 顧問(V2 接入)</div>'}
// 學習路徑
const path=document.getElementById('path');
DATA.lessons.forEach((lv,li)=>{
  const d=document.createElement('div');d.className='lvl';
  d.innerHTML='<b>'+lv.level+'('+lv.items.length+' 課)'+(li===0?' — 建議從這裡開始':'')+'</b>';
  const wrap=document.createElement('div');wrap.style.display=li===0?'block':'none';
  lv.items.forEach((it,k)=>{const l=document.createElement('div');l.className='lesson';
    const tag = it.body ? (it.paid?'<span class="ltag paid">深解</span>':'<span class="ltag free">免費</span>') : '';
    l.innerHTML='<span class="prog">'+ (k+1) +'</span> '+linkTerms(it.title)+tag+
                '<div class="sum">'+linkTerms(it.summary)+'</div>';
    if(it.body){
      const b=document.createElement('div'); b.className='lbody';
      /* 免費課直接出;深解課走共用付費鎖,未解碼者顯示模糊預覽 */
      b.innerHTML = it.paid && window.BPSY && !BPSY.ok()
        ? BPSY.gate(it.body, it.title, '本課為抱朴隨緣堂現場心法')
        : it.body;
      l.appendChild(b);
    }
    l.onclick=e=>{
      if(e.target.classList.contains('term'))return;
      if(e.target.closest('.lbody'))return;      // 點課文內部不要收合
      l.classList.toggle('open');
    };
    wrap.appendChild(l)});
  d.querySelector('b').onclick=()=>wrap.style.display=wrap.style.display==='none'?'block':'none';
  d.appendChild(wrap);path.appendChild(d)});
// 名詞自動高亮
function linkTerms(s){let out=s;
  for(const t of Object.keys(byTerm).sort((a,b)=>b.length-a.length))
    out=out.split(t).join(''+t+'');
  return out.replace(//g,'<span class="term" onclick="showTerm(this.textContent)">').replace(//g,'</span>')}
// 名詞庫瀏覽
document.getElementById('glossaryList').innerHTML=DATA.glossary.map(g=>
 '<div class="lesson" onclick="showTerm(\''+g.term+'\')"><b style="font-family:\'Noto Serif TC\',serif">'+g.term+'</b> <span style="font-size:12px;opacity:.6">'+g.definition.slice(0,28)+'…</span></div>').join('');
</script></body></html>
