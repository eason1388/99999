<script>
const ST='甲乙丙丁戊己庚辛壬癸',BR='子丑寅卯辰巳午未申酉戌亥';
const WX='木木火火土土金金水水',WXC={'木':'#4A6B4F','火':'#A63A2E','土':'#8C6D3F','金':'#948e82','水':'#3E5C76'};
const M24='壬子癸丑艮寅甲卯乙辰巽巳丙午丁未坤申庚酉辛戌乾亥';
const TEN=['比肩','劫財','食神','傷官','偏財','正財','七殺','正官','偏印','正印'];
const HID={'子':[['癸',1]],'丑':[['己',.6],['癸',.3],['辛',.1]],'寅':[['甲',.6],['丙',.3],['戊',.1]],'卯':[['乙',1]],
'辰':[['戊',.6],['乙',.3],['癸',.1]],'巳':[['丙',.6],['庚',.3],['戊',.1]],'午':[['丁',.7],['己',.3]],
'未':[['己',.6],['丁',.3],['乙',.1]],'申':[['庚',.6],['壬',.3],['戊',.1]],'酉':[['辛',1]],
'戌':[['戊',.6],['辛',.3],['丁',.1]],'亥':[['壬',.7],['甲',.3]]};
// 曆法(與 7.5 原型同式)
const jdn=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045};
const deltaT=y=>y>=2005?62.92+.32217*(y-2000)+.005589*(y-2000)**2:y>=1986?63.86+.3345*(y-2000)-.060374*(y-2000)**2:70;
function sunLon(jd,y){const t=(jd+deltaT(y)/86400-2451545)/36525;
  const L=280.46646+36000.76983*t,M=(357.52911+35999.05029*t)*Math.PI/180;
  const C=(1.914602-.004817*t)*Math.sin(M)+(.019993-.000101*t)*Math.sin(2*M)+.000289*Math.sin(3*M);
  const O=(125.04-1934.136*t)*Math.PI/180;
  return (((L+C-.00569-.00478*Math.sin(O))%360)+360)%360}
function termJdn(y,target){let jd=jdn(y,3,21)+((target%360)+360)%360/360*365.2422;
  for(let i=0;i<6;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  if(jd>=jdn(y+1,1,1)-0.5)jd-=365.2422; // 年份錨定:立春等歲首節氣會誤收斂到隔年,拉回本年
  if(jd<jdn(y,1,1)-0.5)jd+=365.2422;
  for(let i=0;i<3;i++){let d=target-sunLon(jd,y);while(d>180)d-=360;while(d<-180)d+=360;jd+=d*365.2422/360}
  return jd}
const gzi=(s,b)=>((6*s-5*b)%60+60)%60, gz=i=>ST[i%10]+BR[i%12];
// ── 真太陽時:均時差(NOAA 公式,誤差 <0.1 分)+ 經度時差 ──
function eqTime(Y,M,D,h){
  const N=jdn(Y,M,D)-jdn(Y,1,1);                       // 年內日序(0起)
  const g=2*Math.PI/365*(N+(h-12)/24);
  return 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)
        -0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)); // 分鐘
}
function trueSolar(Y,M,D,h,lon){
  const eot=eqTime(Y,M,D,h);
  const lonMin=4*(lon-120);            // 每度 4 分鐘(+8 時區標準經線 120°E)
  return{h:h+(lonMin+eot)/60, eot, lonMin, total:lonMin+eot};
}
function fourPillars(Y,M,D,h,hT){
  if(hT===undefined)hT=h;
  const J=jdn(Y,M,D)+(h-12)/24-8/24; // 當地(+8)→UTC:節氣判界須用世界時(用鐘錶時)
  let civ=jdn(Y,M,D); if(hT>=23)civ+=1; else if(hT<0)civ-=1;
  const day=((civ-11)%60+60)%60;
  const lc=termJdn(Y,315);
  const sui=(J>=lc)?Y:Y-1;
  const year=((sui-1984)%60+60)%60;
  const lon=sunLon(J,Y);
  const mi=Math.floor(((lon-315)%360+360)%360/30);
  const mB=(mi+2)%12, mS=((year%10)%5*2+2+mi)%10;
  const hn=((hT%24)+24)%24;
  const hB=Math.floor((hn+1)/2)%12, hS=((day%10)%5*2+hB)%10;
  return {year,month:gzi(mS,mB),day,hour:gzi(hS,hB),sui,mi,J}
}
const tenGod=(d,o)=>{const rel=((('木火土金水'.indexOf(WX[o]))-('木火土金水'.indexOf(WX[d])))%5+5)%5;
  return TEN[rel*2+((d%2)===(o%2)?0:1)]};
function strength(p){
  const pts={'木':0,'火':0,'土':0,'金':0,'水':0};
  const sw={year:6,month:6,hour:6},bw={year:8,month:30,day:12,hour:8};
  for(const[k,i]of Object.entries({year:p.year,month:p.month,day:p.day,hour:p.hour})){
    if(k!=='day')pts[WX[i%10]]+=sw[k]||0;
    for(const[hs,w]of HID[BR[i%12]])pts[WX[ST.indexOf(hs)]]+=bw[k]*w}
  const dm=WX[p.day%10],order='木火土金水';
  const mom=order[(order.indexOf(dm)+4)%5];
  const tot=Object.values(pts).reduce((a,b)=>a+b);
  const ratio=(pts[dm]+pts[mom])/tot;
  const verdict=ratio>0.55?'身強':ratio<0.45?'身弱':'中和';
  const di=order.indexOf(dm);
  const favor=verdict==='身弱'?[mom,dm]:verdict==='身強'?[order[(di+1)%5],order[(di+2)%5],order[(di+3)%5]]:[];
  return{pts,ratio,verdict,favor,dm}}

const FLY=['中','乾','兌','艮','離','坎','坤','震','巽'];
const PAL_M={'坎':'壬子癸','艮':'丑艮寅','震':'甲卯乙','巽':'辰巽巳','離':'丙午丁','坤':'未坤申','兌':'庚酉辛','乾':'戌乾亥'};
const NUM2PAL={1:'坎',2:'坤',3:'震',4:'巽',6:'乾',7:'兌',8:'艮',9:'離'};
const PAL2NUM=Object.fromEntries(Object.entries(NUM2PAL).map(([k,v])=>[v,+k]));
const YANG=new Set('乾坤艮巽甲庚壬丙寅申巳亥');
const TI={};'子癸甲申'.split('').forEach(m=>TI[m]=1);'壬卯乙未坤'.split('').forEach(m=>TI[m]=2);
'乾亥辰巽巳戌'.split('').forEach(m=>TI[m]=6);'酉辛丑艮丙'.split('').forEach(m=>TI[m]=7);'寅午庚丁'.split('').forEach(m=>TI[m]=9);
const palaceOf=m=>Object.keys(PAL_M).find(p=>PAL_M[p].includes(m));
function fly(c,fw){const o={};let s=c;for(const p of FLY){o[p]=s;s=fw?s%9+1:(s-2+9)%9+1}return o}
function xkChart(period,sitting,ti=false){
  const facing=M24[(M24.indexOf(sitting)+12)%24];
  const base=fly(period,true);
  const sp=palaceOf(sitting),fp=palaceOf(facing);
  const kind=PAL_M[sp].indexOf(sitting);
  const sc=(pal,refIfFive)=>{
    const s=base[pal];
    if(s===5)return fly(5,YANG.has(refIfFive));
    const ref=PAL_M[NUM2PAL[s]][kind];
    return fly(ti?TI[ref]:s,YANG.has(ref));
  };
  const mt=sc(sp,sitting),fc=sc(fp,facing);
  const n=period;
  const pattern=mt[sp]===n&&fc[fp]===n?'旺山旺向':mt[fp]===n&&fc[sp]===n?'上山下水':
    mt[fp]===n&&fc[fp]===n?'雙星會向':mt[sp]===n&&fc[sp]===n?'雙星會坐':'其他';
  const tri=[[1,4,7],[2,5,8],[3,6,9]];
  const fm=FLY.every(q=>tri.some(t=>{const st=new Set([mt[q],fc[q],base[q]]);return st.size===3&&t.every(x=>st.has(x))}));
  const lz=!fm&&FLY.every(q=>{const v=[mt[q],fc[q],base[q]].sort((a,b)=>a-b);
    const ok=x=>{const s=[(x-1)%9+1,x%9+1,(x+1)%9+1].sort((a,b)=>a-b);return s.join()===v.join()};
    return [...Array(9)].some((_,i)=>ok(i+1))});
  const ADJ={'坎':['乾','艮'],'艮':['坎','震'],'震':['艮','巽'],'巽':['震','離'],'離':['巽','坤'],'坤':['離','兌'],'兌':['坤','乾'],'乾':['兌','坎']};
  const GEN={1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4};
  const gates=ADJ[fp].map(gp=>{const s=base[gp];let usable=false;
    if(s!==5){usable=!YANG.has(PAL_M[NUM2PAL[s]][kind])}
    return{palace:gp,kind:GEN[PAL2NUM[fp]]===PAL2NUM[gp]?'正城門':'副城門',usable}});
  const yd={'中':5,'乾':6,'兌':7,'艮':8,'離':9,'坎':1,'坤':2,'震':3,'巽':4};
  const warnings=[];
  for(const[nm,cc]of[['山星',mt],['向星',fc]]){
    if(FLY.every(q=>cc[q]===yd[q]))warnings.push(nm+'全盤伏吟');
    if(FLY.every(q=>q==='中'?cc[q]===5:cc[q]+yd[q]===10))warnings.push(nm+'全盤反吟');
  }
  return{period,sitting,facing,ti,base,mountain:mt,facing_stars:fc,pattern,
         sanban:fm?'父母三般卦':lz?'連珠三般卦':null,gates,warnings};
}
// 八宅
const TRIB={'乾':7,'兌':6,'離':5,'震':4,'巽':3,'坎':2,'艮':1,'坤':0};
const XSTAR=['伏位','生氣','絕命','五鬼','禍害','六煞','天醫','延年'];
const youxing=(zhai,gong)=>XSTAR[TRIB[zhai]^TRIB[gong]];
const PAL2GUA={'坎':'坎','坤':'坤','震':'震','巽':'巽','乾':'乾','兌':'兌','艮':'艮','離':'離'};


// ── 合婚配對 ──
const LIUHE={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};      // 六合
const SANHE=[[8,0,4],[5,9,1],[2,6,10],[11,3,7]];                        // 三合局
const LIUHAI={0:7,7:0,1:6,6:1,2:5,5:2,3:4,4:3,8:11,11:8,9:10,10:9};     // 六害
const XING=[[0,3],[2,5,8],[1,10,7]];                                     // 相刑組
const WUHE={0:5,5:0,1:6,6:1,2:7,7:2,3:8,8:3,4:9,9:4};                    // 天干五合
const TRIB3={'乾':7,'兌':6,'離':5,'震':4,'巽':3,'坎':2,'艮':1,'坤':0};
const XS3=['伏位','生氣','絕命','五鬼','禍害','六煞','天醫','延年'];
const yx3=(a,b)=>XS3[TRIB3[a]^TRIB3[b]];
const N2G3={1:'坎',2:'坤',3:'震',4:'巽',6:'乾',7:'兌',8:'艮',9:'離'};
const ds3=n=>n<10?n:ds3(Math.floor(n/10)+n%10);
function mg3(y,male){let g=male?ds3((11-ds3(y))===0?9:11-ds3(y)):ds3(ds3(y)+4);if(g===5)g=male?2:8;return N2G3[g]}
// ═══ 抱朴心法・合婚深論 ═══
const HH_XIANCHI={8:9,0:9,4:9,2:3,6:3,10:3,5:6,9:6,1:6,11:0,3:0,7:0};   // 三合局→咸池(桃花)
const HH_HONGYAN={'甲':'午','乙':'申','丙':'寅','丁':'未','戊':'辰','己':'辰','庚':'戌','辛':'酉','壬':'子','癸':'申'};
const HH_GULUAN=['甲寅','乙巳','丙午','丁巳','戊午','戊申','辛亥','壬子'];                       // 孤鸞
const HH_KUIGANG=['庚辰','庚戌','壬辰','戊戌'];                                                  // 魁罡
const HH_YINCHA=['丙子','丁丑','戊寅','辛卯','壬辰','癸巳','丙午','丁未','戊申','辛酉','壬戌','癸亥']; // 陰差陽錯
const HH_MONZ=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
const HH_PIL=['年柱','月柱','日柱','時柱'];
const HH_DOM=['祖蔭與初識印象','原生家庭與長輩緣','夫妻宮(核心)','子女與晚年'];

// 夫妻星:男以財為妻、女以官殺為夫
function spouseStar(p,male){
  const dm=p.day%10, want=male?['正財','偏財']:['正官','七殺'];
  let tou=0,cang=0;const det=[];
  [p.year,p.month,p.day,p.hour].forEach((i,k)=>{
    if(k!==2){const g=tenGod(dm,i%10);if(want.includes(g)){tou++;det.push(HH_PIL[k]+'天干'+ST[i%10]+'('+g+')')}}
    for(const[hs]of HID[BR[i%12]]){const g=tenGod(dm,ST.indexOf(hs));if(want.includes(g)){cang++;det.push(HH_PIL[k]+'藏'+hs+'('+g+')')}}
  });
  return{tou,cang,det,want,n:tou+cang};
}
// 兩支之間的關係
function zhiRel(a,b){
  if(a===b)return [4,6,9,11].includes(a)?['自刑','凶']:['同支','平'];
  if(LIUHE[a]===b)return['六合','吉'];
  if((a+6)%12===b)return['六沖','凶'];
  if(LIUHAI[a]===b)return['相害','凶'];
  if(XING.some(g=>g.includes(a)&&g.includes(b)))return['相刑','凶'];

function buYi(st,p){

  [p.year,p.month,p.day,p.hour].forEach(i=>{

const WENCHANG={'甲':'巳','乙':'午','丙':'申','丁':'酉','戊':'申','己':'酉','庚':'亥','辛':'子','壬':'寅','癸':'卯'};
const YANGREN={'甲':'卯','丙':'午','戊':'午','庚':'酉','壬':'子'};
const LUSHEN={'甲':'寅','乙':'卯','丙':'巳','戊':'巳','丁':'午','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子'};
const JINYU={'甲':'辰','乙':'巳','丙':'未','丁':'申','戊':'未','己':'申','庚':'戌','辛':'亥','壬':'丑','癸':'寅'};
const HONGYAN={'甲':'午','乙':'午','丙':'寅','丁':'未','戊':'辰','己':'辰','庚':'戌','辛':'酉','壬':'子','癸':'申'};
const TIANDE=['丁','申','壬','辛','亥','甲','癸','寅','丙','乙','巳','庚']; // 寅月起
const YUEDE_TRI={'寅午戌':'丙','申子辰':'壬','亥卯未':'甲','巳酉丑':'庚'};
const TRI_GROUP={'申子辰':{tao:'酉',ma:'寅',hua:'辰',jiang:'子',jie:'巳',wang:'亥'},
'寅午戌':{tao:'卯',ma:'申',hua:'戌',jiang:'午',jie:'亥',wang:'巳'},
'巳酉丑':{tao:'午',ma:'亥',hua:'丑',jiang:'酉',jie:'寅',wang:'申'},
'亥卯未':{tao:'子',ma:'巳',hua:'未',jiang:'卯',jie:'申',wang:'寅'}};
const GUCHEN={'亥子丑':['寅','戌'],'寅卯辰':['巳','丑'],'巳午未':['申','辰'],'申酉戌':['亥','未']};
const SS_TXT=(window.BPPACK?BPPACK.proxy('bazi.SS_TXT',false):{});
function shenSha(p){
  const dS=ST[p.day%10],yS=ST[p.year%10];
  const zs=[BR[p.year%12],BR[p.month%12],BR[p.day%12],BR[p.hour%12]];
  const names=['年','月','日','時'];
  const out=[];
  const add=(nm,pos)=>{if(pos.length)out.push([nm,pos.join('、')])};
  add('天乙貴人',zs.map((b,i)=>TIANYI[dS].includes(b)||TIANYI[yS].includes(b)?names[i]:null).filter(Boolean));
  add('文昌貴人',zs.map((b,i)=>b===WENCHANG[dS]?names[i]:null).filter(Boolean));
  add('祿神',zs.map((b,i)=>b===LUSHEN[dS]?names[i]:null).filter(Boolean));
  if(YANGREN[dS])add('羊刃',zs.map((b,i)=>b===YANGREN[dS]?names[i]:null).filter(Boolean));
  add('金輿',zs.map((b,i)=>b===JINYU[dS]?names[i]:null).filter(Boolean));
  add('紅豔煞',zs.map((b,i)=>b===HONGYAN[dS]?names[i]:null).filter(Boolean));
  // 天德月德(依月支)
  const mi=(p.month%12-2+12)%12;
  const td=TIANDE[mi];
  if(ST.includes(td)){if([ST[p.year%10],ST[p.month%10],ST[p.day%10],ST[p.hour%10]].includes(td))out.push(['天德貴人','天干見'+td]);}
  else if(zs.includes(td))out.push(['天德貴人','支見'+td]);
  const mb=BR[p.month%12];
  for(const[k,v]of Object.entries(YUEDE_TRI))if(k.includes(mb)&&[ST[p.year%10],ST[p.month%10],ST[p.day%10],ST[p.hour%10]].includes(v))out.push(['月德貴人','天干見'+v]);
  // 三合系(以年支與日支各取)
  for(const base of [BR[p.year%12],BR[p.day%12]]){
    for(const[k,g]of Object.entries(TRI_GROUP)){
      if(!k.includes(base))continue;
      const tag=(base===BR[p.year%12]?'年支':'日支')+'起';
      const p1=zs.map((b,i)=>b===g.tao?names[i]:null).filter(Boolean);if(p1.length)out.push(['桃花',tag+':'+p1.join('、')]);
      const p2=zs.map((b,i)=>b===g.ma?names[i]:null).filter(Boolean);if(p2.length)out.push(['驛馬',tag+':'+p2.join('、')]);
      const p3=zs.map((b,i)=>b===g.hua?names[i]:null).filter(Boolean);if(p3.length)out.push(['華蓋',tag+':'+p3.join('、')]);
      const p4=zs.map((b,i)=>b===g.jiang?names[i]:null).filter(Boolean);if(p4.length)out.push(['將星',tag+':'+p4.join('、')]);
      const p5=zs.map((b,i)=>b===g.jie?names[i]:null).filter(Boolean);if(p5.length)out.push(['劫煞',tag+':'+p5.join('、')]);
      const p6=zs.map((b,i)=>b===g.wang?names[i]:null).filter(Boolean);if(p6.length)out.push(['亡神',tag+':'+p6.join('、')]);
      break;
    }
  }
  // 孤辰寡宿(年支)
  for(const[k,v]of Object.entries(GUCHEN)){if(k.includes(BR[p.year%12])){
    const a=zs.map((b,i)=>b===v[0]?names[i]:null).filter(Boolean);if(a.length)out.push(['孤辰',a.join('、')]);
    const b2=zs.map((b,i)=>b===v[1]?names[i]:null).filter(Boolean);if(b2.length)out.push(['寡宿',b2.join('、')]);
  }}
  // 空亡(依日柱旬)
  const xun=Math.floor(p.day/10)*10;
  const kb=[BR[(xun+10)%12],BR[(xun+11)%12]];
  const kv=zs.map((b,i)=>kb.includes(b)?names[i]:null).filter(Boolean);
  if(kv.length)out.push(['空亡',kv.join('、')+'柱('+kb.join('')+')']);
  // 去重
  const seen={},res=[];
  for(const[n,v]of out){if(seen[n]){seen[n].push(v)}else{seen[n]=[v];res.push(n)}}
  return res.map(n=>[n,[...new Set(seen[n])].join(' / ')]);
}

const GE_TXT=(window.BPPACK?BPPACK.proxy('bazi.GE_TXT',false):{});
function geju(p,st){
  const mB=BR[p.month%12],dmS=p.day%10;
  const hid=HID[mB];
  const stems=[p.year%10,p.month%10,p.hour%10].map(i=>ST[i]);
  let benqi=hid[0][0],透=null,which='';
  for(const[hs,w]of hid){if(stems.includes(hs)){透=hs;which=(w===hid[0][1]?'本氣':'中餘氣');break}}
  const use=透||benqi;
  const god=tenGod(dmS,ST.indexOf(use));
  let ge;
  if(god==='比肩')ge='建祿格';else if(god==='劫財')ge='羊刃格';
  else if(god==='正官')ge='正官格';else if(god==='七殺')ge='七殺格';
  else if(god==='正財')ge='正財格';else if(god==='偏財')ge='偏財格';
  else if(god==='食神')ge='食神格';else if(god==='傷官')ge='傷官格';
  else if(god==='正印')ge='正印格';else ge='偏印格(梟)';
  const th=TIANEHOU_get(ST[dmS],(p.month%12-2+12)%12);
  return{ge,use,god,透:透?('月令'+use+which+'透干'):('月令本氣'+benqi+'不透,以本氣論格'),th};
}

const B_HE={'子':'丑','丑':'子','寅':'亥','亥':'寅','卯':'戌','戌':'卯','辰':'酉','酉':'辰','巳':'申','申':'巳','午':'未','未':'午'};
const B_CHONG={'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
const B_HAI={'子':'未','未':'子','丑':'午','午':'丑','寅':'巳','巳':'寅','卯':'辰','辰':'卯','申':'亥','亥':'申','酉':'戌','戌':'酉'};
const TG_HE={'甲':'己','己':'甲','乙':'庚','庚':'乙','丙':'辛','辛':'丙','丁':'壬','壬':'丁','戊':'癸','癸':'戊'};
const TG_CHONG={'甲':'庚','庚':'甲','乙':'辛','辛':'乙','丙':'壬','壬':'丙','丁':'癸','癸':'丁'};
const HE_HUA={'甲己':'土','乙庚':'金','丙辛':'水','丁壬':'木','戊癸':'火'};
const B_SANHE=[['申子辰','水'],['寅午戌','火'],['巳酉丑','金'],['亥卯未','木']];
const B_SANHUI=[['寅卯辰','木'],['巳午未','火'],['申酉戌','金'],['亥子丑','水']];
function xingChong(p){
  const names=['年','月','日','時'];
  const ss=[ST[p.year%10],ST[p.month%10],ST[p.day%10],ST[p.hour%10]];
  const bs=[BR[p.year%12],BR[p.month%12],BR[p.day%12],BR[p.hour%12]];
  const out=[];
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    if(TG_HE[ss[i]]===ss[j])out.push(['合','天干',names[i]+ss[i]+'合'+names[j]+ss[j],'化'+(HE_HUA[ss[i]+ss[j]]||HE_HUA[ss[j]+ss[i]])+';主情義相牽、合則有情']);
    if(TG_CHONG[ss[i]]===ss[j])out.push(['沖','天干',names[i]+ss[i]+'沖'+names[j]+ss[j],'主意見相左、變動不安']);
    if(B_HE[bs[i]]===bs[j])out.push(['合','地支六合',names[i]+bs[i]+'合'+names[j]+bs[j],'和合有情,主人緣助力;過多則牽絆']);
    if(B_CHONG[bs[i]]===bs[j])out.push(['沖','地支六沖',names[i]+bs[i]+'沖'+names[j]+bs[j],
      (i===0&&j===2)?'年日相沖:與長輩緣薄、婚姻多波折':(i===1&&j===3)?'月時相沖:中晚年變動、與子女聚少':'主動盪遷移、宮位所主之事不安']);
    if(B_HAI[bs[i]]===bs[j])out.push(['害','六害',names[i]+bs[i]+'害'+names[j]+bs[j],'主暗損、六親不和,恩中招怨']);
  }
  // 三合三會
  for(const[k,wx]of B_SANHE){const idx=[...k].map(c=>bs.indexOf(c));
    if(idx.every(x=>x>=0))out.push(['合','三合局',k+'合'+wx+'局','三合成局,'+wx+'氣大盛,主此五行之事得力']);
    else{const two=[...k].filter(c=>bs.includes(c));if(two.length===2&&(two.includes(k[1])))out.push(['合','半合',two.join('')+'半合'+wx,'半合有情,'+wx+'氣增強']);}}
  for(const[k,wx]of B_SANHUI){const idx=[...k].map(c=>bs.indexOf(c));
    if(idx.every(x=>x>=0))out.push(['合','三會方',k+'會'+wx+'方','三會成方,'+wx+'氣極旺']);}
  // 三刑自刑
  const has=c=>bs.includes(c);
  if(has('寅')&&has('巳')&&has('申'))out.push(['刑','三刑','寅巳申','無恩之刑:主恩將仇報、官非傷病']);
  else{if(has('寅')&&has('巳'))out.push(['刑','相刑','寅刑巳','主是非傷病']);if(has('巳')&&has('申'))out.push(['刑','相刑','巳刑申','刑中帶合,主先合後傷']);}
  if(has('丑')&&has('戌')&&has('未'))out.push(['刑','三刑','丑戌未','恃勢之刑:主刑傷官訟、朋友反目']);
  else{if(has('丑')&&has('戌'))out.push(['刑','相刑','丑刑戌','主爭執損財']);if(has('戌')&&has('未'))out.push(['刑','相刑','戌刑未','主親友失和']);}
  if(has('子')&&has('卯'))out.push(['刑','相刑','子卯刑','無禮之刑:主家庭失和、禮數有失']);
  for(const z of ['辰','午','酉','亥'])if(bs.filter(b=>b===z).length>=2)out.push(['刑','自刑',z+z+'自刑','主自我矛盾、自尋煩惱']);
  return out;
}

  const sc=Math.max(0,Math.min(100,50+items.reduce((s,i)=>s+i[1],0)));

  document.getElementById('patt').innerHTML='<span class="tag '+(sc>=70?'good':sc<45?'warn':'')+'">'+per+'運 '+sitM+'山'+house.facing+'向 · '+(sc>=70?'適合':sc<45?'不建議':'普通')+'</span>';
  document.getElementById('items').innerHTML=items.map(([t,d,src])=>
    '<div class="item"><span>'+t+'<span style="opacity:.45;font-size:11px">('+src+')</span></span><b style="color:'+(d>0?'var(--green)':d<0?'var(--red)':'inherit')+'">'+(d>0?'+':'')+d+'</b></div>').join('');
}

for(let i=1;i<=9;i++)perSel.add(new Option(i,i));perSel.value=9;

<script>
/* ---- BPDAILY 八字・當月與當日運勢 ----
   取法：以扶抑法的喜用神為主軸，十神為輔。
   免費看到干支與吉凶等級（每天回訪的鉤子），詳解為付費。 */
(function(){
  var ID="bp-daily";
  function el(x){ return document.getElementById(x); }
  function build(){
    if(!(window.BPBAZI && window.BPLUCK)) return;
    var bd=el("bd"), bt=el("bt");
    if(!bd || !bd.value) return;
    var y=+bd.value.slice(0,4), m=+bd.value.slice(5,7), d=+bd.value.slice(8,10);
    var hh=(bt && bt.value)? +bt.value.slice(0,2) : 0;
    var p, fav;
    try{ p=BPBAZI.pillars(y,m,d,hh); fav=BPBAZI.favor(p); }catch(e){ return; }
    var n=new Date(), Y=n.getFullYear(), M=n.getMonth()+1, D=n.getDate();
    var L=BPLUCK.dayLuck(p,fav,Y,M,D), mo=BPLUCK.monthOf(Y,M,D), yr=BPLUCK.yearOf(Y,M,D);
    var hrs=BPLUCK.goodHours(fav,L.gan), tr=BPLUCK.monthTrend(p,fav,Y,M,D);
    var col={"大吉":"#7CFC9B","吉":"#B6E7A0","平":"#D8D2C4","小凶":"#E8B06A","凶":"#E88A8A"}[L.level]||"#D8D2C4";
    var S='style="margin-top:10px;padding:9px 11px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.75"';
    var head='<div style="margin:14px 0;padding:14px;border:1px solid rgba(201,169,106,.35);border-radius:12px">'+
      '<h2 style="margin:0 0 8px;font-size:17px">📅 今日運勢　'+Y+"/"+M+"/"+D+'</h2>'+
      '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'+
        '<span style="font-size:26px;font-weight:700;letter-spacing:2px">'+L.gz+'日</span>'+
        '<span style="font-size:20px;font-weight:700;color:'+col+'">'+L.level+'</span>'+
        '<span style="opacity:.75">日主'+p.day.gan+'　今日'+L.gan+'為<b>'+L.ten+'</b></span>'+
      '</div>'+
      '<div style="opacity:.72;font-size:12.5px">流年 '+BPLUCK.gz(yr.idx)+'　流月 '+mo.gan+mo.zhi+'　（流月以節分界，非農曆初一）</div>';
    var deep='<div '+S+'><b>何以如此</b><br>'+
      (L.why.length? L.why.map(function(x){return "・"+x}).join("<br>") : "・今日干支與喜忌無涉，平常心即可")+'</div>';
    if(L.tenTxt){ deep+='<div '+S+'><b>今日主題：'+L.ten+'</b>（'+L.tenTxt.s+'）<br>'+
      '<span style="color:#9BD8A6">宜：'+L.tenTxt.y+'</span><br>'+
      '<span style="color:#E8A08A">忌：'+L.tenTxt.j+'</span></div>'; }
    deep+='<div '+S+'><b>今日吉時</b><br>'+
      hrs.slice(0,3).map(function(h){return "・"+h.label+"　"+h.gz}).join("<br>")+
      '<br><span style="opacity:.7">避開：'+hrs.slice(-2).map(function(h){return h.label}).join("、")+'</span></div>';
    deep+='<div '+S+'><b>本月走勢　'+tr.month+'月</b><br>'+tr.monthText+
      '<br><span style="color:#9BD8A6">最佳：'+tr.best.map(function(x){return x.md+"("+x.gz+")"}).join("、")+'</span>'+
      '<br><span style="color:#E8A08A">避開：'+tr.worst.map(function(x){return x.md+"("+x.gz+")"}).join("、")+'</span></div>';
    var teaser="今日何以吉凶、宜做什麼忌做什麼、幾點最順，以及本月最好與最該避開的日子。";
    var html=head+(window.BPSY? deep : deep)+"</div>";
    var w=el(ID);
    if(!w){ w=document.createElement("div"); w.id=ID;
      var a=el("liunian"), host=a? a.parentNode : null;
      if(host && host.parentNode) host.parentNode.insertBefore(w, host.nextSibling);
      else document.body.appendChild(w); }
    w.innerHTML=html;
    if(window.BPSY && BPSY.bind) BPSY.bind(w);
  }
  function boot(){
    if(!(window.BPBAZI && window.BPLUCK && window.BPSY)) return setTimeout(boot,300);
    build();
    ["bd","bt","sex"].forEach(function(id){ var e=el(id); if(e) e.addEventListener("change",function(){ setTimeout(build,150) }); });
    setTimeout(build,1500);
  }

})();

<script>
(function(){
  var SEC=[["geju","格局・用神","用神何以取此、喜忌如何配，行運逢之當如何取捨。"],
           ["shensha","神煞","各神煞所主吉凶、應在何人何事、如何趨避化解。"],

           ["liunian","流年","流年吉凶所主、應期落在何月，宜做什麼忌做什麼。"]];
  function paid(){ try{ return !!(window.BPSY && BPSY.ok && BPSY.ok()); }catch(e){ return false; } }
  function card(t,s){ try{ if(window.BPSY && BPSY.gate) return BPSY.gate("",t,s); }catch(e){} return ""; }
  var busy=false, tm=null;
  function run(){
    if(busy) return; if(paid()) return;

      var el=document.getElementById(x[0]);
      if(!el || !el.innerHTML) return;

<script>
(function(){
  var P=null, F=null, SEL=null, tm=null;
  function hook(){ if(!window.BPLUCK||!BPLUCK.dayLuck||BPLUCK.__hooked) return false;
    var o=BPLUCK.dayLuck; BPLUCK.dayLuck=function(p,fav,Y,M,D){ P=p; F=fav; return o.apply(this,arguments); }; BPLUCK.__raw=o; BPLUCK.__hooked=1; return true; }
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function calc(y,m,d){
    if(!P||!F||!window.BPLUCK||!BPLUCK.__raw) return "<p class=\"ad-note\">請先在上方填好出生資料。</p>";
    try{
      var L=BPLUCK.__raw(P,F,y,m,d);
      var gh=(BPLUCK.goodHours(F,L.gan)||[]).slice(0,3).map(function(x){return esc(x.label);}).join("、");
      var h="<div class=\"ad-hd\"><span class=\"ad-gz\">"+esc(L.gz)+"日</span><span class=\"ad-lv\">"+esc(L.level)+"</span>";
      if(L.ten) h+="<span class=\"ad-ten\">日主逢 "+esc(L.ten)+"</span>";
      h+="</div>";
      var t=L.tenTxt;
      if(t && typeof t.s==="string"){ h+="<p class=\"ad-l\"><b>今日主題</b>："+esc(t.s)+"</p>";
        if(t.y) h+="<p class=\"ad-l ad-y\"><b>宜</b>："+esc(t.y)+"</p>";
        if(t.j) h+="<p class=\"ad-l ad-j\"><b>忌</b>："+esc(t.j)+"</p>"; }
      if(gh) h+="<p class=\"ad-l\"><b>吉時</b>："+gh+"</p>";
      if(L.why && L.why.length) h+="<p class=\"ad-note\">"+esc([].concat(L.why).join("；"))+"</p>";
      return h;
    }catch(e){ return "<p class=\"ad-note\">推算失敗，請確認日期。</p>"; }
  }
  function draw(){
    var box=document.getElementById("bp-daily"); if(!box||!box.innerHTML) return;
    if(box.querySelector("#bp-anyday")) return;
    var n=new Date(); if(!SEL) SEL=n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2);
    var w=document.createElement("div"); w.id="bp-anyday";
    w.innerHTML='<div class="ad-bar"><b>查任一天的吉凶</b><input type="date" id="ad-date"><button type="button" id="ad-t">今天</button></div><div id="ad-out"></div>';
    box.appendChild(w);
    var inp=w.querySelector("#ad-date"); inp.value=SEL;
    function run(){ SEL=inp.value; if(!SEL) return; var a=SEL.split("-"); document.getElementById("ad-out").innerHTML=calc(+a[0],+a[1],+a[2]); }
    inp.addEventListener("change",run);
    w.querySelector("#ad-t").addEventListener("click",function(){ var d=new Date(); inp.value=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); run(); });
    run();
  }
  function tick(){ hook(); draw(); }
  var mo=new MutationObserver(function(){ clearTimeout(tm); tm=setTimeout(tick,150); });
  function start(){ var b=document.getElementById("bp-daily"); if(b) mo.observe(b,{childList:true}); setInterval(tick,1200); setTimeout(tick,500); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();
</script>
