<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f"><title>八字合婚報告書</title>
<style id="reportCss"></style>
<style>
*{box-sizing:border-box}html,body{height:auto!important;overflow:auto!important;background:#f4efe6!important}
body{margin:0!important;padding:96px 12px 24px!important;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
#bp-print{display:block!important;max-width:820px;margin:0 auto;background:#fff;color:#1a1a1a;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.14)}
.mobileBar{display:block!important;visibility:visible!important;position:fixed;z-index:9999;left:0;right:0;top:0;padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#14110f}
.actions{display:flex!important;align-items:center;justify-content:center;gap:10px}.actions button{display:inline-block!important;visibility:visible!important;opacity:1!important;border:0;border-radius:999px;font:800 15px -apple-system,BlinkMacSystemFont,sans-serif;padding:11px 20px}
#mobileBackBtn{background:#31291f;color:#e8e2d6;border:1px solid rgba(201,169,106,.5)}#mobileSaveBtn{background:#c9a96a;color:#1a1410;flex:1;max-width:360px}
.tip{color:#e8e2d6;text-align:center;font-size:12px;margin-top:7px}.error{max-width:680px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;line-height:1.8}
@media print{.mobileBar{display:none!important}html,body{background:#fff!important}body{padding:0!important}#bp-print{box-shadow:none!important;padding:0!important;max-width:none!important}}
</style></head><body>
<div class="mobileBar"><div class="actions"><button id="mobileBackBtn">‹ 返回</button><button id="mobileSaveBtn">產生／儲存 PDF</button></div><div class="tip" id="mobileStatus">完成後會開啟 iPhone 分享選單，請選「儲存到檔案」</div></div>
<main id="report"></main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<script>
(function(){
  var key='bprpt-mobile-report',raw='',reportTitle='命理報告書';
  try{raw=localStorage.getItem(key)||'';localStorage.removeItem(key)}catch(e){}
  var host=document.getElementById('report');
  if(raw){
    try{var data=JSON.parse(raw);reportTitle=data.title||reportTitle;document.title=reportTitle;if(data.head)document.head.insertAdjacentHTML('afterbegin',data.head);document.getElementById('reportCss').textContent=data.css||'';host.innerHTML=data.html||''}
    catch(e){host.innerHTML='<div class="error">報告資料讀取失敗，請返回後重新按一次列印。</div>'}
  }else host.innerHTML='<div class="error">找不到報告資料，請返回合婚頁後重新按一次列印。</div>';
  function activatePrintStyles(){
    var old=document.getElementById('activePrintCss');if(old)old.remove();var out=[];
    Array.prototype.forEach.call(document.styleSheets,function(sheet){
      try{Array.prototype.forEach.call(sheet.cssRules||[],function(rule){
        if(rule.type===4&&/print/i.test(rule.conditionText||rule.media&&rule.media.mediaText||'')){
          Array.prototype.forEach.call(rule.cssRules||[],function(inner){
            var text=inner.cssText||'';if(!/^body\s*>?\s*\*/i.test(text)&&text.indexOf('.mobileBar')<0)out.push(text);
          });
        }
      })}catch(e){}
    });
    var st=document.createElement('style');st.id='activePrintCss';st.textContent=out.join('\n');document.head.appendChild(st);
  }
  document.getElementById('mobileSaveBtn').onclick=async function(){
    var btn=this,status=document.getElementById('mobileStatus'),target=document.getElementById('bp-print')||host;
    if(!window.html2canvas||!window.jspdf){status.textContent='PDF 工具載入失敗，請確認網路後重新開啟此頁';return}
    btn.disabled=true;btn.textContent='正在產生 PDF…';status.textContent='報告較長時約需數秒，請稍候';
    try{
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      activatePrintStyles();
      var oldWidth=target.style.width,oldMax=target.style.maxWidth;
      target.style.width='794px';target.style.maxWidth='794px';
      var canvas=await html2canvas(target,{scale:1.4,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:target.scrollWidth});
      target.style.width=oldWidth;target.style.maxWidth=oldMax;
      var jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
      var margin=8,pageW=210,pageH=297,useW=pageW-margin*2,useH=pageH-margin*2;
      var slicePx=Math.floor(canvas.width*useH/useW),pages=Math.max(1,Math.ceil(canvas.height/slicePx));
      for(var i=0;i<pages;i++){
        if(i)pdf.addPage();
        var y=i*slicePx,h=Math.min(slicePx,canvas.height-y),part=document.createElement('canvas');
        part.width=canvas.width;part.height=h;
        var ctx=part.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,part.width,part.height);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
        pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,useW,h*useW/canvas.width,undefined,'FAST');
      }
      if(pdf.setProperties)pdf.setProperties({title:reportTitle,author:'抱朴隨緣堂'});
      var fileName=String(reportTitle||'命理報告書').replace(/[\\/:*?"<>|]/g,'-')+'.pdf';
      var blob=pdf.output('blob'),file=new File([blob],fileName,{type:'application/pdf'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        status.textContent='請在分享選單選擇「儲存到檔案」';
        await navigator.share({files:[file],title:reportTitle});
      }else{
        var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(url)},60000);status.textContent='PDF 已產生；若未下載，請查看瀏覽器下載項目';
      }
    }catch(e){
      if(e&&e.name==='AbortError')status.textContent='已取消儲存，可再次按按鈕重試';
      else status.textContent='PDF 產生失敗，請重新開啟報告後再試';
    }finally{
      if(typeof oldWidth!=='undefined'){target.style.width=oldWidth;target.style.maxWidth=oldMax}
      var active=document.getElementById('activePrintCss');if(active)active.remove();
      var bar=document.querySelector('.mobileBar');if(bar)bar.style.setProperty('display','block','important');
      btn.disabled=false;btn.textContent='產生／儲存 PDF';
    }
  };
  document.getElementById('mobileBackBtn').onclick=function(){
    if(window.opener){window.close();return}
    if(history.length>1){history.back();return}
    location.href='index.html';
  };
})();
</script></body></html>
