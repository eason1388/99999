<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f"><title>八字合婚報告書</title>
<style id="reportCss"></style>
<style>
*{box-sizing:border-box}html,body{height:auto!important;overflow:auto!important;background:#f4efe6!important}
body{margin:0!important;padding:96px 12px 24px!important;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
#bp-print{display:block!important;max-width:820px;margin:0 auto;background:#fff;color:#1a1a1a;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.14)}
.mobileBar{position:fixed;z-index:9999;left:0;right:0;top:0;padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#14110f}
.actions{display:flex;align-items:center;justify-content:center;gap:10px}.actions button{border:0;border-radius:999px;font:800 15px -apple-system,BlinkMacSystemFont,sans-serif;padding:11px 20px}
#backBtn{background:#31291f;color:#e8e2d6;border:1px solid rgba(201,169,106,.5)}#printBtn{background:#c9a96a;color:#1a1410;flex:1;max-width:360px}
.tip{color:#e8e2d6;text-align:center;font-size:12px;margin-top:7px}.error{max-width:680px;margin:60px auto;background:#fff;padding:24px;border-radius:14px;line-height:1.8}
@media print{.mobileBar{display:none!important}html,body{background:#fff!important}body{padding:0!important}#bp-print{box-shadow:none!important;padding:0!important;max-width:none!important}}
</style></head><body>
<div class="mobileBar"><div class="actions"><button id="backBtn">‹ 返回</button><button id="printBtn">列印／存成 PDF</button></div><div class="tip">列印視窗出現後，可選擇「儲存到檔案」</div></div>
<main id="report"></main>
<script>
(function(){
  var key='bprpt-mobile-report',raw='';
  try{raw=localStorage.getItem(key)||'';localStorage.removeItem(key)}catch(e){}
  var host=document.getElementById('report');
  if(raw){
    try{var data=JSON.parse(raw);document.title=data.title||document.title;document.getElementById('reportCss').textContent=data.css||'';host.innerHTML=data.html||''}
    catch(e){host.innerHTML='<div class="error">報告資料讀取失敗，請返回後重新按一次列印。</div>'}
  }else host.innerHTML='<div class="error">找不到報告資料，請返回合婚頁後重新按一次列印。</div>';
  document.getElementById('printBtn').onclick=function(){window.print()};
  document.getElementById('backBtn').onclick=function(){
    if(window.opener){window.close();return}
    if(history.length>1){history.back();return}
    location.href='index.html';
  };
})();
</script></body></html>
