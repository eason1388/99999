<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>客戶案件簿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#8C6D3F;--gold2:#C9A96A;--ink:#2b2418;--card:#fffdf7;--red:#A63A2E;--green:#4A6B4F;--bg:#f4efe4;--blue:#3E5C76}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-family:'Noto Serif TC',serif;font-size:20px;color:var(--gold)}
.box{background:var(--card);border:1px solid #e6dcc3;border-radius:16px;padding:12px 14px;width:min(680px,96vw);box-shadow:0 2px 10px rgba(120,90,40,.08)}
h2{font-family:'Noto Serif TC',serif;font-size:16px;color:var(--gold);border-bottom:2px solid var(--gold2);padding-bottom:4px;margin:8px 0}
input,select,textarea{padding:8px 10px;border:1.5px solid var(--gold2);border-radius:10px;background:#fff;color:var(--ink);font-size:14px;font-family:inherit}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}
.big{background:var(--gold);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:15.5px;font-weight:700;cursor:pointer}
.chip{border:1px solid var(--gold);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;background:transparent;color:var(--ink)}
.chip.on{background:var(--gold);color:#fff}
.case{border:1px solid #e6dcc3;border-radius:12px;padding:9px 11px;margin:6px 0;background:#fff}
.case.alert{border-color:var(--red);border-width:2px;background:rgba(166,58,46,.04)}
.case.warn{border-color:#c9944a}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;margin:1px 3px 1px 0;background:#f2ead6;color:#6b5427}
.tag.warn{background:rgba(166,58,46,.14);color:var(--red);font-weight:700}
.tag.mid{background:rgba(201,148,74,.18);color:#8a5a1a}
.tag.good{background:rgba(74,107,79,.12);color:var(--green)}
.note{font-size:12px;opacity:.65;margin-top:6px}
.mini{border:1px solid var(--gold2);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;background:#fff;margin-left:4px}
@media print{#ctrl,.mini,.noprint{display:none!important}body{background:#fff}.box{box-shadow:none;border:0}}
</style></head><body>
<h1>📒 客戶案件簿・流年回訪</h1>
<div class="box" id="ctrl">
<h2>新增/編輯案件</h2>
<div class="row">
 <input id="cName" placeholder="客戶姓名" style="width:120px">
 <input id="cPhone" placeholder="電話/LINE" style="width:130px">
 <input id="cAddr" placeholder="地址/案名" style="flex:1;min-width:150px">
</div>
<div class="row">
 <select id="cType"><option>陽宅</option><option>陰宅</option><option>店面</option><option>辦公室</option><option>工廠</option></select>
 <select id="cSit"></select>
 <select id="cPer"></select>
 <input id="cDate" type="date">
 <input id="cBy" type="number" placeholder="屋主生年" style="width:110px">
</div>
<div class="row">
 <textarea id="cNote" placeholder="備註(格局、已做化解、待辦事項…)" rows="2" style="flex:1;min-width:200px"></textarea>
</div>
<div class="row">
 <button class="big" id="save">💾 儲存案件</button>
 <button class="chip" id="clear">清空欄位</button>
 <span id="editing" style="font-size:12.5px;color:var(--red)"></span>
</div>
<div class="note">資料只存在你這台手機/電腦(離線 localStorage),不會上傳。請定期用下方「匯出備份」保存。</div>
</div>

<div class="box">
<h2>🔔 流年回訪掃描 <input id="scanY" type="number" style="width:82px;padding:3px 7px"></h2>
<div class="row">
 <button class="chip on" id="fAll">全部案件</button>
 <button class="chip" id="fAlert">只看需回訪</button>
 <span id="stat" style="font-size:13px;margin-left:auto"></span>
</div>
<div id="list"></div>
</div>

<div class="box noprint">
<div class="row">
 <button class="chip" id="exp">⬇ 匯出備份(JSON)</button>
 <label class="chip" style="display:inline-block">⬆ 匯入備份<input type="file" id="imp" accept=".json" hidden></label>
 <button class="chip" id="prt">🖨 列印回訪名單</button>
</div>
</div>
<script>
// ── 引擎(飛星+八宅+流年)──
const M24='壬子癸丑艮寅甲卯乙辰巽巳丙午丁未坤申庚酉辛戌乾亥';
const FLY=['中','乾','兌','艮','離','坎','坤','震','巽'];
const PAL_M={'坎':'壬子癸','艮':'丑艮寅','震':'甲卯乙','巽':'辰巽巳','離':'丙午丁','坤':'未坤申','兌':'庚酉辛','乾':'戌乾亥'};
const NUM2PAL={1:'坎',2:'坤',3:'震',4:'巽',6:'乾',7:'兌',8:'艮',9:'離'};
const YANG=new Set('乾坤艮巽甲庚壬丙寅申巳亥');
const DIRZH={'坎':'北','艮':'東北','震':'東','巽':'東南','離':'南','坤':'西南','兌':'西','乾':'西北'};
const GONG8=['坎','艮','震','巽','離','坤','兌','乾'];
const BR='子丑寅卯辰巳午未申酉戌亥',ST='甲乙丙丁戊己庚辛壬癸';
const SX='鼠牛虎兔龍蛇馬羊猴雞狗豬';
const palaceOf=m=>GONG8.find(p=>PAL_M[p].includes(m));
function fly(c,fw){const o={};let s=c;for(const p of FLY){o[p]=s;s=fw?s%9+1:(s-2+9)%9+1}return o}
function xkChart(period,sitting){
  const facing=M24[(M24.indexOf(sitting)+12)%24];
  const base=fly(period,true);
  const sp=palaceOf(sitting),fp=palaceOf(facing);
  const kind=PAL_M[sp].indexOf(sitting);
  const sc=(pal,ref)=>{const s=base[pal];
    if(s===5)return fly(5,YANG.has(ref));
    return fly(s,YANG.has(PAL_M[NUM2PAL[s]][kind]))};
  const mt=sc(sp,sitting),fc=sc(fp,facing);
  const n=period;
  const pattern=mt[sp]===n&&fc[fp]===n?'旺山旺向':mt[fp]===n&&fc[sp]===n?'上山下水':
    mt[fp]===n&&fc[fp]===n?'雙星會向':mt[sp]===n&&fc[sp]===n?'雙星會坐':'其他';
  return{facing,sp,fp,mountain:mt,facing_stars:fc,pattern};
}
// ── 儲存 ──
const KEY='fsc_cases';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){alert('儲存空間不足');return false}};
let cases=load(),editId=null,filt='all';
// ── UI 初始化 ──
const cSit=document.getElementById('cSit'),cPer=document.getElementById('cPer');
for(const m of M24){const o=document.createElement('option');o.value=m;o.textContent=m+'山'+M24[(M24.indexOf(m)+12)%24]+'向';cSit.appendChild(o)}
for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'運';cPer.appendChild(o)}
cPer.value=9;
const today=new Date();
document.getElementById('cDate').value=today.toISOString().slice(0,10);
document.getElementById('scanY').value=today.getFullYear();
document.getElementById('scanY').onchange=render;
document.getElementById('fAll').onclick=()=>{filt='all';swapF();render()};
document.getElementById('fAlert').onclick=()=>{filt='alert';swapF();render()};
function swapF(){document.getElementById('fAll').classList.toggle('on',filt==='all');
  document.getElementById('fAlert').classList.toggle('on',filt==='alert');}
document.getElementById('clear').onclick=()=>{editId=null;document.getElementById('editing').textContent='';
  ['cName','cPhone','cAddr','cBy','cNote'].forEach(i=>document.getElementById(i).value='');};
document.getElementById('save').onclick=()=>{
  const nm=document.getElementById('cName').value.trim();
  if(!nm){alert('請至少填客戶姓名');return}
  const o={id:editId||Date.now(),name:nm,
    phone:document.getElementById('cPhone').value.trim(),
    addr:document.getElementById('cAddr').value.trim(),
    type:document.getElementById('cType').value,
    sit:cSit.value,per:+cPer.value,
    date:document.getElementById('cDate').value,
    by:+document.getElementById('cBy').value||0,
    note:document.getElementById('cNote').value.trim()};
  if(editId){cases=cases.map(c=>c.id===editId?o:c)}else{cases.push(o)}
  if(save(cases)){editId=null;document.getElementById('editing').textContent='';
    ['cName','cPhone','cAddr','cBy','cNote'].forEach(i=>document.getElementById(i).value='');
    render();window.fscP&&window.fscP('cases','save',o.type)}
};
window.editCase=id=>{const c=cases.find(x=>x.id===id);if(!c)return;
  editId=id;document.getElementById('editing').textContent='編輯中:'+c.name;
  document.getElementById('cName').value=c.name;document.getElementById('cPhone').value=c.phone||'';
  document.getElementById('cAddr').value=c.addr||'';document.getElementById('cType').value=c.type;
  cSit.value=c.sit;cPer.value=c.per;document.getElementById('cDate').value=c.date||'';
  document.getElementById('cBy').value=c.by||'';document.getElementById('cNote').value=c.note||'';
  scrollTo({top:0,behavior:'smooth'})};
window.delCase=id=>{if(!confirm('確定刪除此案件?'))return;
  cases=cases.filter(x=>x.id!==id);save(cases);render()};
document.getElementById('exp').onclick=()=>{
  const b=new Blob([JSON.stringify(cases,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='案件簿備份_'+new Date().toISOString().slice(0,10)+'.json';a.click()};
document.getElementById('imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d))throw 0;
    if(confirm('匯入 '+d.length+' 筆?(將與現有合併)')){
      const ids=new Set(cases.map(c=>c.id));
      cases=cases.concat(d.filter(c=>!ids.has(c.id)));save(cases);render()}
  }catch(err){alert('檔案格式錯誤')}};r.readAsText(f)};
document.getElementById('prt').onclick=()=>window.print();
// ── 掃描 ──
function scan(c,yr){
  const alerts=[];
  const ch=xkChart(c.per,c.sit);
  const annS=(11-yr%9-1+9)%9+1,ann=fly(annS,true);
  const yb=((yr-4)%12+12)%12;
  const g5=GONG8.find(g=>ann[g]===5),g2=GONG8.find(g=>ann[g]===2);
  const g8=GONG8.find(g=>ann[g]===8);
  const shaG={8:0,0:0,4:0,2:1,6:1,10:1,5:2,9:2,1:2,11:3,3:3,7:3}[yb];
  const shaP=[['離','坤','兌'],['乾','坎','艮'],['艮','震','巽'],['坤','兌','乾']][shaG];
  // 五黃/二黑臨坐向
  if(g5===ch.fp)alerts.push([3,'五黃到向首('+DIRZH[g5]+')','大門納氣處犯五黃,今年切忌動土修門;宜置金屬重物化洩']);
  else if(g5===ch.sp)alerts.push([3,'五黃到坐山('+DIRZH[g5]+')','坐山犯五黃,忌修方動土']);
  if(g2===ch.fp||g2===ch.sp)alerts.push([2,'二黑臨'+(g2===ch.fp?'向首':'坐山')+'('+DIRZH[g2]+')','病符臨門,提醒屋主留意健康,宜金屬葫蘆化解']);
  // 歲破/太歲坐山
  const bi=BR.indexOf(c.sit);
  if(bi>=0){
    if(bi===(yb+6)%12)alerts.push([3,'坐山歲破('+c.sit+')','本年切忌動土修造、安床立碑!']);
    else if(bi===yb)alerts.push([1,'坐山值太歲('+c.sit+')','宜靜不宜動,可安太歲']);
  }
  // 三煞方涵蓋坐山
  if(shaP.includes(ch.sp))alerts.push([2,'三煞方在坐山('+DIRZH[ch.sp]+')','三煞不可犯,今年忌此方動工']);
  // 屋主生肖沖太歲
  if(c.by){
    const ob=((c.by-4)%12+12)%12;
    if(ob===(yb+6)%12)alerts.push([2,'屋主沖太歲(屬'+SX[ob]+')','屋主本年沖太歲,宜安太歲、行善,並避免重大變動']);
    else if(ob===yb)alerts.push([1,'屋主值太歲(屬'+SX[ob]+')','本命年,宜安太歲']);
  }
  // 吉訊
  const goods=[];
  if(g8===ch.fp)goods.push('八白財星到向首,今年財運加持,宜催財佈局');
  if(g8&&g8!==ch.fp)goods.push('今年財位在'+DIRZH[g8]);
  // 距上次勘察年數
  let yrsAgo=null;
  if(c.date){const d=new Date(c.date);yrsAgo=((new Date()).getFullYear()-d.getFullYear());}
  if(yrsAgo!==null&&yrsAgo>=3)alerts.push([1,'已'+yrsAgo+'年未回訪','建議主動聯繫關心,檢視宅運變化']);
  alerts.sort((a,b)=>b[0]-a[0]);
  return{alerts,goods,ch,annS};
}
function render(){
  const yr=+document.getElementById('scanY').value||today.getFullYear();
  const rows=cases.map(c=>({c,s:scan(c,yr)}));
  const need=rows.filter(r=>r.s.alerts.some(a=>a[0]>=2));
  document.getElementById('stat').innerHTML='共 <b>'+cases.length+'</b> 件・需回訪 <b style="color:var(--red)">'+need.length+'</b> 件';
  const show=filt==='alert'?need:rows;
  show.sort((a,b)=>(Math.max(0,...b.s.alerts.map(x=>x[0])))-(Math.max(0,...a.s.alerts.map(x=>x[0]))));
  document.getElementById('list').innerHTML=show.length?show.map(({c,s})=>{
    const lv=Math.max(0,...s.alerts.map(a=>a[0]));
    return '<div class="case '+(lv>=3?'alert':lv===2?'warn':'')+'">'
     +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">'
     +'<b style="font-size:16px">'+c.name+'</b>'
     +'<span style="font-size:12.5px;opacity:.7">'+c.type+'・'+c.sit+'山'+s.ch.facing+'向・'+c.per+'運'+(c.date?'・勘於'+c.date:'')+'</span>'
     +'<span style="margin-left:auto"><button class="mini" onclick="editCase('+c.id+')">編輯</button><button class="mini" onclick="delCase('+c.id+')">刪</button></span></div>'
     +(c.addr||c.phone?'<div style="font-size:12.5px;opacity:.75">'+(c.addr||'')+(c.phone?' ・'+c.phone:'')+'</div>':'')
     +'<div style="margin-top:4px">'+s.alerts.map(a=>'<span class="tag '+(a[0]>=3?'warn':a[0]===2?'mid':'')+'">'+(a[0]>=3?'⚠ ':'')+a[1]+'</span>').join('')
     +s.goods.map(g=>'<span class="tag good">'+g+'</span>').join('')+'</div>'
     +(s.alerts.length?'<div style="font-size:12.5px;margin-top:3px;line-height:1.7">'+s.alerts.map(a=>'・'+a[2]).join('<br>')+'</div>':'<div style="font-size:12.5px;opacity:.6;margin-top:3px">本年無重大煞氣犯坐向,可作例行問候。</div>')
     +(c.note?'<div style="font-size:12px;opacity:.65;margin-top:3px;border-top:1px dashed #e0d5ba;padding-top:3px">備註:'+c.note+'</div>':'')
     +'</div>';}).join('')
   :'<div style="font-size:13.5px;opacity:.7;padding:8px 0">'+(cases.length?'本年無需回訪案件。':'尚無案件,請於上方新增。')+'</div>';
}
render();
</script></body></html>
